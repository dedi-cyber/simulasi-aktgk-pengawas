ah siswa terdaftar atau dokumen kebijakan semata."},{"m":2,"q":"Pak Pengawas Ghazali mengintegrasikan nilai kejujuran dan objektivitas dalam melaksanakan evaluasi, memastikan hasil evaluasi mencerminkan kondisi riil tanpa manipulasi data. Pendekatan ini mencerminkan...","o":["Formalitas administratif semata","Tidak relevan dengan prinsip evaluasi modern","Integritas profesional yang penting dalam evaluasi pendidikan, memastikan hasil evaluasi dapat dipercaya dan digunakan sebagai dasar perbaikan yang tepat","Hanya relevan bagi pengawas yang religius","Menghambat kelancaran proses evaluasi"],"k":2,"p":"Integritas profesional (kejujuran dan objektivitas) sangat penting dalam evaluasi pendidikan, memastikan hasil evaluasi mencerminkan kondisi riil dan dapat dipercaya sebagai dasar perbaikan yang tepat, bukan data yang dimanipulasi demi citra semata."},{"m":2,"q":"Untuk mengevaluasi efektivitas sistem penilaian (asesmen) yang diterapkan madrasah binaan, pengawas perlu menelaah kesesuaian antara...","o":["Hanya jumlah soal ujian yang dibuat","Kecepatan guru mengoreksi hasil ujian","Kerapian format dokumen penilaian semata","Teknik penilaian, tujuan pembelajaran, dan karakteristik kompetensi yang hendak diukur (kognitif, afektif, psikomotorik)","Warna kertas soal ujian yang digunakan"],"k":3,"p":"Telaah efektivitas sistem penilaian mencakup kesesuaian teknik penilaian, tujuan pembelajaran, dan karakteristik kompetensi yang diukur, memastikan asesmen benar-benar mengukur capaian yang dimaksud, bukan sekadar aspek administratif formal."},{"m":2,"q":"Bu Pengawas Salamah menggunakan hasil evaluasi sebagai bahan diskusi reflektif bersama kepala madrasah dan guru, bukan sekadar menyampaikan hasil secara sepihak. Manfaat utama pendekatan dialogis ini adalah...","o":["Hanya memperlambat proses tindak lanjut","Tidak relevan dengan tujuan evaluasi pendidikan","Mengurangi objektivitas hasil evaluasi","Membangun pemahaman bersama tentang makna hasil evaluasi dan merumuskan solusi secara kolaboratif, meningkatkan komitmen implementasi perbaikan","Hanya efektif dengan kepala madrasah yang sudah berpengalaman"],"k":3,"p":"Pendekatan dialogis dalam membahas hasil evaluasi membangun pemahaman bersama tentang makna hasil dan merumuskan solusi secara kolaboratif, meningkatkan komitmen pihak madrasah dalam mengimplementasikan perbaikan yang direkomendasikan."},{"m":2,"q":"Untuk menilai kualitas soal ujian yang disusun guru madrasah binaan, pengawas dapat menelaah aspek...","o":["Hanya jumlah soal yang dibuat","Kesesuaian dengan kisi-kisi, tingkat kesulitan yang proporsional, serta kejelasan rumusan soal dan kunci jawaban","Kerapian pengetikan semata","Warna kertas ujian","Kecepatan waktu pembuatan soal oleh guru"],"k":1,"p":"Telaah kualitas soal ujian mencakup kesesuaian dengan kisi-kisi, tingkat kesulitan yang proporsional, serta kejelasan rumusan soal dan kunci jawaban, memastikan soal benar-benar valid mengukur kompetensi yang dimaksud."},{"m":2,"q":"Pak Pengawas Yudhistira merancang evaluasi program dengan melibatkan indikator kuantitatif (skor, angka) dan kualitatif (narasi, observasi) secara seimbang. Manfaat utama pendekatan mixed-method ini adalah...","o":["Hanya menambah kompleksitas tanpa manfaat tambahan","Hanya efektif untuk evaluasi berskala besar","Mengurangi objektivitas evaluasi","Tidak relevan dengan tujuan evaluasi pendidikan","Memberikan gambaran yang lebih holistik dan mendalam, menggabungkan kekuatan data terukur dengan konteks dan nuansa yang tidak tertangkap angka semata"],"k":4,"p":"Pendekatan mixed-method (kuantitatif-kualitatif) memberikan gambaran lebih holistik dan mendalam, menggabungkan kekuatan data terukur dengan konteks dan nuansa yang tidak tertangkap angka semata, menghasilkan evaluasi yang lebih kaya dan bermakna."},{"m":2,"q":"Untuk mengevaluasi efektivitas kepemimpinan pembelajaran (instructional leadership) kepala madrasah, pengawas perlu menilai...","o":["Keterlibatan aktif kepala madrasah dalam memantau, membina, dan meningkatkan kualitas proses belajar-mengajar secara langsung","Hanya kehadiran kepala madrasah di sekolah","Kerapian penampilan kepala madrasah","Popularitas kepala madrasah di kalangan siswa","Jumlah rapat yang dipimpin kepala madrasah"],"k":0,"p":"Evaluasi kepemimpinan pembelajaran menilai keterlibatan aktif kepala madrasah dalam memantau dan membina kualitas proses belajar-mengajar secara langsung, bukan sekadar indikator administratif atau permukaan seperti kehadiran semata."},{"m":2,"q":"Bu Pengawas Wulandari menerapkan prinsip evaluasi yang adil (fairness), memastikan seluruh madrasah binaan dinilai dengan standar dan kesempatan yang setara. Prinsip ini penting karena...","o":["Hanya untuk formalitas administratif","Tidak berpengaruh terhadap kualitas hasil evaluasi","Menjamin kredibilitas hasil evaluasi dan mencegah kesenjangan perlakuan yang dapat merugikan madrasah tertentu","Mengurangi fleksibilitas pengawas dalam menilai konteks unik madrasah","Hanya relevan untuk evaluasi berskala nasional"],"k":2,"p":"Prinsip keadilan (fairness) dalam evaluasi menjamin kredibilitas hasil dan mencegah kesenjangan perlakuan yang dapat merugikan madrasah tertentu, memastikan seluruh madrasah binaan dinilai dengan standar dan kesempatan yang setara."},{"m":2,"q":"Untuk memastikan evaluasi program madrasah binaan berdampak pada perbaikan berkelanjutan (bukan hanya laporan formalitas), pengawas perlu memastikan adanya...","o":["Laporan evaluasi yang disimpan sebagai arsip semata","Siklus tindak lanjut yang jelas, mencakup rencana aksi, implementasi, dan evaluasi ulang untuk memastikan perbaikan benar-benar terjadi","Evaluasi yang dilakukan hanya sekali tanpa pengulangan","Rekomendasi yang tidak perlu dipantau implementasinya","Hasil evaluasi yang hanya disampaikan secara lisan tanpa dokumentasi"],"k":1,"p":"Dampak berkelanjutan dari evaluasi memerlukan siklus tindak lanjut yang jelas — rencana aksi, implementasi, dan evaluasi ulang — memastikan perbaikan benar-benar terjadi, bukan sekadar laporan yang berhenti sebagai dokumen formalitas."},{"m":2,"q":"Pak Pengawas Rasyid menggunakan hasil evaluasi kinerja guru sebagai salah satu data pendukung Pengelolaan Kinerja Guru (PMM), diintegrasikan dengan hasil supervisi akademik. Manfaat utama integrasi ini adalah...","o":["Hanya menambah beban administratif","Hanya bermanfaat bagi guru senior","Tidak relevan dengan tugas evaluasi pendidikan pengawas","Menggantikan sepenuhnya peran kepala madrasah dalam penilaian kinerja","Memberikan gambaran kinerja guru yang lebih komprehensif dan konsisten, menghindari duplikasi penilaian yang tidak sinkron antarsistem"],"k":4,"p":"Integrasi hasil evaluasi dengan sistem PMM memberikan gambaran kinerja guru yang lebih komprehensif dan konsisten, menghindari duplikasi atau ketidaksinkronan antara berbagai sistem penilaian yang ada."},{"m":2,"q":"Untuk mengembangkan kompetensi diri dalam bidang evaluasi pendidikan secara berkelanjutan, pengawas perlu...","o":["Mempelajari perkembangan metodologi evaluasi terkini, mengikuti pelatihan, dan aktif dalam forum profesi pengawas","Mengandalkan pengetahuan lama tanpa pembaruan","Menghindari metode evaluasi baru karena dianggap merepotkan","Hanya mengandalkan template evaluasi yang sudah ada tanpa penyesuaian","Membatasi diri pada evaluasi administratif semata"],"k":0,"p":"Pengembangan kompetensi berkelanjutan dalam evaluasi pendidikan memerlukan pembelajaran metodologi evaluasi terkini, partisipasi pelatihan, dan forum profesi, memastikan kompetensi evaluasi pengawas tetap relevan dan mutakhir."},{"m":2,"q":"Bu Pengawas Zahra merancang instrumen evaluasi yang mempertimbangkan konteks unik masing-masing madrasah binaan (mis. madrasah di daerah terpencil vs perkotaan), bukan instrumen yang seragam mutlak. Manfaat utama pendekatan kontekstual ini adalah...","o":["Hanya menambah kerumitan penyusunan instrumen","Tidak relevan dengan prinsip evaluasi yang objektif","Mengurangi standar mutu yang harus dicapai semua madrasah","Menghasilkan evaluasi yang lebih adil dan relevan, mempertimbangkan tantangan dan sumber daya berbeda yang dihadapi masing-masing madrasah","Hanya efektif untuk madrasah di daerah terpencil"],"k":3,"p":"Evaluasi kontekstual yang mempertimbangkan perbedaan kondisi madrasah menghasilkan penilaian yang lebih adil dan relevan, mengakui tantangan dan sumber daya berbeda tanpa mengorbankan standar mutu yang tetap menjadi acuan bersama."},{"m":2,"q":"Untuk memastikan hasil evaluasi pendidikan dapat dipahami dan dimanfaatkan oleh berbagai pemangku kepentingan (guru, kepala madrasah, komite), pengawas perlu menyajikan laporan dalam bentuk...","o":["Hanya angka statistik tanpa penjelasan","Istilah teknis yang kompleks tanpa penyederhanaan","Bahasa yang jelas dan mudah dipahami, disertai visualisasi data sederhana dan rekomendasi praktis yang actionable","Laporan yang sangat panjang tanpa ringkasan eksekutif","Hanya disampaikan secara lisan tanpa dokumen tertulis"],"k":2,"p":"Laporan evaluasi yang efektif disajikan dalam bahasa jelas dan mudah dipahami, disertai visualisasi data sederhana dan rekomendasi praktis, memastikan seluruh pemangku kepentingan (bukan hanya kalangan teknis) dapat memahami dan memanfaatkan hasil evaluasi."},{"m":2,"q":"Evaluasi yang dilakukan sebelum program dimulai untuk mengidentifikasi kebutuhan dan kondisi awal disebut evaluasi...","o":["Diagnostik/kebutuhan (needs assessment)","Sumatif","Formatif pertengahan","Terminal","Ex-post"],"k":0,"p":"Evaluasi diagnostik/kebutuhan (needs assessment) dilakukan sebelum program dimulai untuk mengidentifikasi kebutuhan dan kondisi awal, menjadi dasar perancangan program yang tepat sasaran sesuai kondisi riil yang dihadapi."},{"m":2,"q":"Pak Pengawas Hamid menggunakan hasil evaluasi untuk memetakan madrasah binaan ke dalam kategori (mis. mandiri, berkembang, rintisan) guna menyesuaikan strategi pembinaan. Manfaat utama pendekatan pemetaan ini adalah...","o":["Hanya melabeli madrasah tanpa manfaat praktis","Hanya bermanfaat bagi madrasah kategori mandiri","Menciptakan diskriminasi antarmadrasah binaan","Tidak relevan dengan tujuan evaluasi pendidikan","Memungkinkan strategi pembinaan yang lebih tepat sasaran dan proporsional sesuai tingkat kebutuhan masing-masing kategori madrasah"],"k":4,"p":"Pemetaan madrasah berdasarkan hasil evaluasi memungkinkan strategi pembinaan yang lebih tepat sasaran dan proporsional, memberikan perhatian sesuai tingkat kebutuhan masing-masing kategori, bukan pendekatan seragam yang kurang efisien."},{"m":2,"q":"Untuk menilai keakuratan data yang dilaporkan madrasah binaan dalam sistem informasi (EMIS), pengawas perlu melakukan...","o":["Hanya menerima data tanpa verifikasi","Verifikasi silang data yang dilaporkan dengan kondisi riil di lapangan melalui kunjungan dan observasi langsung","Mengabaikan potensi ketidakakuratan data","Mempercayai sepenuhnya laporan tanpa validasi","Hanya memeriksa data sekali dalam setahun tanpa pembaruan"],"k":1,"p":"Verifikasi silang data EMIS dengan kondisi riil di lapangan melalui kunjungan dan observasi langsung memastikan keakuratan data yang dilaporkan, penting karena data ini sering menjadi dasar pengambilan kebijakan dan alokasi sumber daya."},{"m":2,"q":"Bu Pengawas Aminah mengevaluasi dampak program bantuan operasional terhadap peningkatan mutu madrasah binaan dengan membandingkan indikator sebelum dan sesudah bantuan diterima. Pendekatan evaluasi ini termasuk evaluasi...","o":["Proses semata","Input tanpa melihat hasil","Dampak (impact evaluation)","Administratif murni","Reaktif tanpa perencanaan"],"k":2,"p":"Evaluasi dampak (impact evaluation) menilai perubahan yang terjadi akibat suatu program atau intervensi (bantuan operasional) dengan membandingkan kondisi sebelum dan sesudah, memberikan bukti nyata tentang efektivitas program terhadap peningkatan mutu."},{"m":2,"q":"Untuk memastikan evaluasi program keagamaan (mis. praktik ibadah, tahfizh) di madrasah dilakukan secara tepat, pengawas perlu menilai...","o":["Hanya jumlah hafalan yang dicapai siswa","Popularitas program di kalangan wali santri","Hanya kerapian dokumentasi program","Kesesuaian proses pembinaan dengan tujuan pembentukan karakter dan pemahaman keagamaan yang mendalam, bukan sekadar capaian kuantitatif","Durasi program tanpa melihat kualitas pembinaan"],"k":3,"p":"Evaluasi program keagamaan perlu menilai kesesuaian proses pembinaan dengan tujuan pembentukan karakter dan pemahaman keagamaan yang mendalam, bukan sekadar capaian kuantitatif seperti jumlah hafalan tanpa melihat kualitas pemahaman dan penghayatan."},{"m":2,"q":"Pak Pengawas Nasrullah menyusun rencana evaluasi yang mempertimbangkan keterbatasan waktu dan sumber daya, memilih fokus evaluasi yang paling prioritas dibanding mencoba mengevaluasi semua aspek sekaligus. Prinsip ini mencerminkan...","o":["Evaluasi yang tidak lengkap dan kurang bertanggung jawab","Tidak relevan dengan prinsip evaluasi komprehensif","Mengabaikan aspek penting demi kepraktisan semata","Efisiensi dan fokus strategis dalam evaluasi, memastikan sumber daya terbatas dialokasikan pada aspek yang paling berdampak","Hanya berlaku untuk pengawas dengan banyak madrasah binaan"],"k":3,"p":"Memilih fokus evaluasi prioritas mencerminkan efisiensi dan fokus strategis, memastikan sumber daya terbatas (waktu, tenaga) dialokasikan pada aspek yang paling berdampak, lebih realistis dibanding mencoba mengevaluasi semua aspek sekaligus secara dangkal."},{"m":2,"q":"Untuk mengevaluasi efektivitas transisi pembelajaran dari kurikulum lama ke kurikulum baru di madrasah binaan, pengawas perlu membandingkan...","o":["Hanya nama kurikulum yang digunakan","Kesiapan guru, ketersediaan sumber belajar, dan capaian siswa sebelum dan selama masa transisi, untuk menilai kelancaran implementasi","Jumlah halaman dokumen kurikulum baru","Popularitas kurikulum baru di kalangan orang tua","Kecepatan sosialisasi kurikulum tanpa melihat implementasi nyata"],"k":1,"p":"Evaluasi transisi kurikulum perlu membandingkan kesiapan guru, ketersediaan sumber belajar, dan capaian siswa sebelum-selama masa transisi, memberikan gambaran nyata tentang kelancaran implementasi kebijakan kurikulum baru di lapangan."},{"m":3,"q":"Penelitian yang dilakukan pengawas untuk memperbaiki dan meningkatkan kualitas praktik kepengawasan melalui siklus tindakan reflektif disebut...","o":["Penelitian eksperimen murni","Penelitian korelasional","Penelitian deskriptif semata","Studi kasus tanpa intervensi","Penelitian Tindakan Sekolah/Kepengawasan (PTS/PTK Pengawas)"],"k":4,"p":"Penelitian Tindakan Sekolah/Kepengawasan (PTS) adalah penelitian yang dilakukan pengawas untuk memperbaiki dan meningkatkan kualitas praktik kepengawasan melalui siklus tindakan reflektif (perencanaan- pelaksanaan-observasi-refleksi) yang berulang."},{"m":3,"q":"Pengawas Pak Yunus merancang PTS untuk meningkatkan efektivitas program pendampingan literasi di madrasah binaannya. Tahap pertama dalam siklus PTS yang perlu dilakukan adalah...","o":["Melakukan identifikasi masalah dan menyusun perencanaan tindakan (planning) berdasarkan analisis kondisi awal","Langsung melaksanakan tindakan tanpa perencanaan","Menyusun laporan akhir penelitian","Mempublikasikan hasil penelitian ke jurnal","Mengumpulkan data pasca-tindakan"],"k":0,"p":"Siklus PTS diawali dengan identifikasi masalah dan penyusunan perencanaan tindakan (planning) berdasarkan analisis kondisi awal, menjadi dasar bagi pelaksanaan tindakan yang akan diobservasi dan direfleksikan pada tahap selanjutnya."},{"m":3,"q":"Untuk memastikan penelitian yang dilakukan pengawas memiliki manfaat praktis bagi peningkatan mutu madrasah binaan, topik penelitian sebaiknya...","o":["Dipilih secara acak tanpa mempertimbangkan konteks","Mengikuti tren penelitian internasional tanpa relevansi lokal","Berangkat dari permasalahan riil yang dihadapi madrasah binaan, sehingga hasil penelitian dapat langsung diaplikasikan untuk perbaikan","Hanya berdasarkan minat pribadi pengawas tanpa mempertimbangkan kebutuhan madrasah","Disusun tanpa melibatkan data dari madrasah binaan"],"k":2,"p":"Topik penelitian pengawas yang bermanfaat sebaiknya berangkat dari permasalahan riil yang dihadapi madrasah binaan, memastikan hasil penelitian relevan dan dapat langsung diaplikasikan untuk perbaikan praktik di lapangan."},{"m":3,"q":"Bu Pengawas Aisyah mengembangkan model pendampingan berbasis coaching untuk madrasah binaannya, kemudian mendokumentasikan proses pengembangannya secara sistematis sebagai karya inovatif. Jenis kegiatan pengembangan profesi ini disebut...","o":["Penelitian eksperimen laboratorium","Pengembangan karya inovatif/model pembinaan","Studi pustaka semata","Terjemahan buku ilmiah","Plagiarisme karya orang lain"],"k":1,"p":"Pengembangan karya inovatif/model pembinaan adalah kegiatan pengembangan profesi yang menghasilkan model, metode, atau pendekatan baru (seperti model pendampingan berbasis coaching) yang didokumentasikan secara sistematis sebagai kontribusi keilmuan."},{"m":3,"q":"Untuk menjamin validitas hasil PTS yang dilakukan, pengawas perlu memastikan pengumpulan data menggunakan...","o":["Hanya opini pribadi tanpa data pendukung","Metode yang tidak konsisten antarsiklus penelitian","Data yang direkayasa agar hasil sesuai harapan","Sumber data tunggal tanpa verifikasi","Instrumen yang sesuai dengan tujuan penelitian dan triangulasi sumber data untuk meningkatkan kredibilitas temuan"],"k":4,"p":"Validitas hasil PTS memerlukan instrumen yang sesuai dengan tujuan penelitian dan triangulasi sumber data (observasi, wawancara, dokumen) untuk meningkatkan kredibilitas temuan, memastikan hasil penelitian dapat dipercaya dan bermanfaat."},{"m":3,"q":"Pak Pengawas Ramadhan menyusun artikel ilmiah dari hasil PTS yang telah dilaksanakan untuk dipublikasikan di jurnal pendidikan. Manfaat utama publikasi ini adalah...","o":["Berkontribusi pada pengembangan ilmu pengetahuan kepengawasan sekaligus berbagi praktik baik yang dapat dimanfaatkan pengawas lain","Hanya untuk memenuhi syarat administratif kepangkatan semata","Tidak relevan dengan tugas pokok pengawas","Menggantikan sepenuhnya tugas pembinaan langsung ke madrasah","Hanya bermanfaat bagi pengawas yang bersangkutan"],"k":0,"p":"Publikasi hasil PTS berkontribusi pada pengembangan ilmu pengetahuan kepengawasan sekaligus berbagi praktik baik yang dapat dimanfaatkan pengawas lain, memperluas dampak penelitian melampaui kepentingan administratif kepangkatan semata."},{"m":3,"q":"Tahap dalam siklus PTS yang dilakukan untuk mengamati dan mengumpulkan data selama tindakan dilaksanakan disebut tahap...","o":["Perencanaan (planning)","Publikasi","Refleksi (reflecting)","Observasi (observing)","Diseminasi"],"k":3,"p":"Tahap observasi (observing) dalam siklus PTS dilakukan untuk mengamati dan mengumpulkan data selama tindakan dilaksanakan, menjadi dasar bagi tahap refleksi berikutnya untuk menilai efektivitas tindakan yang diterapkan."},{"m":3,"q":"Bu Pengawas Halimah melibatkan kepala madrasah dan guru dalam proses penelitian tindakan yang dilakukannya, bukan melakukannya secara sepihak. Manfaat utama pendekatan kolaboratif ini adalah...","o":["Hanya memperlambat proses penelitian","Mengurangi objektivitas hasil penelitian","Meningkatkan relevansi penelitian dengan kebutuhan riil serta memperkuat rasa kepemilikan terhadap hasil dan implementasi tindak lanjutnya","Tidak relevan dengan tujuan penelitian tindakan","Hanya efektif untuk madrasah kecil"],"k":2,"p":"Penelitian tindakan kolaboratif yang melibatkan kepala madrasah dan guru meningkatkan relevansi dengan kebutuhan riil serta memperkuat rasa kepemilikan terhadap hasil, memperkuat keberlanjutan implementasi tindak lanjut penelitian."},{"m":3,"q":"Untuk menyusun rumusan masalah penelitian tindakan yang baik, pengawas perlu memastikan rumusan tersebut...","o":["Spesifik, dapat diukur, dan berkaitan langsung dengan praktik kepengawasan yang ingin diperbaiki","Bersifat sangat luas agar mencakup semua aspek pendidikan","Disusun tanpa data pendukung awal","Meniru rumusan masalah penelitian lain tanpa penyesuaian konteks","Tidak perlu dikaitkan dengan tindakan yang akan dilakukan"],"k":0,"p":"Rumusan masalah penelitian tindakan yang baik bersifat spesifik, dapat diukur, dan berkaitan langsung dengan praktik kepengawasan yang ingin diperbaiki, memastikan penelitian terarah dan hasilnya dapat dievaluasi secara jelas."},{"m":3,"q":"Pak Pengawas Firdaus mengembangkan modul pelatihan berbasis hasil penelitiannya tentang kesulitan guru menerapkan pembelajaran berdiferensiasi. Kegiatan ini mencerminkan pemanfaatan hasil penelitian untuk...","o":["Hanya kepentingan akademik semata tanpa aplikasi praktis","Hanya bermanfaat bagi pengawas yang menyusunnya","Menggantikan sepenuhnya kebutuhan penelitian lanjutan","Tidak relevan dengan tugas kepengawasan","Pengembangan produk/karya nyata yang dapat langsung digunakan untuk pembinaan, menjembatani teori penelitian dengan praktik di lapangan"],"k":4,"p":"Mengembangkan modul pelatihan berbasis hasil penelitian mencerminkan pemanfaatan penelitian untuk menghasilkan produk/karya nyata yang dapat langsung digunakan dalam pembinaan, menjembatani teori penelitian dengan aplikasi praktis di lapangan."},{"m":3,"q":"Untuk memastikan penelitian yang dilakukan pengawas sesuai kaidah etika penelitian, hal yang perlu diperhatikan adalah...","o":["Mengabaikan persetujuan dari pihak yang terlibat dalam penelitian","Memperoleh persetujuan (informed consent), menjaga kerahasiaan data pribadi, dan melaporkan hasil secara jujur tanpa manipulasi","Menggunakan data tanpa izin dari subjek penelitian","Mempublikasikan data pribadi guru/siswa tanpa penyamaran","Mengubah hasil penelitian agar sesuai harapan pihak tertentu"],"k":1,"p":"Etika penelitian mengharuskan pengawas memperoleh persetujuan dari pihak terlibat, menjaga kerahasiaan data pribadi, dan melaporkan hasil secara jujur tanpa manipulasi, memastikan penelitian dilakukan secara bertanggung jawab dan menghormati subjek penelitian."},{"m":3,"q":"Bu Pengawas Kartika menggunakan hasil penelitiannya sebagai dasar merancang program pembinaan berkelanjutan bagi madrasah binaan, bukan sekadar menyelesaikan kewajiban administratif. Pendekatan ini mencerminkan prinsip penelitian yang...","o":["Hanya formalitas kepangkatan semata","Tidak relevan dengan tugas pokok pengawas","Aplikatif dan berorientasi pada perbaikan praktik nyata, menjadikan penelitian sebagai alat perbaikan berkelanjutan bukan sekadar kewajiban administratif","Terpisah sepenuhnya dari tugas pembinaan","Hanya bermanfaat jika dipublikasikan secara luas"],"k":2,"p":"Menggunakan hasil penelitian sebagai dasar program pembinaan berkelanjutan mencerminkan prinsip penelitian yang aplikatif dan berorientasi pada perbaikan praktik nyata, menjadikan penelitian sebagai alat perbaikan berkelanjutan yang bermakna, bukan sekadar kewajiban administratif."},{"m":3,"q":"Untuk mengukur keberhasilan tindakan dalam siklus PTS, pengawas perlu menetapkan...","o":["Kriteria yang berubah-ubah setiap siklus tanpa konsistensi","Standar keberhasilan berdasarkan opini subjektif semata","Kriteria yang sangat umum tanpa batasan jelas","Indikator keberhasilan yang jelas dan terukur sejak awal, menjadi acuan menilai efektivitas tindakan yang dilakukan","Tidak perlu menetapkan indikator karena bersifat fleksibel"],"k":3,"p":"Keberhasilan tindakan dalam PTS perlu diukur dengan indikator keberhasilan yang jelas dan terukur sejak awal penelitian, menjadi acuan objektif untuk menilai apakah tindakan yang dilakukan benar-benar efektif mengatasi permasalahan yang diidentifikasi."},{"m":3,"q":"Pak Pengawas Budiman melakukan kajian literatur secara mendalam sebelum merancang PTS-nya tentang strategi peningkatan kompetensi digital guru. Manfaat utama langkah ini adalah...","o":["Hanya formalitas administratif penelitian","Menggantikan sepenuhnya kebutuhan data lapangan","Tidak relevan dengan penelitian tindakan yang bersifat praktis","Memastikan penelitian dibangun di atas fondasi teori dan temuan penelitian sebelumnya yang relevan, menghindari duplikasi dan memperkuat kerangka konseptual","Hanya diperlukan untuk penelitian akademik formal"],"k":3,"p":"Kajian literatur mendalam memastikan penelitian dibangun di atas fondasi teori dan temuan penelitian sebelumnya yang relevan, menghindari duplikasi penelitian yang sudah ada dan memperkuat kerangka konseptual penelitian yang akan dilakukan."},{"m":3,"q":"Untuk mendiseminasikan hasil penelitian dan karya inovatif kepada sesama pengawas dan pemangku kepentingan pendidikan, media yang dapat dimanfaatkan meliputi...","o":["Hanya menyimpan hasil penelitian sebagai dokumen pribadi","Seminar, workshop, jurnal ilmiah, dan forum profesi pengawas (POKJAWAS) sebagai sarana berbagi temuan dan praktik baik","Menyembunyikan hasil penelitian dari pihak lain","Hanya mempublikasikan di media sosial pribadi tanpa konteks ilmiah","Menunggu diminta sebelum membagikan hasil penelitian"],"k":1,"p":"Diseminasi hasil penelitian dapat dilakukan melalui seminar, workshop, jurnal ilmiah, dan forum profesi seperti POKJAWAS, memperluas manfaat temuan penelitian kepada sesama pengawas dan pemangku kepentingan pendidikan lainnya."},{"m":3,"q":"Bu Pengawas Nadia merancang penelitian pengembangan (R&D) untuk menghasilkan instrumen supervisi akademik yang lebih kontekstual bagi madrasah binaan. Tahap awal dalam penelitian R&D yang perlu dilakukan adalah...","o":["Langsung memproduksi instrumen final tanpa uji coba","Menyalin instrumen dari sumber lain tanpa modifikasi","Mempublikasikan instrumen sebelum diuji validitasnya","Mengabaikan studi literatur terkait instrumen sejenis","Melakukan analisis kebutuhan (need analysis) untuk mengidentifikasi kesenjangan antara instrumen yang ada dengan kebutuhan riil di lapangan"],"k":4,"p":"Penelitian pengembangan (R&D) diawali dengan analisis kebutuhan untuk mengidentifikasi kesenjangan antara kondisi yang ada dengan kebutuhan riil, menjadi dasar perancangan produk (instrumen) yang benar-benar menjawab permasalahan di lapangan."},{"m":3,"q":"Untuk menguji kelayakan produk/karya inovatif yang dikembangkan (mis. modul, instrumen, model pembinaan), pengawas perlu melakukan...","o":["Validasi oleh ahli (expert judgment) dan uji coba terbatas di lapangan sebelum implementasi lebih luas","Langsung menyebarluaskan produk tanpa uji coba","Mengasumsikan produk pasti layak tanpa verifikasi","Menggunakan produk tanpa evaluasi efektivitasnya","Hanya mengandalkan opini pribadi pengawas tentang kelayakan produk"],"k":0,"p":"Kelayakan produk/karya inovatif perlu diuji melalui validasi ahli (expert judgment) dan uji coba terbatas di lapangan sebelum implementasi lebih luas, memastikan produk benar-benar efektif dan sesuai kebutuhan sebelum disebarluaskan."},{"m":3,"q":"Pak Pengawas Zainal mendokumentasikan proses dan hasil penelitiannya secara sistematis, termasuk data mentah dan analisis, sebagai bentuk transparansi ilmiah. Manfaat utama praktik ini adalah...","o":["Hanya menambah beban administratif","Tidak relevan dengan penelitian tindakan yang bersifat kontekstual","Memungkinkan verifikasi dan replikasi penelitian oleh pihak lain, meningkatkan kredibilitas dan akuntabilitas ilmiah dari penelitian yang dilakukan","Menggantikan sepenuhnya kebutuhan laporan naratif","Hanya diperlukan untuk penelitian yang akan dipublikasikan"],"k":2,"p":"Dokumentasi sistematis proses dan hasil penelitian memungkinkan verifikasi dan replikasi oleh pihak lain, meningkatkan kredibilitas dan akuntabilitas ilmiah, prinsip penting dalam penelitian meski bersifat kontekstual/tindakan."},{"m":3,"q":"Untuk memastikan hasil penelitian dan pengembangan yang dilakukan pengawas berkelanjutan dampaknya, diperlukan...","o":["Penelitian yang dilakukan hanya sekali tanpa tindak lanjut","Integrasi hasil penelitian ke dalam program pembinaan rutin dan kebijakan pengawasan, memastikan temuan terus dimanfaatkan bukan berhenti sebagai laporan","Menyimpan hasil penelitian nsi penelitian pengawas tetap relevan dan mutakhir."},{"m":3,"q":"Pak Pengawas Suparman merancang penelitian yang membandingkan efektivitas dua model pendampingan berbeda di madrasah binaan yang memiliki karakteristik serupa. Desain penelitian ini termasuk...","o":["Penelitian deskriptif semata","Penelitian historis","Studi kasus tunggal tanpa pembanding","Penelitian komparatif/eksperimen semu (quasi-experiment)","Penelitian korelasional tanpa intervensi"],"k":3,"p":"Penelitian yang membandingkan efektivitas dua model/intervensi berbeda pada kelompok dengan karakteristik serupa termasuk penelitian komparatif/eksperimen semu (quasi-experiment), memberikan bukti perbandingan yang lebih kuat dibanding penelitian deskriptif semata."},{"m":3,"q":"Untuk memastikan penelitian yang dilakukan pengawas tidak mengganggu proses pembelajaran di madrasah binaan, pengawas perlu...","o":["Melaksanakan penelitian tanpa koordinasi dengan pihak madrasah","Mengabaikan dampak penelitian terhadap kegiatan belajar-mengajar","Merencanakan waktu dan metode penelitian yang meminimalkan gangguan terhadap aktivitas pembelajaran, disertai koordinasi dengan kepala madrasah dan guru","Melakukan penelitian secara mendadak tanpa pemberitahuan","Menghentikan seluruh kegiatan pembelajaran demi kelancaran penelitian"],"k":2,"p":"Penelitian yang etis dan profesional memerlukan perencanaan waktu dan metode yang meminimalkan gangguan terhadap pembelajaran, disertai koordinasi dengan pihak madrasah, memastikan penelitian tidak merugikan proses pendidikan yang sedang berlangsung."},{"m":3,"q":"Bu Pengawas Suminah menggunakan hasil penelitiannya sebagai bahan penyusunan kebijakan rekomendasi kepada Kankemenag terkait program pembinaan guru di wilayah kerjanya. Manfaat utama pemanfaatan penelitian ini adalah...","o":["Memberikan dasar bukti (evidence-based) bagi perumusan kebijakan yang lebih tepat sasaran di tingkat wilayah, meningkatkan efektivitas program pembinaan secara sistemik","Hanya kepentingan akad const MOD=["Supervisi Akademik","Supervisi Manajerial","Evaluasi Pendidikan","Penelitian dan Pengembangan"];
const L="ABCDE",KEY="bs-akgtk-v2",$=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const fmt=x=>x.toLocaleString("id-ID",{maximumFractionDigits:1});
let U="";try{U=localStorage.getItem("bs-akgtk-user")||""}catch(e){}
let S={view:U?"dash":"login"},TM=null,CF=false,FL="semua",cfg={mod:-1,n:40,mode:"latihan",dur:60,acak:true};
function hk(){return KEY+":"+U.toLowerCase()}
function hist(){try{return JSON.parse(localStorage.getItem(hk()))||[]}catch(e){return[]}}
function saveH(r){try{const h=hist();h.unshift(r);localStorage.setItem(hk(),JSON.stringify(h.slice(0,12)))}catch(e){}}
function start(ids){
 clearInterval(TM);CF=false;
 if(!ids){ids=Q.map((_,i)=>i).filter(i=>cfg.mod<0||Q[i].m==cfg.mod);
  if(cfg.acak)for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}
  ids=ids.slice(0,Math.max(1,Math.min(cfg.n,ids.length)))}
 S={view:"quiz",ids,i:0,ans:{},flag:{},mode:cfg.mode,end:cfg.mode=="ujian"?Date.now()+cfg.dur*60000:null,mod:cfg.mod};
 if(S.end)TM=setInterval(tick,1000);
 render()}
function tick(){const s=Math.max(0,Math.round((S.end-Date.now())/1000)),el=$("tm");
 if(el)el.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
 if(s<=0)finish()}
function finish(){
 clearInterval(TM);
 const per=MOD.map(()=>[0,0]);let b=0,k=0;
 S.ids.forEach(id=>{const q=Q[id],a=S.ans[id];per[q.m][1]++;if(a==null)k++;else if(a==q.k){b++;per[q.m][0]++}});
 S.res={b,k,s:S.ids.length-b-k,n:S.ids.length,per};S.view="result";FL="semua";
 saveH({t:new Date().toLocaleDateString("id-ID"),m:S.mod<0?"Semua modul":MOD[S.mod],n:S.ids.length,b,mode:S.mode});
 render()}
function login(){
 return `<h1>Latihan Soal AKGTK Pengawas Madrasah 2026</h1><p class="mute">Masukkan nama Anda untuk memulai. Riwayat latihan tersimpan atas nama ini di peramban Anda.</p>

 const v=$("nm").value.trim().replace(/\s+/g," ");
 if(v.length<2){$("er").textContent="Tulis nama minimal 2 huruf.";return}
 U=v;try{localStorage.setItem("bs-akgtk-user",U)}catch(e){}
 S={view:"dash"};render()}

function home(){

 return `<div class="bar"><h1>${t}</h1><button class="alt" data-a="dash">Kembali ke dashboard</button></div>

function quiz(){

  return `<button class="${c}" data-a="pick" data-j="${j}"><b>${L[j]}.</b><span>${esc(t)}</span></button>`}).join("");
 const nav=S.ids.map((x,i)=>`<button data-a="go" data-j="${i}" class="${S.ans[x]!=null?"done ":""}${S.flag[x]?"fl ":""}${i==S.i?"cur":""}" aria-label="Soal ${i+1}">${i+1}</button>`).join("");
 const last=S.i==n-1,un=S.ids.filter(x=>S.ans[x]==null).length;
 return `<div class="bar"><span class="tag">${MOD[q.m]}, soal ${S.i+1} dari ${n}</span>${S.end?`<b id="tm"></b>`:""}<button class="alt" data-a="leave">${S.leave?"Jawaban hilang. Klik lagi untuk keluar":"Kembali ke dashboard"}</button></div>
 <div class="card"><p class="q">${esc(q.q)}</p>${opts}${lock?`<p class="pem"><b>${a==q.k?"Benar.":"Salah. Kunci: "+L[q.k]+"."}</b> ${esc(q.p)}</p>`:""}
 <div class="acts"><button class="alt" data-a="prev" ${S.i?"":"disabled"}>Sebelumnya</button>
 ${last?`<button data-a="fin">${CF&&un?`Masih ${un} kosong. Klik lagi untuk kumpulkan`:"Kumpulkan"}</button>`:`<button data-a="next">Berikutnya</button>`}
 ${S.mode=="ujian"?`<button class="alt" data-a="flag">${S.flag[id]?"Hapus tanda ragu":"Tandai ragu"}</button>`:""}</div></div>
 <div class="card"><div class="tag">Navigasi soal</div><div class="nav">${nav}</div>${last?"":`<div class="acts"><button class="alt" data-a="fin">${CF?"Klik lagi untuk kumpulkan":"Kumpulkan sekarang"}</button></div>`}</div>`}
function result(){
 const r=S.res,p=r.b/r.n*100;
 const rows=r.per.map((x,i)=>x[1]?`<tr><td>${MOD[i]}</td><td>${x[0]} dari ${x[1]}</td><td>${fmt(x[0]/x[1]*100)}</td></tr>`:"").join("");
 const list=S.ids.map((id,i)=>{const q=Q[id],a=S.ans[id],st=a==null?"kosong":a==q.k?"benar":"salah";
  if(FL!="semua"&&FL!=st)return"";
  return `<div class="rv"><div class="tag">Soal ${i+1}, ${MOD[q.m]}</div><p class="q">${esc(q.q)}</p>
  <div class="${st=="benar"?"good":"badc"}">Jawaban Anda: ${a==null?"kosong":L[a]+". "+esc(q.o[a])}</div>
  <div class="good">Kunci: ${L[q.k]}. ${esc(q.o[q.k])}</div><p class="pem">${esc(q.p)}</p></div>`}).join("");
 return `<h1>Hasil latihan</h1><p class="mute">Peserta: ${esc(U)}</p><div class="card"><div class="big">${fmt(p)}</div><div class="mute">${r.b} benar, ${r.s} salah, ${r.k} kosong dari ${r.n} soal</div></div>
 <div class="card"><table><tr><th>Modul</th><th>Benar</th><th>Nilai</th></tr>${rows}</table></div>
 <div class="acts"><button data-a="retry" ${r.s+r.k?"":"disabled"}>Ulangi soal yang salah dan kosong</button><button class="alt" data-a="dash">Kembali ke dashboard</button></div>
 <h2>Pembahasan</h2><div class="acts">${["semua","salah","kosong","benar"].map(f=>`<button class="${f==FL?"":"alt"}" data-a="fl" data-f="${f}">${f}</button>`).join("")}</div>${list||`<p class="mute">Tidak ada soal pada kategori ini.</p>`}`}
function render(){
 $("app").innerHTML=({login,dash,home,quiz,result})[S.view]();
 if(S.view=="home"){$("cn").value=cfg.n;$("cmd").value=cfg.mode;$("cd").value=cfg.dur;$("ca").checked=cfg.acak;$("rd").style.display=cfg.mode=="ujian"?"":"none"}
 if(S.view=="login")$("nm").value=U;
 if(S.view=="quiz"&&S.end)tick();
 window.scrollTo(0,0)}
function rc(){cfg={mod:cfg.mod,n:+$("cn").value||40,mode:$("cmd").value,dur:+$("cd").value||60,acak:$("ca").checked}}
$("app").addEventListener("change",e=>{if(S.view!="home")return;rc();$("rd").style.display=cfg.mode=="ujian"?"":"none"});
$("app").addEventListener("keydown",e=>{if(e.key=="Enter"&&e.target.id=="nm")doLogin()});
$("app").addEventListener("click",e=>{
 const b=e.target.closest("button[data-a]");if(!b)return;
 const a=b.dataset.a,j=+b.dataset.j,id=S.ids&&S.ids[S.i];
 if(S.view=="quiz"&&a!="leave")S.leave=false;
 if(a=="login")doLogin();
 else if(a=="logout"){clearInterval(TM);U="";try{localStorage.removeItem("bs-akgtk-user")}catch(x){}S={view:"login"};render()}
 else if(a=="aspek"){cfg.mod=j;cfg.n=40;S={view:"home"};render()}
 else if(a=="dash"){clearInterval(TM);S={view:"dash"};render()}
 else if(a=="leave"){if(Object.keys(S.ans).length&&!S.leave){S.leave=true;render()}else{clearInterval(TM);S={view:"dash"};render()}}
 else if(a=="start"){rc();start()}
 else if(a=="pick"){if(S.mode=="latihan"&&S.ans[id]!=null)return;S.ans[id]=j;CF=false;render()}
 else if(a=="go"){S.i=j;CF=false;render()}
 else if(a=="prev"){S.i--;render()}
 else if(a=="next"){S.i++;render()}
 else if(a=="flag"){S.flag[id]=!S.flag[id];render()}
 else if(a=="fin"){const un=S.ids.filter(x=>S.ans[x]==null).length;if(un&&!CF){CF=true;render()}else finish()}
 else if(a=="fl"){FL=b.dataset.f;render()}
 else if(a=="retry"){const ids=S.ids.filter(x=>S.ans[x]!==Q[x].k);cfg.mode="latihan";start(ids)}});
render();
</script>
</body>
</html>
