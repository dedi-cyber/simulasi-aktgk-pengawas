<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Latihan Soal AKGTK Pengawas Madrasah 2026</title>
<style>
:root{--bg:#F2F5F3;--panel:#FFFFFF;--ink:#16231E;--mute:#5A6B64;--line:#CBD6D0;--acc:#0B6B4F;--accT:#FFFFFF;--bad:#B3261E;--ok:#0B6B4F;--okBg:#DCEFE6;--badBg:#F8DEDB;--flag:#B7791F;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1A16;--panel:#16251F;--ink:#E6EFEA;--mute:#9DB0A7;--line:#2B3F37;--acc:#4CC49A;--accT:#06251A;--bad:#FF8A80;--ok:#4CC49A;--okBg:#173A2D;--badBg:#472320;--flag:#E3B15C}}
:root[data-theme="dark"]{--bg:#0F1A16;--panel:#16251F;--ink:#E6EFEA;--mute:#9DB0A7;--line:#2B3F37;--acc:#4CC49A;--accT:#06251A;--bad:#FF8A80;--ok:#4CC49A;--okBg:#173A2D;--badBg:#472320;--flag:#E3B15C}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2{font-family:Georgia,"Times New Roman",serif}
.wrap{max-width:860px;margin:0 auto;padding:18px 16px 48px}
h1{font-size:clamp(1.4rem,3vw,2rem);margin:0 0 6px}
h2{font-size:1.15rem;margin:22px 0 8px}
.mute{color:var(--mute)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin:0 0 14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
select,input[type=number]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:6px 8px;max-width:60%}
input[type=number]{width:84px;text-align:right}
button{font:inherit;font-weight:600;background:var(--acc);color:var(--accT);border:0;border-radius:6px;padding:10px 16px;cursor:pointer}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.tag{font-size:.85rem;color:var(--mute)}
.q{font-size:1.05rem;margin:0 0 12px}
.opt{display:flex;gap:10px;width:100%;text-align:left;font-weight:400;background:var(--bg);color:var(--ink);border:1px solid var(--line);margin:0 0 8px;padding:10px 12px}
.opt b{min-width:1.2em}
.opt.sel{border-color:var(--acc);box-shadow:inset 3px 0 0 var(--acc)}
.opt.ok{background:var(--okBg);border-color:var(--ok)}
.opt.no{background:var(--badBg);border-color:var(--bad)}
.pem{border-left:3px solid var(--acc);padding:4px 12px;margin:10px 0 0;color:var(--ink)}
.nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-top:6px}
.nav button{padding:6px 0;font-weight:500;background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.nav .done{background:var(--okBg);border-color:var(--ok)}
.nav .fl{border-color:var(--flag);box-shadow:inset 0 -3px 0 var(--flag)}
.nav .cur{outline:2px solid var(--acc);outline-offset:1px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.big{font:700 2.6rem/1 Georgia,serif;margin:4px 0}
table{width:100%;border-collapse:collapse;font-size:.92rem}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
td:not(:first-child),th:not(:first-child){text-align:right}
.foot{margin-top:28px;padding-top:14px;border-top:1px solid var(--line);text-align:center;color:var(--mute);font-size:.88rem}
.menu{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-bottom:12px}
.m{display:block;text-align:left;width:100%;background:var(--panel);color:var(--ink);border:1px solid var(--line);font-weight:400;padding:14px 16px}
.m b{display:block;font-family:Georgia,serif;font-size:1.05rem;margin-bottom:4px}
.m:hover{border-color:var(--acc)}
input[type=text]{font:inherit;width:100%;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:10px 12px;margin-top:6px}
.rv{border-top:1px solid var(--line);padding:12px 0}
.good{color:var(--ok)}.badc{color:var(--bad)}
</style>
</head>
<body>
<div class="wrap"><div id="app"></div><footer class="foot">Dikembangkan oleh Dedi Efendi (Pengawas Madrasah Kab. Agam)</footer></div>
<script>
const Q=[{"m":0,"q":"Fungsi utama pengawas madrasah dalam melaksanakan supervisi akademik adalah membantu guru...","o":["Menyelesaikan administrasi kepegawaian","Mengelola sarana prasarana sekolah","Mengurus keuangan pribadi","Menyusun laporan keuangan madrasah","Meningkatkan kualitas proses dan hasil pembelajaran secara berkelanjutan"],"k":4,"p":"Fungsi utama supervisi akademik pengawas adalah membantu guru meningkatkan kualitas proses dan hasil pembelajaran secara berkelanjutan, melalui pembinaan profesional yang suportif bukan sekadar penilaian administratif."},{"m":0,"q":"Pengawas Madrasah Pak Hidayat melakukan kunjungan ke beberapa madrasah binaan dan mendapati variasi kualitas RPP antarguru. Langkah tindak lanjut paling tepat adalah...","o":["Merancang program pendampingan (workshop/IHT) lintas madrasah binaan yang menyasar kesenjangan kompetensi penyusunan RPP secara terstruktur","Membiarkan variasi tersebut tanpa intervensi","Hanya menegur guru dengan RPP kurang baik","Menyeragamkan RPP tanpa mempertimbangkan konteks masing- masing madrasah","Melaporkan temuan tanpa program tindak lanjut"],"k":0,"p":"Pengawas yang menemukan variasi kualitas RPP antarmadrasah binaan sebaiknya merancang program pendampingan terstruktur (workshop/IHT) lintas madrasah yang menyasar kesenjangan kompetensi secara sistematis, bukan sekadar teguran individual."},{"m":0,"q":"Instrumen yang digunakan pengawas untuk menilai kesesuaian perencanaan pembelajaran (RPP/Modul Ajar) dengan capaian pembelajaran dan karakteristik peserta didik disebut...","o":["Daftar hadir supervisi","Buku tamu","Instrumen telaah perangkat pembelajaran","Instrumen akreditasi","Formulir cuti guru"],"k":2,"p":"Instrumen telaah perangkat pembelajaran digunakan pengawas untuk menilai kesesuaian RPP/Modul Ajar dengan capaian pembelajaran dan karakteristik peserta didik, mencakup aspek kelengkapan komponen dan koherensi antarunsur pembelajaran."},{"m":0,"q":"Pendekatan supervisi akademik yang dilakukan pengawas dengan cara mengamati langsung proses pembelajaran di kelas untuk mengumpulkan data objektif disebut teknik...","o":["Wawancara semata","Observasi kelas","Studi dokumen tanpa kunjungan","Angket tertulis","Diskusi kelompok terpumpun tanpa observasi"],"k":1,"p":"Observasi kelas adalah teknik supervisi akademik yang dilakukan pengawas dengan mengamati langsung proses pembelajaran di kelas untuk mengumpulkan data objektif tentang praktik mengajar guru secara nyata."},{"m":0,"q":"Bu Pengawas Aminah mendapati salah satu madrasah binaannya kesulitan menerapkan pembelajaran berdiferensiasi karena keterbatasan pemahaman guru. Ia merancang pendampingan bertahap dengan model coaching berkelanjutan, bukan pelatihan satu kali. Manfaat utama pendekatan ini adalah...","o":["Hanya memperlambat proses perbaikan","Hanya efektif untuk guru baru","Tidak relevan dengan tugas pengawas","Menggantikan sepenuhnya tanggung jawab kepala madrasah","Memungkinkan internalisasi kompetensi yang lebih mendalam melalui siklus praktik-refleksi-perbaikan berulang, dibanding pelatihan sesaat yang cenderung tidak berdampak jangka panjang"],"k":4,"p":"Coaching berkelanjutan memungkinkan internalisasi kompetensi lebih mendalam melalui siklus praktik-refleksi-perbaikan berulang, terbukti lebih efektif membangun perubahan perilaku mengajar jangka panjang dibanding pelatihan satu kali yang berdampak terbatas."},{"m":0,"q":"Prinsip supervisi akademik yang menekankan bahwa proses pembinaan harus didasarkan pada kebutuhan riil guru, bukan asumsi sepihak pengawas, disebut prinsip...","o":["Berbasis kebutuhan (need-based)","Otoriter","Generik/seragam","Hierarkis kaku","Kompetitif"],"k":0,"p":"Prinsip supervisi berbasis kebutuhan (need-based) menekankan bahwa pembinaan harus didasarkan pada kebutuhan riil guru yang teridentifikasi melalui data dan observasi, bukan asumsi sepihak pengawas tanpa dasar empiris."},{"m":0,"q":"Pengawas Pak Rizal menyusun program supervisi tahunan yang mencakup jadwal, sasaran, teknik, dan indikator keberhasilan untuk seluruh madrasah binaannya. Dokumen ini disebut...","o":["Laporan Kinerja Pengawas","KOSP","RKAM","Program Pengawasan (Proswas)","Buku Induk"],"k":3,"p":"Program Pengawasan (Proswas) adalah dokumen perencanaan tahunan pengawas yang mencakup jadwal, sasaran, teknik, dan indikator keberhasilan supervisi terhadap seluruh madrasah binaan, menjadi acuan kerja pengawas selama satu tahun."},{"m":0,"q":"Untuk memastikan objektivitas dalam menilai kompetensi pedagogik guru saat supervisi, pengawas perlu...","o":["Hanya mengandalkan kesan pribadi tanpa instrumen","Menilai berdasarkan reputasi guru semata","Menggunakan rubrik/instrumen penilaian yang terstandar dan berbasis bukti (evidence-based) dari observasi langsung","Mengabaikan konteks madrasah dalam penilaian","Hanya menilai berdasarkan laporan kepala madrasah tanpa verifikasi"],"k":2,"p":"Objektivitas penilaian kompetensi pedagogik memerlukan rubrik/instrumen terstandar berbasis bukti dari observasi langsung, memastikan penilaian pengawas akurat dan dapat dipertanggungjawabkan, bukan sekadar kesan atau reputasi."},{"m":0,"q":"Bu Pengawas Hasanah memfasilitasi forum Musyawarah Guru Mata Pelajaran (MGMP) lintas madrasah binaan sebagai wadah berbagi praktik baik pembelajaran. Manfaat utama pendekatan ini adalah...","o":["Membangun komunitas belajar profesional (professional learning community) yang memperkuat kapasitas kolektif guru lintas madrasah","Hanya formalitas administratif tanpa dampak nyata","Menggantikan sepenuhnya peran supervisi individual pengawas","Tidak relevan dengan tugas pokok pengawas","Hanya bermanfaat bagi guru senior"],"k":0,"p":"Forum MGMP yang difasilitasi pengawas membangun komunitas belajar profesional (professional learning community) lintas madrasah, memperkuat kapasitas kolektif guru melalui berbagi praktik baik, memperluas dampak pembinaan melampaui supervisi individual."},{"m":0,"q":"Tahap dalam siklus supervisi akademik yang dilakukan pengawas dan guru sebelum observasi kelas, untuk menyepakati fokus dan aspek yang akan diamati, disebut...","o":["Pertemuan pasca-observasi","Rapat pleno madrasah","Evaluasi akhir tahun","Sidang kode etik","Pertemuan pra-observasi"],"k":4,"p":"Pertemuan pra-observasi dilakukan pengawas dan guru sebelum observasi kelas untuk menyepakati fokus dan aspek yang akan diamati, memastikan proses supervisi terarah dan disepakati bersama, bukan mendadak atau sepihak."},{"m":0,"q":"Untuk menindaklanjuti hasil supervisi akademik yang menunjukkan kesenjangan kompetensi guru di banyak madrasah binaan, pengawas dapat berkoordinasi dengan...","o":["Hanya bertindak sendiri tanpa melibatkan pihak lain","Kantor Kemenag, MGMP, dan lembaga pelatihan untuk merancang program pengembangan profesional berkelanjutan (PKB) yang lebih terstruktur dan berdampak luas","Mengabaikan kesenjangan karena dianggap bukan tanggung jawab pengawas","Hanya melaporkan tanpa tindak lanjut konkret","Menunggu inisiatif dari masing-masing madrasah secara mandiri"],"k":1,"p":"Kesenjangan kompetensi guru di banyak madrasah binaan memerlukan koordinasi pengawas dengan Kantor Kemenag, MGMP, dan lembaga pelatihan untuk merancang program PKB yang lebih terstruktur, sistemik, dan berdampak luas dibanding penanganan kasus per kasus."},{"m":0,"q":"Pak Pengawas Fauzi menggunakan pendekatan coaching dengan bertanya reflektif (\"Menurut Bapak/Ibu, apa yang membuat pembelajaran tadi efektif?\") dibanding memberi penilaian langsung. Manfaat utama pendekatan ini adalah...","o":["Hanya memperlambat proses supervisi","Mengurangi objektivitas hasil supervisi","Mendorong guru melakukan refleksi mandiri dan menemukan sendiri solusi perbaikan, meningkatkan kepemilikan (ownership) terhadap proses pengembangan diri","Tidak relevan dengan tujuan supervisi akademik","Hanya efektif untuk guru berpengalaman"],"k":2,"p":"Pendekatan coaching berbasis pertanyaan reflektif mendorong guru melakukan refleksi mandiri dan menemukan sendiri solusi perbaikan, meningkatkan rasa kepemilikan terhadap proses pengembangan diri dibanding hanya menerima penilaian searah."},{"m":0,"q":"Aspek yang perlu diperhatikan pengawas saat menelaah kesesuaian penilaian pembelajaran (asesmen) yang dirancang guru adalah...","o":["Hanya jumlah soal yang dibuat","Hanya penilaian sumatif tanpa mempertimbangkan formatif","Kerapian format dokumen semata","Kesesuaian teknik dan instrumen penilaian dengan tujuan pembelajaran serta karakteristik kompetensi yang diukur (kognitif, afektif, psikomotorik)","Kecepatan guru mengoreksi jawaban siswa"],"k":3,"p":"Telaah asesmen pembelajaran mencakup kesesuaian teknik dan instrumen penilaian dengan tujuan pembelajaran serta karakteristik kompetensi yang diukur (kognitif, afektif, psikomotorik), memastikan penilaian benar-benar mengukur capaian yang dimaksud."},{"m":0,"q":"Bu Pengawas Wardah merancang program pendampingan literasi-numerasi berbasis hasil Asesmen Nasional (AN) di madrasah binaannya. Pendekatan berbasis data ini penting karena...","o":["Hanya memenuhi tuntutan administratif semata","Menggantikan sepenuhnya peran kurikulum madrasah","Tidak relevan dengan tugas pengawasan akademik","Memastikan program pendampingan tepat sasaran sesuai kebutuhan riil capaian siswa di masing-masing madrasah binaan, meningkatkan efektivitas intervensi","Hanya bermanfaat bagi madrasah dengan hasil AN rendah"],"k":3,"p":"Program pendampingan berbasis data hasil AN memastikan intervensi tepat sasaran sesuai kebutuhan riil capaian siswa di masing-masing madrasah binaan, meningkatkan efektivitas program dibanding pendekatan generik tanpa dasar data."},{"m":0,"q":"Untuk membangun hubungan kolaboratif (bukan hierarkis-mengancam) dengan guru selama supervisi, pengawas perlu menerapkan komunikasi yang...","o":["Menghakimi dan otoriter","Empatik, suportif, dan berorientasi pada solusi bersama","Formal dan berjarak tanpa keterlibatan emosional","Kaku dan sepihak","Mengintimidasi agar guru lebih patuh"],"k":1,"p":"Komunikasi yang empatik, suportif, dan berorientasi solusi bersama membangun hubungan kolaboratif antara pengawas dan guru, menciptakan iklim supervisi yang aman secara psikologis dan mendorong keterbukaan guru terhadap pembinaan."},{"m":0,"q":"Pengawas Pak Anas menemukan bahwa penerapan kurikulum di salah satu madrasah binaan belum sepenuhnya sesuai pedoman resmi. Langkah pertama yang tepat sebelum mengambil tindakan lebih lanjut adalah...","o":["Langsung melaporkan ke Kemenag tanpa klarifikasi","Menyalahkan kepala madrasah secara sepihak","Mengabaikan temuan karena dianggap bukan masalah serius","Memberikan sanksi langsung tanpa proses pembinaan","Melakukan klarifikasi dan dialog dengan kepala madrasah serta guru terkait untuk memahami akar penyebab ketidaksesuaian sebelum merumuskan solusi"],"k":4,"p":"Sebelum mengambil tindakan lebih lanjut, pengawas perlu melakukan klarifikasi dan dialog dengan pihak madrasah untuk memahami akar penyebab ketidaksesuaian penerapan kurikulum, memastikan solusi yang dirumuskan tepat sasaran dan konstruktif."},{"m":0,"q":"Dokumen yang memuat hasil pelaksanaan program pengawasan selama satu tahun, termasuk capaian dan rekomendasi tindak lanjut, disebut...","o":["Laporan Pelaksanaan Program Pengawasan (LPPP)","Proswas (Program Pengawasan)","RKJM","KOSP","Instrumen Akreditasi"],"k":0,"p":"Laporan Pelaksanaan Program Pengawasan (LPPP) memuat hasil pelaksanaan program pengawasan selama satu tahun, mencakup capaian, temuan, dan rekomendasi tindak lanjut, menjadi bentuk pertanggungjawaban kinerja pengawas."},{"m":0,"q":"Untuk memperkuat kapasitas kepala madrasah dalam melaksanakan supervisi internal secara mandiri, pengawas dapat berperan sebagai...","o":["Hanya pengawas eksternal tanpa keterlibatan pembinaan","Pengganti sepenuhnya peran kepala madrasah dalam supervisi","Mentor yang membekali kepala madrasah dengan keterampilan supervisi akademik melalui pelatihan dan pendampingan bertahap","Pihak yang membatasi otonomi kepala madrasah","Evaluator semata tanpa pembinaan"],"k":2,"p":"Pengawas berperan sebagai mentor yang membekali kepala madrasah dengan keterampilan supervisi akademik melalui pelatihan dan pendampingan bertahap, memperkuat kapasitas internal madrasah agar tidak selalu bergantung pada pengawas eksternal."},{"m":0,"q":"Bu Pengawas Latifah menggunakan hasil supervisi sebagai salah satu data pendukung rekomendasi kenaikan pangkat/jabatan fungsional guru, bukan sebagai alat menghukum. Pendekatan ini mencerminkan prinsip supervisi yang...","o":["Punitif","Terintegrasi dengan sistem pengembangan karier profesional guru secara konstruktif","Terpisah sepenuhnya dari sistem penilaian kinerja","Hanya administratif tanpa dampak pengembangan","Mengabaikan keterkaitan dengan pengembangan karier"],"k":1,"p":"Mengintegrasikan hasil supervisi dengan sistem pengembangan karier (kenaikan pangkat/jabatan) mencerminkan prinsip supervisi yang konstruktif, mendukung pertumbuhan profesional guru, bukan sekadar alat evaluatif yang bersifat menghukum."},{"m":0,"q":"Aspek kompetensi profesional guru yang menjadi fokus telaah pengawas dalam supervisi akademik mencakup...","o":["Hanya kehadiran guru di sekolah","Hubungan sosial guru dengan rekan sejawat","Hanya kerapian administrasi guru","Kemampuan mengoperasikan komputer semata","Penguasaan materi, struktur, konsep, dan pola pikir keilmuan mata pelajaran yang diampu, serta kemampuan mengembangkannya secara berkelanjutan"],"k":4,"p":"Kompetensi profesional guru mencakup penguasaan materi, struktur, konsep, dan pola pikir keilmuan mata pelajaran yang diampu, serta kemampuan mengembangkan kompetensi tersebut secara berkelanjutan, menjadi salah satu fokus utama telaah pengawas."},{"m":0,"q":"Pak Pengawas Bahtiar merancang supervisi berbasis siklus PDCA (Plan-Do- Check-Act) dalam pembinaan madrasah binaannya. Manfaat utama pendekatan siklus ini adalah...","o":["Memastikan proses pembinaan berkelanjutan dan sistematis, dengan evaluasi dan penyesuaian berulang untuk perbaikan mutu yang terus- menerus","Hanya menambah kerumitan administratif","Tidak relevan dengan tugas pengawasan","Menggantikan sepenuhnya peran evaluasi tahunan","Hanya efektif untuk madrasah dengan masalah serius"],"k":0,"p":"Siklus PDCA (Plan-Do-Check-Act) memastikan proses pembinaan berkelanjutan dan sistematis, dengan evaluasi dan penyesuaian berulang untuk perbaikan mutu yang terus-menerus (continuous improvement), bukan pembinaan sesaat tanpa tindak lanjut."},{"m":0,"q":"Untuk menjaga netralitas dan menghindari konflik kepentingan dalam supervisi, pengawas perlu...","o":["Hanya mensupervisi madrasah yang memiliki hubungan personal dengannya","Memberikan perlakuan berbeda berdasarkan kedekatan personal","Mengabaikan aspek etika dalam pelaksanaan tugas","Melaksanakan tugas secara profesional dan objektif, menghindari keberpihakan yang tidak berdasar bukti, sesuai kode etik pengawas","Menghindari seluruh interaksi personal dengan guru dan kepala madrasah"],"k":3,"p":"Menjaga netralitas memerlukan pelaksanaan tugas secara profesional dan objektif sesuai kode etik pengawas, menghindari keberpihakan yang tidak berdasar bukti, memastikan integritas proses supervisi tetap terjaga."},{"m":0,"q":"Bu Pengawas Nurul memfasilitasi kegiatan lesson study antarguru lintas madrasah binaan sebagai strategi pembinaan kolaboratif. Tahapan lesson study yang tepat secara berurutan adalah...","o":["Refleksi, perencanaan, observasi","Observasi, refleksi, perencanaan","Perencanaan (plan), pelaksanaan dan observasi (do), refleksi (see)","Evaluasi, refleksi, pelaksanaan","Pelaksanaan, evaluasi, perencanaan"],"k":2,"p":"Lesson study mengikuti tahapan plan (perencanaan bersama), do (pelaksanaan pembelajaran yang diobservasi rekan sejawat), dan see (refleksi bersama atas hasil observasi), menjadi model pembinaan kolaboratif berbasis praktik nyata."},{"m":0,"q":"Untuk memastikan hasil supervisi akademik dapat ditindaklanjuti secara efektif, pengawas perlu menyusun...","o":["Rekomendasi yang spesifik, terukur, dan realistis, disertai jadwal monitoring implementasinya","Laporan tanpa rencana tindak lanjut konkret","Hanya menyimpan hasil supervisi sebagai arsip","Menyerahkan sepenuhnya tindak lanjut kepada guru tanpa pendampingan","Rekomendasi umum yang berlaku sama untuk semua guru"],"k":0,"p":"Tindak lanjut supervisi yang efektif memerlukan rekomendasi yang spesifik, terukur, dan realistis (sesuai konteks masing-masing guru), disertai jadwal monitoring implementasi agar perbaikan yang direkomendasikan benar- benar terlaksana."},{"m":0,"q":"Pengawas Pak Jamal mengintegrasikan nilai keteladanan dan amanah dalam melaksanakan tugas pengawasan, memastikan proses pembinaan dilakukan dengan niat tulus membantu madrasah berkembang. Pendekatan ini mencerminkan...","o":["Formalitas administratif semata","Menggantikan sepenuhnya standar profesional pengawasan","Tidak relevan dengan prinsip pengawasan modern","Hanya relevan bagi pengawas yang religius","Nilai kepemimpinan pengawasan yang Islami, memperkuat esensi tugas pengawasan sebagai pembinaan yang suportif dan bermartabat"],"k":4,"p":"Mengintegrasikan nilai keteladanan dan amanah dalam tugas pengawasan memperkuat esensi pengawasan sebagai pembinaan yang suportif dan bermartabat, selaras dengan prinsip pengawasan modern sekaligus nilai keislaman yang relevan di lingkungan madrasah."},{"m":0,"q":"Untuk mengevaluasi efektivitas program pengawasan akademik secara keseluruhan dalam satu tahun, pengawas dapat menganalisis...","o":["Hanya jumlah kunjungan yang dilakukan","Perkembangan kompetensi guru dan mutu pembelajaran di madrasah binaan dari waktu ke waktu, serta tingkat implementasi rekomendasi tindak lanjut","Opini pribadi pengawas semata","Perbandingan semata antarmadrasah binaan tanpa konteks","Hanya kepatuhan madrasah terhadap jadwal kunjungan"],"k":1,"p":"Evaluasi efektivitas program pengawasan yang komprehensif menganalisis perkembangan kompetensi guru dan mutu pembelajaran dari waktu ke waktu, serta implementasi rekomendasi tindak lanjut, bukan hanya indikator kuantitatif seperti jumlah kunjungan."},{"m":0,"q":"Bu Pengawas Farida mendorong madrasah binaan mengembangkan inovasi pembelajaran sesuai konteks lokal masing-masing, bukan menyeragamkan pendekatan di semua madrasah. Prinsip ini mencerminkan supervisi yang bersifat...","o":["Sentralistik dan seragam","Otoriter tanpa ruang kreativitas","Kontekstual dan menghargai kearifan lokal masing-masing madrasah","Mengabaikan keunikan konteks madrasah","Hanya berlaku untuk madrasah unggulan"],"k":2,"p":"Supervisi kontekstual menghargai kearifan lokal dan keunikan konteks masing-masing madrasah binaan, mendorong inovasi yang relevan dengan kondisi setempat, bukan menyeragamkan pendekatan tanpa mempertimbangkan perbedaan konteks."},{"m":0,"q":"Untuk membangun sistem pelaporan hasil supervisi yang transparan dan akuntabel, pengawas perlu memastikan laporan mencakup...","o":["Hanya kesimpulan tanpa data pendukung","Hanya aspek positif tanpa area pengembangan","Opini subjektif tanpa dasar bukti","Data dan bukti konkret dari observasi, analisis objektif, serta rekomendasi yang dapat dipertanggungjawabkan","Kritik tanpa solusi konstruktif"],"k":3,"p":"Laporan supervisi yang transparan dan akuntabel memuat data dan bukti konkret dari observasi, analisis objektif, serta rekomendasi yang dapat dipertanggungjawabkan, memastikan hasil supervisi kredibel dan bermanfaat bagi pembinaan."},{"m":0,"q":"Pak Pengawas Iqbal memanfaatkan aplikasi digital untuk mendokumentasikan dan menganalisis hasil supervisi dari seluruh madrasah binaannya secara terintegrasi. Manfaat utama pendekatan ini adalah...","o":["Hanya menambah kerumitan kerja pengawas","Tidak relevan dengan tugas pengawasan akademik","Menggantikan sepenuhnya observasi langsung di kelas","Memudahkan pemantauan tren dan pola perkembangan mutu pembelajaran lintas madrasah binaan, mendukung pengambilan keputusan berbasis data","Hanya bermanfaat untuk pengawas yang menguasai teknologi"],"k":3,"p":"Digitalisasi dokumentasi dan analisis hasil supervisi memudahkan pemantauan tren dan pola perkembangan mutu pembelajaran lintas madrasah binaan, mendukung pengambilan keputusan berbasis data (data-driven decision making) yang lebih strategis dan efisien."},{"m":0,"q":"Untuk memastikan supervisi akademik berdampak pada peningkatan hasil belajar siswa (bukan hanya perbaikan administratif guru), pengawas perlu menghubungkan hasil supervisi dengan...","o":["Hanya kelengkapan dokumen guru","Data capaian belajar siswa (nilai, asesmen formatif/sumatif) untuk melihat korelasi antara perbaikan praktik mengajar dan hasil belajar","Jumlah kehadiran guru semata","Kerapian kelas tanpa mengaitkan hasil belajar","Popularitas guru di kalangan siswa"],"k":1,"p":"Supervisi yang berdampak nyata perlu dihubungkan dengan data capaian belajar siswa untuk melihat korelasi antara perbaikan praktik mengajar hasil supervisi dan peningkatan hasil belajar, memastikan supervisi bukan sekadar formalitas administratif."},{"m":0,"q":"Bu Pengawas Ratna menerapkan pendekatan supervisi yang membedakan intensitas pembinaan antara madrasah dengan kondisi baik dan madrasah yang memerlukan perhatian lebih. Prinsip ini disebut supervisi yang bersifat...","o":["Seragam untuk semua madrasah","Hanya berfokus pada madrasah dengan masalah","Sentralistik tanpa mempertimbangkan kondisi lokal","Formalitas administratif semata","Diferensiasi/berbasis kebutuhan masing-masing madrasah (differentiated supervision)"],"k":4,"p":"Supervisi diferensiasi menyesuaikan intensitas dan fokus pembinaan berdasarkan kebutuhan masing-masing madrasah, memberikan perhatian lebih intensif bagi madrasah yang memerlukan, sambil tetap memantau madrasah dengan kondisi baik secara proporsional."},{"m":0,"q":"Untuk mengembangkan kompetensi diri secara berkelanjutan sebagai pengawas, langkah yang tepat dilakukan adalah...","o":["Mengikuti pelatihan, membaca perkembangan kebijakan pendidikan terkini, dan aktif dalam forum profesi pengawas (mis. POKJAWAS)","Mengandalkan pengalaman lama tanpa pembaruan pengetahuan","Menghindari perubahan kebijakan pendidikan","Hanya mengandalkan instruksi atasan tanpa inisiatif belajar mandiri","Membatasi diri pada rutinitas kerja tanpa pengembangan diri"],"k":0,"p":"Pengembangan kompetensi berkelanjutan pengawas memerlukan partisipasi aktif dalam pelatihan, pembaruan pengetahuan kebijakan pendidikan terkini, dan forum profesi seperti POKJAWAS (Kelompok Kerja Pengawas), memastikan kompetensi pengawas tetap relevan dan mutakhir."},{"m":0,"q":"Pak Pengawas Salim memberikan penghargaan/pengakuan terhadap madrasah binaan yang menunjukkan peningkatan mutu signifikan sebagai bentuk motivasi. Manfaat utama strategi ini adalah...","o":["Hanya formalitas seremonial tanpa dampak nyata","Menciptakan kesenjangan yang merugikan madrasah lain","Memperkuat motivasi intrinsik madrasah untuk terus meningkatkan mutu, menciptakan iklim kompetisi yang sehat antarmadrasah binaan","Tidak relevan dengan tugas pengawasan akademik","Hanya bermanfaat bagi madrasah yang sudah unggul"],"k":2,"p":"Penghargaan atas peningkatan mutu memperkuat motivasi intrinsik madrasah untuk terus berkembang, menciptakan iklim kompetisi yang sehat dan konstruktif antarmadrasah binaan, mendorong semangat perbaikan berkelanjutan."},{"m":0,"q":"Untuk memastikan konsistensi standar penilaian supervisi antarpengawas dalam satu wilayah kerja, diperlukan...","o":["Membiarkan setiap pengawas menggunakan standar masing-masing","Kalibrasi bersama (moderasi) terhadap instrumen dan kriteria penilaian supervisi melalui forum koordinasi pengawas secara berkala","Hanya satu pengawas yang menentukan standar untuk seluruh wilayah","Mengabaikan perbedaan standar karena dianggap tidak penting","Menyerahkan sepenuhnya pada penilaian subjektif masing-masing pengawas"],"k":1,"p":"Konsistensi standar antarpengawas memerlukan kalibrasi bersama (moderasi) melalui forum koordinasi pengawas secara berkala, memastikan persepsi dan kriteria penilaian selaras sehingga hasil supervisi objektif di seluruh wilayah kerja."},{"m":0,"q":"Bu Pengawas Sari melibatkan kepala madrasah dan guru senior dalam merumuskan program pengawasan tahunan, bukan menyusunnya secara sepihak. Manfaat utama pendekatan partisipatif ini adalah...","o":["Hanya menambah proses birokrasi","Hanya efektif jika madrasah binaan sedikit jumlahnya","Mengurangi otoritas dan independensi pengawas","Tidak relevan dengan efektivitas program pengawasan","Meningkatkan relevansi program dengan kebutuhan riil madrasah serta membangun rasa memiliki (ownership) terhadap proses pengawasan"],"k":4,"p":"Pelibatan kepala madrasah dan guru senior dalam perumusan program pengawasan meningkatkan relevansi program dengan kebutuhan riil serta membangun rasa memiliki terhadap proses pengawasan, memperkuat efektivitas implementasi program di lapangan."},{"m":0,"q":"Untuk menangani kasus guru yang menunjukkan resistensi terhadap pembinaan supervisi akademik, pendekatan yang tepat bagi pengawas adalah...","o":["Melakukan pendekatan personal untuk memahami akar resistensi, membangun kepercayaan secara bertahap, dan menyesuaikan strategi pembinaan sesuai kondisi guru","Memaksa guru mengikuti pembinaan tanpa dialog","Mengabaikan guru tersebut dan fokus pada guru lain","Melaporkan langsung sebagai pelanggaran tanpa upaya pembinaan","Memberikan sanksi administratif sebagai langkah pertama"],"k":0,"p":"Resistensi guru terhadap pembinaan memerlukan pendekatan personal untuk memahami akar masalah, membangun kepercayaan secara bertahap, dan menyesuaikan strategi pembinaan, bukan pemaksaan atau sanksi yang justru dapat memperburuk hubungan dan menghambat perbaikan."},{"m":0,"q":"Pak Pengawas Rahmat mendorong madrasah binaan menerapkan penilaian berbasis portofolio sebagai pelengkap tes tertulis dalam mengukur capaian belajar siswa. Manfaat utama rekomendasi ini adalah...","o":["Hanya menambah beban administratif guru","Tidak relevan dengan tugas pengawasan akademik","Menggantikan sepenuhnya kebutuhan tes tertulis","Memberikan gambaran capaian belajar siswa yang lebih holistik, mencakup proses dan perkembangan, tidak hanya hasil akhir tes tertulis","Hanya efektif untuk mata pelajaran tertentu"],"k":3,"p":"Penilaian berbasis portofolio memberikan gambaran capaian belajar yang lebih holistik, mencakup proses dan perkembangan siswa dari waktu ke waktu, melengkapi (bukan menggantikan) tes tertulis yang cenderung hanya mengukur hasil akhir."},{"m":0,"q":"Untuk memastikan program pembinaan pengawas selaras dengan kebijakan kurikulum terbaru, pengawas perlu...","o":["Mengandalkan pemahaman kurikulum lama tanpa pembaruan","Menyerahkan sepenuhnya pemahaman kurikulum kepada guru","Secara aktif mempelajari dan memahami kebijakan kurikulum terbaru sebelum melaksanakan pembinaan ke madrasah binaan","Mengabaikan perubahan kebijakan kurikulum","Hanya mengandalkan sosialisasi dari Kemenag tanpa pendalaman mandiri"],"k":2,"p":"Pengawas perlu secara aktif mempelajari dan memahami kebijakan kurikulum terbaru sebelum melaksanakan pembinaan, memastikan arahan yang diberikan kepada madrasah binaan akurat dan sesuai perkembangan kebijakan pendidikan terkini."},{"m":0,"q":"Bu Pengawas Dewi merancang supervisi akademik yang juga memperhatikan kesejahteraan psikologis guru, tidak hanya aspek teknis mengajar. Manfaat utama pendekatan holistik ini adalah...","o":["Memastikan pembinaan guru dilakukan secara komprehensif, mengingat kondisi psikologis guru turut memengaruhi kualitas pengajaran dan interaksi dengan siswa","Hanya menambah kompleksitas proses supervisi","Tidak relevan dengan tujuan supervisi akademik","Mengurangi fokus pada aspek pedagogik","Hanya bermanfaat bagi guru yang mengalami masalah pribadi"],"k":0,"p":"Pendekatan supervisi holistik yang memperhatikan kesejahteraan psikologis guru memastikan pembinaan dilakukan secara komprehensif, mengingat kondisi psikologis turut memengaruhi kualitas pengajaran dan interaksi guru dengan siswa di kelas."},{"m":0,"q":"Untuk membangun budaya evaluasi diri (self-assessment) di kalangan guru madrasah binaan, pengawas dapat mendorong penerapan...","o":["Hanya evaluasi eksternal tanpa refleksi mandiri","Hanya mewajibkan evaluasi di akhir semester","Mengandalkan penilaian supervisi eksternal semata","Menghindari refleksi mandiri karena dianggap subjektif","Jurnal refleksi mengajar (teaching journal) yang diisi guru secara rutin, sebagai sarana refleksi berkelanjutan atas praktik mengajarnya sendiri"],"k":4,"p":"Jurnal refleksi mengajar yang diisi guru secara rutin membangun budaya evaluasi diri (self-assessment), mendorong refleksi berkelanjutan atas praktik mengajar sendiri, melengkapi supervisi eksternal dengan kesadaran reflektif internal guru."},{"m":1,"q":"Fokus utama supervisi manajerial yang dilakukan pengawas terhadap madrasah binaan adalah menilai efektivitas...","o":["Proses pembelajaran di kelas semata","Pengelolaan administrasi, sumber daya, dan tata kelola madrasah secara keseluruhan","Penguasaan materi ajar guru","Kemampuan pedagogik guru","Hasil belajar siswa secara individual"],"k":1,"p":"Supervisi manajerial berfokus pada penilaian efektivitas pengelolaan administrasi, sumber daya, dan tata kelola madrasah secara keseluruhan, berbeda dengan supervisi akademik yang berfokus pada proses pembelajaran di kelas."},{"m":1,"q":"Pengawas Pak Hendra melakukan telaah terhadap dokumen RKJM dan RKT madrasah binaan untuk menilai kesesuaiannya dengan hasil EDM. Manfaat utama telaah ini adalah...","o":["Hanya formalitas administratif tanpa dampak nyata","Menggantikan sepenuhnya tanggung jawab kepala madrasah dalam perencanaan","Memastikan perencanaan madrasah didasarkan pada data riil kondisi madrasah, bukan sekadar dokumen formalitas tanpa dasar analisis","Tidak relevan dengan tugas pengawasan manajerial","Hanya bermanfaat menjelang akreditasi"],"k":2,"p":"Telaah kesesuaian RKJM/RKT dengan hasil EDM memastikan perencanaan madrasah didasarkan pada data riil kondisi madrasah, bukan sekadar dokumen formalitas, sehingga program yang direncanakan benar-benar menjawab kebutuhan perbaikan yang teridentifikasi."},{"m":1,"q":"Delapan Standar Nasional Pendidikan (SNP) yang menjadi acuan utama supervisi manajerial pengawas terhadap madrasah binaan meliputi Standar Isi, Proses, Kompetensi Lulusan, PTK, Sarana Prasarana, Pengelolaan, Pembiayaan, dan...","o":["Standar Kurikulum Nasional","Standar Digitalisasi Sekolah","Standar Akreditasi Madrasah","Standar Penilaian","Standar Kepala Madrasah"],"k":3,"p":"Delapan SNP terdiri dari Standar Isi, Proses, Kompetensi Lulusan, Pendidik dan Tenaga Kependidikan (PTK), Sarana Prasarana, Pengelolaan, Pembiayaan, dan Standar Penilaian, menjadi kerangka acuan utama supervisi manajerial pengawas."},{"m":1,"q":"Bu Pengawas Yuliana mendapati pengelolaan keuangan BOS di salah satu madrasah binaan kurang transparan. Langkah supervisi manajerial yang tepat adalah...","o":["Langsung melaporkan ke pihak berwajib tanpa klarifikasi","Memberikan sanksi langsung tanpa proses pembinaan","Mengabaikan temuan karena dianggap urusan internal madrasah","Melakukan pendampingan dan pembinaan terkait tata kelola keuangan yang akuntabel, sekaligus memastikan kepatuhan terhadap regulasi penggunaan dana BOS","Menutupi temuan demi menjaga nama baik madrasah"],"k":3,"p":"Pengawas yang menemukan pengelolaan keuangan kurang transparan sebaiknya melakukan pendampingan dan pembinaan tata kelola keuangan yang akuntabel, memastikan kepatuhan regulasi, sebelum mengambil langkah lebih lanjut jika diperlukan."},{"m":1,"q":"Instrumen yang digunakan pengawas untuk menilai kelengkapan dan keakuratan administrasi kepegawaian (PTK) di madrasah binaan disebut...","o":["Instrumen supervisi akademik","Instrumen supervisi manajerial bidang PTK","Buku tamu madrasah","Rapor siswa","Daftar hadir supervisi kelas"],"k":1,"p":"Instrumen supervisi manajerial bidang PTK digunakan pengawas untuk menilai kelengkapan dan keakuratan administrasi kepegawaian, mencakup data kualifikasi, sertifikasi, dan penempatan tenaga pendidik dan kependidikan di madrasah."},{"m":1,"q":"Pak Pengawas Junaidi menemukan bahwa sarana laboratorium di madrasah binaan belum dimanfaatkan optimal meski tersedia. Rekomendasi tindak lanjut yang tepat adalah...","o":["Mengusulkan penghapusan aset laboratorium","Menunda tindak lanjut hingga tahun ajaran berikutnya","Mengabaikan temuan karena dianggap bukan prioritas","Menyalahkan kepala madrasah sepenuhnya tanpa solusi","Mendorong madrasah menyusun jadwal pemanfaatan yang terstruktur serta memberikan pelatihan bagi guru terkait pemanfaatan sarana tersebut dalam pembelajaran"],"k":4,"p":"Sarana yang belum dimanfaatkan optimal sebaiknya ditindaklanjuti dengan mendorong penyusunan jadwal pemanfaatan terstruktur serta pelatihan guru, memastikan investasi sarana benar-benar mendukung peningkatan kualitas pembelajaran."},{"m":1,"q":"Untuk menilai efektivitas kepemimpinan kepala madrasah dalam supervisi manajerial, pengawas perlu memperhatikan indikator...","o":["Ketercapaian target RKT/RKJM, efektivitas pengelolaan sumber daya, dan iklim kerja madrasah secara keseluruhan","Hanya popularitas kepala madrasah di kalangan guru","Hanya penampilan fisik ruang kepala madrasah","Jumlah rapat yang diselenggarakan","Kepatuhan administratif semata tanpa melihat dampak nyata"],"k":0,"p":"Efektivitas kepemimpinan kepala madrasah dinilai melalui ketercapaian target perencanaan (RKT/RKJM), efektivitas pengelolaan sumber daya, dan iklim kerja madrasah secara keseluruhan, bukan hanya indikator permukaan seperti popularitas atau kepatuhan administratif semata."},{"m":1,"q":"Bu Pengawas Ida memfasilitasi forum kepala madrasah lintas madrasah binaan untuk berbagi praktik baik dalam pengelolaan manajerial. Manfaat utama pendekatan ini adalah...","o":["Hanya formalitas tanpa dampak nyata","Menggantikan sepenuhnya supervisi individual pengawas","Membangun komunitas belajar antarkepala madrasah, memperkuat kapasitas manajerial kolektif melalui pertukaran pengalaman nyata","Tidak relevan dengan tugas pengawasan manajerial","Hanya bermanfaat bagi kepala madrasah baru"],"k":2,"p":"Forum berbagi praktik baik antarkepala madrasah membangun komunitas belajar (professional learning community) yang memperkuat kapasitas manajerial kolektif melalui pertukaran pengalaman nyata, memperluas dampak pembinaan pengawas melampaui supervisi individual."},{"m":1,"q":"Untuk menilai kesesuaian pengelolaan kurikulum (KOSP) madrasah binaan dengan kerangka kurikulum nasional, pengawas perlu menelaah...","o":["Hanya sampul dokumen KOSP","Kesesuaian visi-misi, struktur kurikulum, dan program pengembangan dengan karakteristik peserta didik serta kerangka kurikulum nasional yang berlaku","Jumlah halaman dokumen semata","Hanya tanda tangan pengesahan dokumen","Warna kertas yang digunakan untuk mencetak dokumen"],"k":1,"p":"Telaah KOSP mencakup kesesuaian visi-misi, struktur kurikulum, dan program pengembangan dengan karakteristik peserta didik serta kerangka kurikulum nasional, memastikan dokumen bukan sekadar formalitas administratif tanpa substansi."},{"m":1,"q":"Pak Pengawas Yusuf menerapkan pendekatan supervisi manajerial berbasis siklus PDCA (Plan-Do-Check-Act) dalam pembinaan tata kelola madrasah binaan. Manfaat utama pendekatan ini adalah...","o":["Hanya menambah kerumitan administratif","Hanya efektif untuk madrasah dengan masalah manajerial serius","Tidak relevan dengan tugas pengawasan manajerial","Menggantikan sepenuhnya evaluasi tahunan","Memastikan proses pembinaan tata kelola berkelanjutan dan sistematis, dengan evaluasi dan penyesuaian berulang untuk perbaikan mutu manajerial yang terus-menerus"],"k":4,"p":"Siklus PDCA memastikan proses pembinaan tata kelola berkelanjutan dan sistematis, dengan evaluasi dan penyesuaian berulang untuk perbaikan mutu manajerial yang terus-menerus, bukan pembinaan sesaat tanpa tindak lanjut."},{"m":1,"q":"Untuk menilai efektivitas pengelolaan hubungan madrasah dengan masyarakat (humas), pengawas dapat menelaah...","o":["Tingkat partisipasi dan kepuasan orang tua/komite terhadap program madrasah, serta efektivitas komunikasi dua arah yang dibangun","Hanya jumlah surat masuk dan keluar","Kerapian papan pengumuman madrasah semata","Jumlah followers media sosial madrasah tanpa melihat interaksi nyata","Hanya laporan tertulis tanpa verifikasi lapangan"],"k":0,"p":"Efektivitas pengelolaan humas dinilai melalui tingkat partisipasi dan kepuasan orang tua/komite terhadap program madrasah, serta efektivitas komunikasi dua arah, bukan sekadar indikator administratif atau kuantitatif semata seperti jumlah surat."},{"m":1,"q":"Bu Pengawas Rahayu mendapati pola kelemahan serupa dalam pengelolaan sarana prasarana di beberapa madrasah binaannya. Tindak lanjut paling tepat adalah...","o":["Menangani setiap madrasah secara terpisah tanpa melihat pola bersama","Hanya memberikan teguran tanpa solusi pengembangan","Mengabaikan pola karena dianggap masalah individual madrasah","Merancang program pelatihan/workshop bersama tentang manajemen aset dan sarana prasarana yang menyasar kebutuhan bersama tersebut","Menunggu inisiatif dari masing-masing madrasah secara mandiri"],"k":3,"p":"Pola kelemahan serupa di beberapa madrasah binaan sebaiknya ditindaklanjuti dengan pelatihan/workshop bersama yang menyasar kebutuhan kolektif secara efisien, dibanding penanganan kasus per kasus yang kurang efektif dari sisi sumber daya."},{"m":1,"q":"Untuk memastikan objektivitas dalam menilai kinerja manajerial kepala madrasah, pengawas perlu menggunakan...","o":["Hanya kesan pribadi tanpa instrumen","Penilaian berdasarkan reputasi kepala madrasah semata","Instrumen penilaian kinerja kepala madrasah yang terstandar, berbasis bukti dari dokumen dan observasi lapangan","Mengabaikan konteks madrasah dalam penilaian","Hanya laporan dari guru tanpa verifikasi langsung"],"k":2,"p":"Objektivitas penilaian kinerja manajerial memerlukan instrumen terstandar berbasis bukti dari dokumen dan observasi lapangan, memastikan penilaian akurat dan dapat dipertanggungjawabkan, bukan sekadar kesan atau reputasi semata."},{"m":1,"q":"Pak Pengawas Ridwan memberikan pendampingan khusus kepada kepala madrasah yang baru menjabat dalam menyusun RKJM pertamanya. Manfaat utama pendekatan ini adalah...","o":["Membekali kepala madrasah baru dengan keterampilan perencanaan strategis sejak awal masa jabatan, mempercepat efektivitas kepemimpinan","Hanya menambah beban kerja pengawas","Tidak relevan dengan tugas pengawasan manajerial","Menggantikan sepenuhnya tanggung jawab kepala madrasah","Hanya bermanfaat bagi madrasah besar"],"k":0,"p":"Pendampingan khusus bagi kepala madrasah baru dalam penyusunan RKJM pertama membekali keterampilan perencanaan strategis sejak awal masa jabatan, mempercepat efektivitas kepemimpinan dan mengurangi kesalahan pada tahap krusial transisi kepemimpinan."},{"m":1,"q":"Untuk menilai kesehatan iklim kerja dan budaya organisasi madrasah binaan, pengawas dapat menggunakan teknik...","o":["Hanya observasi fisik gedung madrasah","Membandingkan gaji guru antarmadrasah","Hanya menelaah dokumen administratif","Mengandalkan laporan kepala madrasah semata tanpa verifikasi","Wawancara dan survei kepada guru, staf, serta observasi interaksi sehari-hari di lingkungan madrasah"],"k":4,"p":"Penilaian iklim kerja dan budaya organisasi memerlukan wawancara dan survei kepada guru serta staf, dipadukan observasi interaksi sehari-hari di lingkungan madrasah, memberikan gambaran lebih akurat dibanding hanya menelaah dokumen administratif."},{"m":1,"q":"Bu Pengawas Fatimah mendorong madrasah binaan menerapkan sistem informasi manajemen digital untuk mengelola data akademik dan administrasi secara terintegrasi. Manfaat utama rekomendasi ini adalah...","o":["Hanya menambah kerumitan administrasi","Meningkatkan efisiensi, akurasi, dan transparansi pengelolaan data madrasah, memudahkan pengambilan keputusan berbasis data","Menggantikan sepenuhnya peran tenaga administrasi","Tidak relevan dengan mutu pendidikan","Hanya bermanfaat untuk madrasah besar"],"k":1,"p":"Sistem informasi manajemen digital terintegrasi meningkatkan efisiensi, akurasi, dan transparansi pengelolaan data, memudahkan kepala madrasah mengambil keputusan berbasis data, relevan direkomendasikan pengawas sebagai bagian pembinaan manajerial modern."},{"m":1,"q":"Untuk menindaklanjuti hasil supervisi manajerial secara efektif, pengawas perlu menyusun...","o":["Laporan tanpa rencana tindak lanjut konkret","Hanya menyimpan hasil supervisi sebagai arsip","Rekomendasi yang spesifik, terukur, dan realistis sesuai kondisi masing-masing madrasah, disertai jadwal monitoring implementasinya","Menyerahkan sepenuhnya tindak lanjut kepada kepala madrasah tanpa pendampingan","Rekomendasi umum yang berlaku sama untuk semua madrasah binaan"],"k":2,"p":"Tindak lanjut supervisi manajerial yang efektif memerlukan rekomendasi spesifik, terukur, dan realistis sesuai kondisi masing-masing madrasah, disertai jadwal monitoring implementasi, memastikan perbaikan yang direncanakan benar-benar terlaksana."},{"m":1,"q":"Pak Pengawas Bambang menemukan bahwa manajemen konflik internal di salah satu madrasah binaan kurang efektif, menyebabkan ketegangan antarguru berkepanjangan. Pendekatan supervisi manajerial yang tepat adalah...","o":["Mengabaikan konflik karena dianggap urusan internal","Melaporkan konflik tanpa upaya penyelesaian","Memihak salah satu pihak yang berkonflik","Membantu kepala madrasah mengembangkan keterampilan manajemen konflik dan mediasi, sekaligus memfasilitasi dialog jika diperlukan untuk meredakan ketegangan","Mengganti kepala madrasah sebagai solusi instan"],"k":3,"p":"Pengawas dapat membantu kepala madrasah mengembangkan keterampilan manajemen konflik dan mediasi, serta memfasilitasi dialog jika diperlukan, mendukung penyelesaian konflik internal secara konstruktif tanpa mengambil alih tanggung jawab kepemimpinan madrasah."},{"m":1,"q":"Untuk memastikan keberlanjutan program unggulan madrasah binaan meski terjadi pergantian kepala madrasah, pengawas perlu mendorong...","o":["Program hanya bergantung pada inisiatif kepala madrasah yang menjabat saat ini","Hanya kepala madrasah yang mengetahui detail program","Penghentian program saat terjadi pergantian kepemimpinan","Dokumentasi yang baik dan pelembagaan sistem program agar tidak bergantung sepenuhnya pada individu tertentu","Mengabaikan pentingnya dokumentasi program unggulan"],"k":3,"p":"Keberlanjutan program unggulan memerlukan dokumentasi yang baik dan pelembagaan sistem, sehingga program tidak bergantung sepenuhnya pada individu kepala madrasah tertentu dan dapat terus berjalan meski terjadi pergantian kepemimpinan."},{"m":1,"q":"Bu Pengawas Nurhayati menelaah laporan keuangan RKAM madrasah binaan untuk memastikan kesesuaian antara perencanaan dan realisasi anggaran. Manfaat utama telaah ini adalah...","o":["Hanya formalitas administratif semata","Memastikan akuntabilitas dan transparansi pengelolaan keuangan madrasah, mendeteksi potensi penyimpangan sejak dini","Menggantikan sepenuhnya peran auditor internal","Tidak relevan dengan tugas pengawasan manajerial","Hanya bermanfaat menjelang akhir tahun anggaran"],"k":1,"p":"Telaah kesesuaian perencanaan dan realisasi anggaran memastikan akuntabilitas dan transparansi pengelolaan keuangan madrasah, membantu mendeteksi potensi penyimpangan sejak dini sebagai bagian dari fungsi pengawasan manajerial."},{"m":1,"q":"Untuk membangun kapasitas kepala madrasah binaan dalam manajemen risiko, pengawas dapat memberikan pembinaan tentang...","o":["Hanya mengandalkan respons spontan tanpa perencanaan","Hanya menyiapkan dokumen tanpa simulasi praktik","Mengabaikan perencanaan risiko karena dianggap jarang terjadi","Menyerahkan seluruh tanggung jawab risiko kepada pihak eksternal","Identifikasi potensi risiko, analisis dampak, dan penyusunan langkah mitigasi serta rencana kontingensi untuk berbagai skenario"],"k":4,"p":"Pembinaan manajemen risiko mencakup identifikasi potensi risiko, analisis dampak, dan penyusunan langkah mitigasi serta rencana kontingensi, membekali kepala madrasah kesiapan menghadapi berbagai skenario yang mungkin terjadi."},{"m":1,"q":"Pak Pengawas Slamet mengintegrasikan nilai amanah dan keteladanan dalam melaksanakan tugas supervisi manajerial, memastikan proses pembinaan dilakukan dengan niat tulus membantu madrasah berkembang. Pendekatan ini mencerminkan...","o":["Nilai kepemimpinan pengawasan yang Islami, memperkuat esensi tugas pengawasan manajerial sebagai pembinaan yang suportif dan bermartabat","Formalitas administratif semata","Tidak relevan dengan prinsip pengawasan modern","Hanya relevan bagi pengawas yang religius","Menggantikan sepenuhnya standar profesional pengawasan"],"k":0,"p":"Mengintegrasikan nilai amanah dan keteladanan dalam supervisi manajerial memperkuat esensi pengawasan sebagai pembinaan yang suportif dan bermartabat, selaras dengan prinsip pengawasan modern sekaligus nilai keislaman yang relevan di lingkungan madrasah."},{"m":1,"q":"Untuk mengevaluasi efektivitas program supervisi manajerial secara keseluruhan dalam satu tahun, pengawas dapat menganalisis...","o":["Hanya jumlah kunjungan yang dilakukan","Opini pribadi pengawas semata","Perkembangan tata kelola dan capaian standar madrasah binaan dari waktu ke waktu, serta tingkat implementasi rekomendasi tindak lanjut","Perbandingan semata antarmadrasah binaan tanpa konteks","Hanya kepatuhan madrasah terhadap jadwal kunjungan"],"k":2,"p":"Evaluasi efektivitas program supervisi manajerial yang komprehensif menganalisis perkembangan tata kelola dan capaian standar dari waktu ke waktu, serta implementasi rekomendasi, bukan hanya indikator kuantitatif seperti jumlah kunjungan."},{"m":1,"q":"Bu Pengawas Marlina mendorong madrasah binaan membentuk tim penjaminan mutu internal (TPMI) untuk memperkuat budaya evaluasi diri berkelanjutan. Manfaat utama rekomendasi ini adalah...","o":["Hanya menambah struktur organisasi tanpa fungsi nyata","Membangun sistem penjaminan mutu internal yang berkelanjutan, mengurangi ketergantungan penuh pada supervisi eksternal pengawas","Menggantikan sepenuhnya fungsi pengawasan eksternal","Tidak relevan dengan tugas pengawasan manajerial","Hanya bermanfaat bagi madrasah besar dengan sumber daya melimpah"],"k":1,"p":"Tim Penjaminan Mutu Internal (TPMI) membangun sistem evaluasi diri berkelanjutan di madrasah, mengurangi ketergantungan penuh pada supervisi eksternal pengawas, memperkuat kapasitas internal madrasah dalam menjaga dan meningkatkan mutu secara mandiri."},{"m":1,"q":"Untuk memastikan konsistensi standar penilaian supervisi manajerial antarpengawas dalam satu wilayah kerja, diperlukan...","o":["Membiarkan setiap pengawas menggunakan standar masing-masing","Menyerahkan sepenuhnya pada penilaian subjektif masing-masing pengawas","Hanya satu pengawas yang menentukan standar untuk seluruh wilayah","Mengabaikan perbedaan standar karena dianggap tidak penting","Kalibrasi bersama terhadap instrumen dan kriteria penilaian supervisi manajerial melalui forum koordinasi pengawas secara berkala"],"k":4,"p":"Konsistensi standar antarpengawas memerlukan kalibrasi bersama melalui forum koordinasi pengawas secara berkala, memastikan persepsi dan kriteria penilaian selaras sehingga hasil supervisi manajerial objektif di seluruh wilayah kerja."},{"m":1,"q":"Pak Pengawas Iskandar menelaah kesesuaian struktur organisasi madrasah binaan dengan kebutuhan riil dan beban kerja yang ada. Manfaat utama telaah ini adalah...","o":["Memastikan struktur organisasi efektif dan efisien, menghindari tumpang tindih tugas atau kekosongan tanggung jawab yang dapat menghambat kinerja madrasah","Hanya formalitas administratif semata","Menggantikan sepenuhnya kewenangan kepala madrasah dalam menyusun struktur","Tidak relevan dengan tugas pengawasan manajerial","Hanya bermanfaat bagi madrasah besar dengan banyak staf"],"k":0,"p":"Telaah kesesuaian struktur organisasi dengan kebutuhan riil memastikan struktur efektif dan efisien, menghindari tumpang tindih tugas atau kekosongan tanggung jawab yang dapat menghambat kinerja madrasah secara keseluruhan."},{"m":1,"q":"Bu Pengawas Halimah memberikan rekomendasi kepada madrasah binaan untuk mendiversifikasi sumber pendanaan di luar BOS, seperti kemitraan dan unit usaha madrasah. Manfaat utama rekomendasi ini adalah...","o":["Hanya menambah beban kerja kepala madrasah","Menggantikan sepenuhnya kewajiban pemerintah dalam pendanaan pendidikan","Tidak relevan dengan tugas pengawasan manajerial","Mengurangi ketergantungan pada satu sumber dana, meningkatkan ketahanan finansial madrasah untuk mendukung program pengembangan jangka panjang","Hanya efektif untuk madrasah di perkotaan"],"k":3,"p":"Diversifikasi sumber pendanaan mengurangi ketergantungan pada satu sumber dana (BOS), meningkatkan ketahanan finansial madrasah untuk mendukung program pengembangan jangka panjang, relevan sebagai bagian pembinaan manajerial pengawas terkait keberlanjutan madrasah."},{"m":1,"q":"Untuk menilai efektivitas pengelolaan arsip dan dokumentasi madrasah binaan, pengawas perlu memperhatikan...","o":["Hanya kerapian fisik lemari arsip","Jumlah dokumen yang tersimpan tanpa melihat kualitas pengelolaannya","Sistem pengarsipan yang tertata, mudah diakses, dan mendukung akuntabilitas serta kesinambungan informasi madrasah","Hanya dokumen terbaru tanpa memperhatikan arsip historis","Warna map yang digunakan untuk menyimpan dokumen"],"k":2,"p":"Efektivitas pengelolaan arsip dinilai dari sistem pengarsipan yang tertata, mudah diakses, dan mendukung akuntabilitas serta kesinambungan informasi madrasah, bukan sekadar aspek kerapian fisik semata."},{"m":1,"q":"Pak Pengawas Wahyudi mendorong madrasah binaan menerapkan prinsip manajemen berbasis madrasah (MBM) dengan melibatkan guru, komite, dan orang tua dalam pengambilan keputusan strategis. Manfaat utama pendekatan ini adalah...","o":["Meningkatkan rasa memiliki dan dukungan kolektif terhadap kebijakan madrasah, memperkaya perspektif dalam pengambilan keputusan strategis","Hanya memperlambat proses pengambilan keputusan","Melemahkan otoritas kepala madrasah","Tidak relevan dengan tugas pengawasan manajerial","Hanya efektif untuk madrasah kecil"],"k":0,"p":"Manajemen Berbasis Madrasah (MBM) yang melibatkan berbagai pemangku kepentingan meningkatkan rasa memiliki dan dukungan kolektif terhadap kebijakan madrasah, memperkaya perspektif dalam pengambilan keputusan strategis dibanding keputusan sepihak kepala madrasah."},{"m":1,"q":"Untuk membangun sistem monitoring dan evaluasi (monev) yang efektif terhadap implementasi rekomendasi supervisi manajerial, pengawas perlu memastikan...","o":["Monev hanya dilakukan sekali tanpa tindak lanjut","Monev hanya berupa laporan tertulis tanpa verifikasi lapangan","Monev diserahkan sepenuhnya kepada madrasah tanpa keterlibatan pengawas","Mengabaikan hasil monev jika menunjukkan kemajuan yang lambat","Monev dilakukan secara berkala dengan indikator yang jelas, disertai umpan balik konstruktif bagi madrasah binaan"],"k":4,"p":"Sistem monev yang efektif memerlukan pelaksanaan berkala dengan indikator jelas, disertai umpan balik konstruktif bagi madrasah binaan, memastikan implementasi rekomendasi supervisi manajerial benar-benar berjalan dan memberikan dampak nyata."},{"m":1,"q":"Bu Pengawas Suryani menemukan bahwa salah satu madrasah binaan kesulitan mengelola data PTK karena keterbatasan kompetensi digital staf tata usaha. Tindak lanjut yang tepat adalah...","o":["Mengabaikan kesulitan tersebut karena dianggap bukan prioritas","Merekomendasikan pelatihan literasi digital bagi staf tata usaha, disertai pendampingan penggunaan sistem informasi manajemen kepegawaian","Mengambil alih pengelolaan data secara langsung","Menyalahkan staf tata usaha tanpa solusi pengembangan","Menunda penanganan hingga masalah semakin parah"],"k":1,"p":"Kesulitan pengelolaan data akibat keterbatasan kompetensi digital sebaiknya ditindaklanjuti dengan pelatihan literasi digital dan pendampingan penggunaan sistem informasi, membangun kapasitas internal madrasah dalam jangka panjang."},{"m":1,"q":"Untuk mengembangkan kompetensi diri secara berkelanjutan dalam bidang supervisi manajerial, pengawas perlu...","o":["Mengandalkan pengalaman lama tanpa pembaruan pengetahuan","Menghindari perubahan kebijakan manajemen pendidikan","Mengikuti pelatihan manajemen pendidikan terkini, membaca kebijakan terbaru, dan aktif dalam forum profesi pengawas","Hanya mengandalkan instruksi atasan tanpa inisiatif belajar mandiri","Membatasi diri pada rutinitas kerja tanpa pengembangan diri"],"k":2,"p":"Pengembangan kompetensi berkelanjutan pengawas dalam supervisi manajerial memerlukan partisipasi aktif dalam pelatihan manajemen pendidikan terkini, pembaruan pengetahuan kebijakan, dan forum profesi, memastikan kompetensi pengawas tetap relevan dan mutakhir."},{"m":1,"q":"Pak Pengawas Anwar merekomendasikan madrasah binaan untuk menyusun rencana kesinambungan operasional (business continuity plan) menghadapi situasi darurat. Manfaat utama rekomendasi ini adalah...","o":["Hanya menambah dokumen administratif tanpa manfaat praktis","Menggantikan sepenuhnya tanggung jawab pemerintah dalam penanganan bencana","Tidak relevan dengan tugas pengawasan manajerial","Memastikan madrasah siap merespons situasi darurat (bencana, wabah) dengan prosedur yang jelas, meminimalkan gangguan terhadap proses pendidikan","Hanya diperlukan bagi madrasah di daerah rawan bencana"],"k":3,"p":"Rencana kesinambungan operasional memastikan madrasah siap merespons situasi darurat dengan prosedur jelas, meminimalkan gangguan terhadap proses pendidikan, relevan sebagai bagian pembinaan manajerial pengawas terkait kesiapsiagaan madrasah."},{"m":1,"q":"Untuk menilai kesesuaian pengelolaan perpustakaan madrasah dengan standar sarana prasarana, pengawas perlu menelaah...","o":["Hanya jumlah buku yang tersedia","Warna cat dinding ruang perpustakaan","Hanya kerapian rak buku semata","Kelengkapan koleksi, sistem pengelolaan, tingkat pemanfaatan oleh siswa dan guru, serta kesesuaiannya dengan kebutuhan kurikulum","Jumlah kunjungan tanpa melihat kualitas pemanfaatan"],"k":3,"p":"Telaah pengelolaan perpustakaan mencakup kelengkapan koleksi, sistem pengelolaan, tingkat pemanfaatan oleh warga madrasah, serta kesesuaian dengan kebutuhan kurikulum, memberikan gambaran komprehensif bukan sekadar aspek kuantitatif semata."},{"m":1,"q":"Bu Pengawas Zubaidah membangun hubungan komunikasi yang terbuka dengan kepala madrasah binaan, tidak hanya bersifat evaluatif tetapi juga suportif dalam pemecahan masalah bersama. Manfaat utama pendekatan ini adalah...","o":["Hanya melemahkan objektivitas pengawas","Membangun kepercayaan dan kolaborasi yang memungkinkan kepala madrasah lebih terbuka mengomunikasikan tantangan yang dihadapi, mempercepat penyelesaian masalah","Tidak relevan dengan tujuan supervisi manajerial","Mengurangi wibawa dan otoritas pengawas","Hanya efektif dengan kepala madrasah yang sudah berpengalaman"],"k":1,"p":"Komunikasi yang terbuka dan suportif membangun kepercayaan dan kolaborasi, memungkinkan kepala madrasah lebih terbuka mengomunikasikan tantangan yang dihadapi, mempercepat penyelesaian masalah dibanding hubungan yang murni evaluatif dan berjarak."},{"m":1,"q":"Untuk memastikan program supervisi manajerial pengawas sejalan dengan kebijakan pendidikan terbaru dari Kementerian Agama, pengawas perlu...","o":["Mengandalkan pemahaman kebijakan lama tanpa pembaruan","Hanya mengandalkan sosialisasi tanpa pendalaman mandiri","Menyerahkan sepenuhnya pemahaman kebijakan kepada kepala madrasah","Mengabaikan perubahan kebijakan yang dianggap tidak signifikan","Secara aktif mempelajari regulasi dan kebijakan terbaru sebelum melaksanakan pembinaan ke madrasah binaan"],"k":4,"p":"Pengawas perlu secara aktif mempelajari regulasi dan kebijakan pendidikan terbaru sebelum melaksanakan pembinaan, memastikan arahan yang diberikan kepada madrasah binaan akurat dan sesuai perkembangan kebijakan terkini."},{"m":1,"q":"Pak Pengawas Suryadi mendorong madrasah binaan menyusun SOP (Standar Operasional Prosedur) untuk berbagai layanan administratif (mis. penerimaan siswa baru, pengurusan surat). Manfaat utama rekomendasi ini adalah...","o":["Memastikan konsistensi dan kualitas layanan administratif, memudahkan pelaksanaan tugas meski terjadi pergantian petugas","Hanya menambah dokumen tanpa manfaat praktis","Tidak relevan dengan tugas pengawasan manajerial","Menggantikan sepenuhnya kebijaksanaan petugas dalam situasi khusus","Hanya diperlukan bagi madrasah besar dengan banyak siswa"],"k":0,"p":"SOP layanan administratif memastikan konsistensi dan kualitas layanan, memudahkan pelaksanaan tugas meski terjadi pergantian petugas, relevan sebagai bagian pembinaan manajerial pengawas untuk meningkatkan profesionalisme tata kelola madrasah."},{"m":1,"q":"Untuk menilai efektivitas pengelolaan ekstrakurikuler madrasah binaan dari sisi manajerial, pengawas perlu menelaah...","o":["Hanya jumlah ekstrakurikuler yang tersedia","Hanya prestasi kompetisi yang diraih semata","Perencanaan program, alokasi sumber daya (pembina, sarana, waktu), dan dampaknya terhadap pengembangan bakat serta karakter siswa","Jumlah peserta tanpa melihat kualitas pembinaan","Popularitas ekstrakurikuler di kalangan siswa"],"k":2,"p":"Telaah pengelolaan ekstrakurikuler mencakup perencanaan program, alokasi sumber daya, dan dampaknya terhadap pengembangan bakat serta karakter siswa, memberikan gambaran manajerial yang komprehensif bukan sekadar indikator kuantitatif semata."},{"m":1,"q":"Bu Pengawas Aisyah melibatkan kepala madrasah binaan dalam merumuskan indikator keberhasilan program pembinaan sebelum pelaksanaan supervisi manajerial. Manfaat utama pendekatan partisipatif ini adalah...","o":["Hanya menambah proses birokrasi","Meningkatkan relevansi indikator dengan kondisi riil madrasah serta membangun kesepahaman bersama tentang tujuan pembinaan","Mengurangi objektivitas proses supervisi","Tidak relevan dengan efektivitas program pembinaan","Hanya efektif jika jumlah madrasah binaan sedikit"],"k":1,"p":"Pelibatan kepala madrasah dalam merumuskan indikator keberhasilan meningkatkan relevansi dengan kondisi riil madrasah serta membangun kesepahaman bersama tentang tujuan pembinaan, memperkuat komitmen implementasi program supervisi manajerial."},{"m":1,"q":"Untuk memastikan hasil supervisi manajerial dapat digunakan sebagai dasar pengembangan kebijakan di tingkat Kankemenag, pengawas perlu...","o":["Menyimpan hasil supervisi sebagai dokumen rahasia tanpa analisis lanjutan","Membatasi akses hasil supervisi hanya untuk pengawas yang bersangkutan","Menggunakan hasil supervisi hanya untuk keperluan individu madrasah semata","Mengabaikan keterkaitan hasil supervisi dengan kebijakan tingkat kabupaten","Menganalisis pola dan tren dari keseluruhan hasil supervisi madrasah binaan untuk mengidentifikasi kebutuhan pengembangan kebijakan yang lebih luas"],"k":4,"p":"Menganalisis pola dan tren dari keseluruhan hasil supervisi madrasah binaan membantu mengidentifikasi kebutuhan pengembangan kebijakan di tingkat Kankemenag secara lebih luas, menjadikan hasil supervisi individual bermanfaat bagi perencanaan strategis yang lebih besar."},{"m":2,"q":"Kegiatan sistematis mengumpulkan, menganalisis, dan menafsirkan data untuk menentukan tingkat pencapaian tujuan pendidikan disebut...","o":["Evaluasi pendidikan","Supervisi","Akreditasi semata","Sertifikasi","Pengawasan administratif"],"k":0,"p":"Evaluasi pendidikan adalah kegiatan sistematis mengumpulkan, menganalisis, dan menafsirkan data untuk menentukan tingkat pencapaian tujuan pendidikan, menjadi dasar pengambilan keputusan perbaikan dan pengembangan program."},{"m":2,"q":"Pengawas Pak Hakim merancang instrumen evaluasi program madrasah binaan yang mencakup aspek konteks, input, proses, dan produk (CIPP). Manfaat utama model evaluasi ini adalah...","o":["Hanya menambah kerumitan evaluasi","Tidak relevan dengan tugas pengawasan","Menggantikan sepenuhnya evaluasi diri madrasah (EDM)","Memberikan gambaran evaluasi yang komprehensif mencakup seluruh tahapan program, dari perencanaan hingga hasil akhir, sehingga rekomendasi lebih tepat sasaran","Hanya efektif untuk program jangka pendek"],"k":3,"p":"Model evaluasi CIPP (Context, Input, Process, Product) memberikan gambaran komprehensif mencakup seluruh tahapan program, dari perencanaan hingga hasil akhir, sehingga rekomendasi yang dihasilkan lebih tepat sasaran dan menyeluruh."},{"m":2,"q":"Evaluasi yang dilakukan selama program berlangsung untuk memberikan umpan balik perbaikan sebelum program selesai disebut evaluasi...","o":["Sumatif","Diagnostik akhir","Formatif","Ex-post facto","Terminal"],"k":2,"p":"Evaluasi formatif dilakukan selama program berlangsung untuk memberikan umpan balik perbaikan sebelum program selesai, berbeda dengan evaluasi sumatif yang dilakukan di akhir program untuk menilai keseluruhan hasil."},{"m":2,"q":"Bu Pengawas Indrawati menganalisis hasil Asesmen Nasional (AN) dari seluruh madrasah binaannya untuk mengidentifikasi pola capaian literasi-numerasi secara kolektif. Manfaat utama pendekatan berbasis data agregat ini adalah...","o":["Mengidentifikasi kebutuhan pengembangan program pembinaan secara sistemik di tingkat wilayah kerja, bukan hanya kasus per madrasah","Hanya menambah beban administratif pengawas","Tidak relevan dengan tugas evaluasi pendidikan pengawas","Menggantikan sepenuhnya evaluasi individual tiap madrasah","Hanya bermanfaat bagi madrasah dengan capaian tinggi"],"k":0,"p":"Analisis data agregat hasil AN dari seluruh madrasah binaan mengidentifikasi kebutuhan pengembangan program pembinaan secara sistemik di tingkat wilayah kerja, memberikan gambaran pola yang lebih luas dibanding evaluasi kasus per madrasah semata."},{"m":2,"q":"Instrumen evaluasi yang digunakan untuk menilai kelayakan madrasah berdasarkan delapan Standar Nasional Pendidikan secara menyeluruh disebut instrumen...","o":["Supervisi akademik","Uji kompetensi siswa","Evaluasi kinerja individu guru","Sertifikasi pendidik","Akreditasi"],"k":4,"p":"Instrumen akreditasi digunakan untuk menilai kelayakan madrasah berdasarkan delapan Standar Nasional Pendidikan secara menyeluruh, menjadi salah satu bentuk evaluasi eksternal yang komprehensif terhadap mutu satuan pendidikan."},{"m":2,"q":"Pak Pengawas Basuki menemukan bahwa evaluasi pembelajaran di salah satu madrasah binaan masih didominasi tes tertulis tanpa variasi teknik penilaian lain. Rekomendasi yang tepat adalah...","o":["Membiarkan kondisi tersebut karena dianggap sudah cukup","Mendorong guru menerapkan variasi teknik penilaian (portofolio, praktik, proyek) sesuai karakteristik kompetensi yang diukur, disertai pelatihan pendukung","Melarang penggunaan tes tertulis sepenuhnya","Menyeragamkan teknik penilaian tanpa mempertimbangkan karakteristik mata pelajaran","Mengabaikan temuan karena bukan wewenang pengawas"],"k":1,"p":"Dominasi tes tertulis tanpa variasi sebaiknya ditindaklanjuti dengan mendorong penerapan variasi teknik penilaian sesuai karakteristik kompetensi yang diukur, disertai pelatihan pendukung agar guru mampu menerapkannya secara tepat."},{"m":2,"q":"Untuk menjamin validitas hasil evaluasi program madrasah, pengawas perlu memastikan instrumen yang digunakan...","o":["Hanya berdasarkan opini pribadi pengawas","Disusun tanpa mempertimbangkan tujuan evaluasi","Benar-benar mengukur apa yang seharusnya diukur, disertai kejelasan indikator dan kriteria penilaian","Menggunakan bahasa yang rumit agar terlihat ilmiah","Diadopsi langsung tanpa penyesuaian konteks"],"k":2,"p":"Validitas instrumen evaluasi memastikan instrumen benar-benar mengukur apa yang seharusnya diukur (validitas konstruk/isi), disertai kejelasan indikator dan kriteria penilaian, menjadi syarat penting agar hasil evaluasi dapat dipercaya."},{"m":2,"q":"Bu Pengawas Rosita melibatkan guru, kepala madrasah, dan komite dalam proses evaluasi program madrasah, bukan melakukannya secara sepihak. Manfaat utama pendekatan partisipatif ini adalah...","o":["Hanya memperlambat proses evaluasi","Tidak relevan dengan tujuan evaluasi pendidikan","Mengurangi objektivitas hasil evaluasi","Memperoleh perspektif yang lebih komprehensif serta meningkatkan penerimaan terhadap hasil evaluasi dan rekomendasi yang dihasilkan","Hanya efektif untuk madrasah kecil"],"k":3,"p":"Evaluasi partisipatif yang melibatkan berbagai pemangku kepentingan memperoleh perspektif lebih komprehensif serta meningkatkan penerimaan terhadap hasil dan rekomendasi, memperkuat kemungkinan tindak lanjut benar-benar dilaksanakan."},{"m":2,"q":"Evaluasi yang dilakukan pada akhir suatu program untuk menilai keseluruhan pencapaian dan menentukan keberhasilan program disebut evaluasi...","o":["Formatif","Proses semata","Diagnostik awal","Sumatif","Harian"],"k":3,"p":"Evaluasi sumatif dilakukan pada akhir suatu program untuk menilai keseluruhan pencapaian dan menentukan keberhasilan program secara menyeluruh, berbeda dengan evaluasi formatif yang dilakukan selama proses berlangsung."},{"m":2,"q":"Pak Pengawas Darmawan menyusun laporan evaluasi yang tidak hanya berisi skor/angka, tetapi juga narasi analitis tentang faktor penyebab dan rekomendasi kontekstual. Manfaat utama pendekatan ini adalah...","o":["Hanya menambah panjang laporan tanpa nilai tambah","Memberikan pemahaman yang lebih mendalam tentang akar masalah, sehingga rekomendasi yang diberikan lebih tepat sasaran dan actionable","Mengurangi objektivitas laporan karena bersifat naratif","Tidak relevan dengan tujuan pelaporan evaluasi","Hanya diperlukan untuk madrasah dengan capaian rendah"],"k":1,"p":"Laporan evaluasi yang disertai narasi analitis tentang faktor penyebab memberikan pemahaman lebih mendalam tentang akar masalah, menghasilkan rekomendasi yang lebih tepat sasaran dan dapat ditindaklanjuti (actionable) dibanding sekadar angka/skor."},{"m":2,"q":"Untuk menilai efektivitas kebijakan pendidikan yang diterapkan di tingkat wilayah kerjanya, pengawas dapat menggunakan pendekatan evaluasi...","o":["Hanya opini subjektif tanpa data pendukung","Menilai kebijakan berdasarkan popularitasnya semata","Mengabaikan dampak kebijakan terhadap madrasah","Hanya membandingkan dengan wilayah lain tanpa konteks","Berbasis bukti (evidence-based evaluation) yang menganalisis dampak kebijakan terhadap indikator mutu pendidikan secara objektif"],"k":4,"p":"Evaluasi berbasis bukti (evidence-based evaluation) menganalisis dampak kebijakan terhadap indikator mutu pendidikan secara objektif, memberikan dasar yang kredibel untuk menilai efektivitas kebijakan yang diterapkan di wilayah kerja."},{"m":2,"q":"Bu Pengawas Nabila menerapkan prinsip evaluasi yang berkelanjutan (bukan sekadar evaluasi tahunan sesaat) terhadap program madrasah binaan. Manfaat utama pendekatan ini adalah...","o":["Memungkinkan deteksi dini permasalahan dan penyesuaian program secara responsif, tidak menunggu hingga akhir periode untuk melakukan perbaikan","Hanya menambah beban kerja tanpa manfaat tambahan","Tidak relevan dengan prinsip evaluasi modern","Mengurangi fokus pada evaluasi akhir yang lebih penting","Hanya efektif untuk program berskala besar"],"k":0,"p":"Evaluasi berkelanjutan memungkinkan deteksi dini permasalahan dan penyesuaian program secara responsif, tidak menunggu hingga akhir periode untuk melakukan perbaikan, meningkatkan efektivitas program secara keseluruhan."},{"m":2,"q":"Untuk menjamin reliabilitas instrumen evaluasi yang digunakan berulang kali di berbagai madrasah binaan, pengawas perlu memastikan instrumen...","o":["Disusun secara acak tanpa uji coba","Selalu menghasilkan skor tinggi agar madrasah senang","Menghasilkan hasil yang konsisten meski digunakan oleh evaluator atau pada waktu yang berbeda","Hanya digunakan sekali tanpa perlu konsistensi","Berbeda-beda setiap kali digunakan agar tidak monoton"],"k":2,"p":"Reliabilitas instrumen evaluasi menjamin instrumen menghasilkan hasil yang konsisten meski digunakan oleh evaluator berbeda atau pada waktu berbeda, penting agar hasil evaluasi dapat dipercaya dan dibandingkan secara adil antarmadrasah."},{"m":2,"q":"Pak Pengawas Firmansyah menggunakan hasil evaluasi sebagai dasar memberikan penghargaan sekaligus pendampingan intensif, bukan sekadar sanksi bagi madrasah dengan capaian rendah. Pendekatan ini mencerminkan prinsip evaluasi yang...","o":["Punitif semata","Konstruktif, berorientasi pada perbaikan dan pengembangan, bukan sekadar penghakiman","Menghukum tanpa solusi","Hanya fokus pada capaian tinggi","Mengabaikan madrasah dengan capaian rendah"],"k":1,"p":"Pendekatan evaluasi yang konstruktif berorientasi pada perbaikan dan pengembangan, memberikan penghargaan bagi capaian baik sekaligus pendampingan intensif bagi yang memerlukan, bukan sekadar penghakiman atau sanksi semata."},{"m":2,"q":"Untuk mengevaluasi dampak program pengembangan profesional guru (PKB) terhadap kualitas pembelajaran, pengawas perlu menganalisis keterkaitan antara...","o":["Hanya jumlah guru yang mengikuti pelatihan","Lokasi penyelenggaraan pelatihan","Biaya pelatihan yang dikeluarkan semata","Popularitas pelatihan di kalangan guru","Partisipasi guru dalam PKB dengan perubahan nyata dalam praktik mengajar dan capaian belajar siswa"],"k":4,"p":"Evaluasi dampak PKB perlu menganalisis keterkaitan antara partisipasi guru dengan perubahan nyata dalam praktik mengajar dan capaian belajar siswa, memastikan program benar-benar berdampak bukan sekadar terlaksana secara administratif."},{"m":2,"q":"Bu Pengawas Kartini merancang evaluasi program yang melibatkan triangulasi sumber data (dokumen, observasi, wawancara) untuk meningkatkan kredibilitas hasil. Manfaat utama triangulasi ini adalah...","o":["Memverifikasi temuan dari berbagai sumber untuk mengurangi bias dan meningkatkan keakuratan kesimpulan evaluasi","Hanya menambah waktu pelaksanaan evaluasi","Tidak relevan dengan kualitas hasil evaluasi","Menggantikan sepenuhnya kebutuhan instrumen terstandar","Hanya diperlukan untuk evaluasi berskala besar"],"k":0,"p":"Triangulasi sumber data memverifikasi temuan dari berbagai sudut (dokumen, observasi, wawancara), mengurangi bias satu sumber data tunggal, dan meningkatkan keakuratan serta kredibilitas kesimpulan evaluasi secara keseluruhan."},{"m":2,"q":"Untuk memastikan hasil evaluasi program dapat ditindaklanjuti secara efektif oleh madrasah binaan, pengawas perlu menyusun rekomendasi yang...","o":["Bersifat umum dan berlaku sama untuk semua madrasah","Terlalu ideal tanpa mempertimbangkan keterbatasan sumber daya madrasah","Hanya berupa kritik tanpa solusi","Spesifik, realistis sesuai konteks madrasah, dan disertai langkah konkret yang dapat diimplementasikan","Disampaikan tanpa diskusi dengan pihak madrasah"],"k":3,"p":"Rekomendasi hasil evaluasi yang efektif bersifat spesifik, realistis sesuai konteks dan keterbatasan masing-masing madrasah, disertai langkah konkret yang dapat diimplementasikan, bukan sekadar kritik umum atau rekomendasi ideal tanpa mempertimbangkan kondisi riil."},{"m":2,"q":"Pak Pengawas Iwan menggunakan data hasil evaluasi dari beberapa tahun untuk menganalisis tren perkembangan mutu madrasah binaan (bukan hanya snapshot satu tahun). Manfaat utama pendekatan longitudinal ini adalah...","o":["Hanya menambah kompleksitas analisis","Tidak relevan dengan tujuan evaluasi","Memberikan gambaran perkembangan yang lebih akurat, membedakan tren jangka panjang dari fluktuasi sesaat","Menggantikan sepenuhnya kebutuhan evaluasi tahunan","Hanya bermanfaat untuk madrasah dengan data lengkap"],"k":2,"p":"Analisis data longitudinal (beberapa tahun) memberikan gambaran perkembangan yang lebih akurat, membedakan tren jangka panjang dari fluktuasi sesaat yang mungkin dipengaruhi faktor temporer, meningkatkan kualitas interpretasi hasil evaluasi."},{"m":2,"q":"Untuk menjaga objektivitas dan menghindari konflik kepentingan dalam evaluasi program madrasah binaan, pengawas perlu...","o":["Menerapkan prosedur evaluasi yang transparan dan berbasis bukti, serta menghindari keberpihakan yang tidak berdasar data","Melibatkan pihak yang memiliki kepentingan langsung terhadap hasil evaluasi","Mengabaikan aspek etika dalam pelaksanaan evaluasi","Memberikan penilaian berdasarkan kedekatan personal dengan kepala madrasah","Menghindari seluruh dokumentasi proses evaluasi"],"k":0,"p":"Menjaga objektivitas memerlukan prosedur evaluasi yang transparan dan berbasis bukti, menghindari keberpihakan yang tidak berdasar data, memastikan integritas proses evaluasi tetap terjaga sesuai kode etik pengawas."},{"m":2,"q":"Bu Pengawas Hasnah mengevaluasi efektivitas program literasi madrasah dengan membandingkan data awal (baseline) dan data setelah program berjalan (endline). Pendekatan ini disebut evaluasi berbasis...","o":["Opini subjektif","Observasi sesaat tanpa data historis","Studi kasus tunggal tanpa pembanding","Wawancara semata","Perbandingan sebelum-sesudah (before-after comparison)"],"k":4,"p":"Evaluasi berbasis perbandingan sebelum-sesudah (before-after comparison) menggunakan data baseline dan endline untuk menilai perubahan yang terjadi akibat program, memberikan bukti lebih kuat tentang dampak program dibanding hanya melihat kondisi akhir semata."},{"m":2,"q":"Untuk memastikan evaluasi program pendidikan inklusif berjalan efektif, pengawas perlu menilai...","o":["Hanya jumlah siswa berkebutuhan khusus yang terdaftar","Kesesuaian layanan, aksesibilitas, dan dukungan yang diberikan terhadap kebutuhan belajar siswa berkebutuhan khusus secara nyata","Hanya keberadaan dokumen kebijakan inklusif tanpa implementasi","Popularitas program inklusif di kalangan masyarakat","Jumlah guru pendamping khusus tanpa menilai kualitas pendampingan"],"k":1,"p":"Evaluasi program pendidikan inklusif menilai kesesuaian layanan, aksesibilitas, dan dukungan nyata terhadap kebutuhan belajar siswa berkebutuhan khusus, bukan sekadar indikator administratif seperti juml
