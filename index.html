<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Latihan Soal AKGTK Pengawas Madrasah 2026</title>
<style>
:root{--bg:#F2F5F3;--panel:#FFFFFF;--ink:#16231E;--mute:#5A6B64;--line:#CBD6D0;--acc:#0B6B4F;--accT:#FFFFFF;--bad:#B3261E;--ok:#0B6B4F;--okBg:#DCEFE6;--badBg:#F8DEDB;--flag:#B7791F;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1A16;--panel:#16251F;--ink:#E6EFEA;--mute:#9DB0A7;--line:#2B3F37;--acc:#4CC49A;--accT:#06251A;--bad:#FF8A80;--ok:#4CC49A;--okBg:#173A2D;--badBg:#472320;--flag:#E3B15C}}
:root[data-theme="dark"]{--bg:#0F1A16;--panel:#16251F;--ink:#E6EFEA;--mute:#9DB0A7;--line:#2B3F37;--acc:#4CC49A;--accT:#06251A;--bad:#FF8A80;--ok:#4CC49A;--okBg:#173A2D;--badBg:#472320;--flag:#E3B15C}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2{font-family:Georgia,"Times New Roman",serif}
.wrap{max-width:860px;margin:0 auto;padding:18px 16px 48px}
h1{font-size:clamp(1.4rem,3vw,2rem);margin:0 0 6px}
h2{font-size:1.15rem;margin:22px 0 8px}
.mute{color:var(--mute)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin:0 0 14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
select,input[type=number]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:6px 8px;max-width:60%}
input[type=number]{width:84px;text-align:right}
button{font:inherit;font-weight:600;background:var(--acc);color:var(--accT);border:0;border-radius:6px;padding:10px 16px;cursor:pointer}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.tag{font-size:.85rem;color:var(--mute)}
.q{font-size:1.05rem;margin:0 0 12px}
.opt{display:flex;gap:10px;width:100%;text-align:left;font-weight:400;background:var(--bg);color:var(--ink);border:1px solid var(--line);margin:0 0 8px;padding:10px 12px}
.opt b{min-width:1.2em}
.opt.sel{border-color:var(--acc);box-shadow:inset 3px 0 0 var(--acc)}
.opt.ok{background:var(--okBg);border-color:var(--ok)}
.opt.no{background:var(--badBg);border-color:var(--bad)}
.pem{border-left:3px solid var(--acc);padding:4px 12px;margin:10px 0 0;color:var(--ink)}
.nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-top:6px}
.nav button{padding:6px 0;font-weight:500;background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.nav .done{background:var(--okBg);border-color:var(--ok)}
.nav .fl{border-color:var(--flag);box-shadow:inset 0 -3px 0 var(--flag)}
.nav .cur{outline:2px solid var(--acc);outline-offset:1px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.big{font:700 2.6rem/1 Georgia,serif;margin:4px 0}
table{width:100%;border-collapse:collapse;font-size:.92rem}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
td:not(:first-child),th:not(:first-child){text-align:right}
.foot{margin-top:28px;padding-top:14px;border-top:1px solid var(--line);text-align:center;color:var(--mute);font-size:.88rem}
.menu{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-bottom:12px}
.m{display:block;text-align:left;width:100%;background:var(--panel);color:var(--ink);border:1px solid var(--line);font-weight:400;padding:14px 16px}
.m b{display:block;font-family:Georgia,serif;font-size:1.05rem;margin-bottom:4px}
.m:hover{border-color:var(--acc)}
input[type=text]{font:inherit;width:100%;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:10px 12px;margin-top:6px}
.rv{border-top:1px solid var(--line);padding:12px 0}
.good{color:var(--ok)}.badc{color:var(--bad)}
.mg{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:12px}
.mc{display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;background:var(--panel);color:var(--ink);border:1px solid var(--line);padding:16px;font-weight:400}
.mc b{font-family:Georgia,serif;font-size:1.05rem}
.mc:hover{border-color:var(--acc)}
.sm{padding:6px 12px}
input[type=text]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:9px 10px;flex:1;min-width:180px}
.foot{text-align:center;color:var(--mute);font-size:.85rem;margin:28px 0 0;padding-top:14px;border-top:1px solid var(--line)}
</style>
</head>

<script>
const Q=[{"m":0,"q":"Fungsi utama pengawas madrasah dalam melaksanakan supervisi akademik adalah membantu guru...","o":["Memeringkat kinerja guru untuk dasar keputusan mutasi dan promosi jabatan","Menilai kepatuhan guru terhadap ketentuan administrasi kepegawaian","Memastikan kelengkapan perangkat pembelajaran guru sebelum akhir tahun ajaran","Mengawasi penggunaan anggaran pembelajaran agar sesuai dengan rencana madrasah","Meningkatkan kualitas proses dan hasil pembelajaran secara berkelanjutan"],"k":4,"p":"Fungsi utama supervisi akademik pengawas adalah membantu guru meningkatkan kualitas proses dan hasil pembelajaran secara berkelanjutan, melalui pembinaan profesional yang suportif bukan sekadar penilaian administratif.","t":0},{"m":0,"q":"Pengawas Madrasah Pak Hidayat melakukan kunjungan ke beberapa madrasah binaan dan mendapati variasi kualitas RPP antarguru. Langkah tindak lanjut paling tepat adalah...","o":["Merancang program pendampingan (workshop/IHT) lintas madrasah binaan yang menyasar kesenjangan kompetensi penyusunan RPP secara terstruktur","Menginstruksikan kepala madrasah menyeragamkan format RPP dan memeriksa kelengkapannya setiap awal semester","Menyusun laporan temuan variasi RPP untuk Kantor Kemenag sebagai dasar evaluasi kinerja madrasah binaan","Membagikan contoh RPP terbaik ke madrasah binaan sebagai acuan, lalu meminta guru menyesuaikannya sendiri","Memberikan teguran tertulis kepada guru yang RPP-nya kurang baik, lalu meminta perbaikan sebelum kunjungan berikutnya"],"k":0,"p":"Pengawas yang menemukan variasi kualitas RPP antarmadrasah binaan sebaiknya merancang program pendampingan terstruktur (workshop/IHT) lintas madrasah yang menyasar kesenjangan kompetensi secara sistematis, bukan sekadar teguran individual.","t":1},{"m":0,"q":"Instrumen yang digunakan pengawas untuk menilai kesesuaian perencanaan pembelajaran (RPP/Modul Ajar) dengan capaian pembelajaran dan karakteristik peserta didik disebut...","o":["Instrumen pemantauan kelengkapan sarana prasarana","Instrumen observasi pelaksanaan pembelajaran di kelas","Instrumen telaah perangkat pembelajaran","Instrumen analisis hasil belajar peserta didik","Instrumen penilaian kinerja kepala madrasah"],"k":2,"p":"Instrumen telaah perangkat pembelajaran digunakan pengawas untuk menilai kesesuaian RPP/Modul Ajar dengan capaian pembelajaran dan karakteristik peserta didik, mencakup aspek kelengkapan komponen dan koherensi antarunsur pembelajaran.","t":0},{"m":0,"q":"Pendekatan supervisi akademik yang dilakukan pengawas dengan cara mengamati langsung proses pembelajaran di kelas untuk mengumpulkan data objektif disebut teknik...","o":["Diskusi kelompok terpumpun","Observasi kelas","Studi dokumen perangkat","Angket persepsi murid","Wawancara individual"],"k":1,"p":"Observasi kelas adalah teknik supervisi akademik yang dilakukan pengawas dengan mengamati langsung proses pembelajaran di kelas untuk mengumpulkan data objektif tentang praktik mengajar guru secara nyata.","t":0},{"m":0,"q":"Bu Pengawas Aminah mendapati salah satu madrasah binaannya kesulitan menerapkan pembelajaran berdiferensiasi karena keterbatasan pemahaman guru. Ia merancang pendampingan bertahap dengan model coaching berkelanjutan, bukan pelatihan satu kali. Manfaat utama pendekatan ini adalah...","o":["Mempercepat pencapaian standar kompetensi yang sama pada akhir semester karena materi disampaikan lebih lengkap oleh pengawas sebagai narasumber utama","Mengurangi beban administrasi guru karena pengawas membantu menyusun perangkat pembelajaran berdiferensiasi dan memantau kelengkapannya setiap bulan","Menghemat waktu pengawas karena pendampingan dapat dilakukan serentak pada banyak guru dalam satu pertemuan klasikal yang terjadwal ketat","Memberi dasar penilaian kinerja yang lebih adil karena setiap tahap pendampingan menghasilkan skor yang dipakai untuk menetapkan angka kredit guru","Memungkinkan internalisasi kompetensi yang lebih mendalam melalui siklus praktik-refleksi-perbaikan berulang, dibanding pelatihan sesaat yang cenderung tidak berdampak jangka panjang"],"k":4,"p":"Coaching berkelanjutan memungkinkan internalisasi kompetensi lebih mendalam melalui siklus praktik-refleksi-perbaikan berulang, terbukti lebih efektif membangun perubahan perilaku mengajar jangka panjang dibanding pelatihan satu kali yang berdampak terbatas.","t":1},{"m":0,"q":"Prinsip supervisi akademik yang menekankan bahwa proses pembinaan harus didasarkan pada kebutuhan riil guru, bukan asumsi sepihak pengawas, disebut prinsip...","o":["Berbasis kebutuhan (need-based)","Berbasis target (target-based)","Berbasis kepatuhan (compliance-based)","Berbasis kinerja (performance-based)","Berbasis hierarki (top-down)"],"k":0,"p":"Prinsip supervisi berbasis kebutuhan (need-based) menekankan bahwa pembinaan harus didasarkan pada kebutuhan riil guru yang teridentifikasi melalui data dan observasi, bukan asumsi sepihak pengawas tanpa dasar empiris.","t":0},{"m":0,"q":"Pengawas Pak Rizal menyusun program supervisi tahunan yang mencakup jadwal, sasaran, teknik, dan indikator keberhasilan untuk seluruh madrasah binaannya. Dokumen ini disebut...","o":["Rencana Kegiatan dan Anggaran Madrasah (RKAM)","Rencana Kerja Tahunan Madrasah (RKT)","Laporan Pelaksanaan Program Pengawasan (LPPP)","Program Pengawasan (Proswas)","Rencana Kerja Jangka Menengah (RKJM)"],"k":3,"p":"Program Pengawasan (Proswas) adalah dokumen perencanaan tahunan pengawas yang mencakup jadwal, sasaran, teknik, dan indikator keberhasilan supervisi terhadap seluruh madrasah binaan, menjadi acuan kerja pengawas selama satu tahun.","t":1},{"m":0,"q":"Untuk memastikan objektivitas dalam menilai kompetensi pedagogik guru saat supervisi, pengawas perlu...","o":["Menggunakan hasil penilaian diri guru sebagai dasar utama skor agar guru merasa dihargai dan tidak tertekan","Mengandalkan kesan umum selama observasi lalu menyesuaikan nilai dengan reputasi guru di lingkungan madrasah","Menggunakan rubrik/instrumen penilaian yang terstandar dan berbasis bukti (evidence-based) dari observasi langsung","Meminta kepala madrasah menentukan nilai akhir guru berdasarkan pengamatan sehari-hari di luar jadwal supervisi","Membandingkan capaian guru dengan guru lain di madrasah yang sama agar peringkat antarguru terlihat jelas"],"k":2,"p":"Objektivitas penilaian kompetensi pedagogik memerlukan rubrik/instrumen terstandar berbasis bukti dari observasi langsung, memastikan penilaian pengawas akurat dan dapat dipertanggungjawabkan, bukan sekadar kesan atau reputasi.","t":0},{"m":0,"q":"Bu Pengawas Hasanah memfasilitasi forum Musyawarah Guru Mata Pelajaran (MGMP) lintas madrasah binaan sebagai wadah berbagi praktik baik pembelajaran. Manfaat utama pendekatan ini adalah...","o":["Membangun komunitas belajar profesional (professional learning community) yang memperkuat kapasitas kolektif guru lintas madrasah","Memberi kesempatan guru mengerjakan administrasi bersama di luar jam mengajar sehingga perangkat pembelajaran terselesaikan tepat waktu","Mengurangi jumlah kunjungan pengawas ke madrasah karena pembinaan guru dialihkan ke forum yang dikelola secara mandiri oleh guru","Menyediakan wadah penyaluran informasi kebijakan dari Kantor Kemenag kepada guru agar pelaksanaan kebijakan lebih cepat dan merata","Menyeragamkan metode mengajar guru lintas madrasah melalui satu model pembelajaran yang ditetapkan pengawas untuk diterapkan bersama"],"k":0,"p":"Forum MGMP yang difasilitasi pengawas membangun komunitas belajar profesional (professional learning community) lintas madrasah, memperkuat kapasitas kolektif guru melalui berbagi praktik baik, memperluas dampak pembinaan melampaui supervisi individual.","t":1},{"m":0,"q":"Tahap dalam siklus supervisi akademik yang dilakukan pengawas dan guru sebelum observasi kelas, untuk menyepakati fokus dan aspek yang akan diamati, disebut...","o":["Refleksi tindak lanjut","Penyusunan laporan supervisi","Pertemuan pasca-observasi","Penilaian kinerja guru","Pertemuan pra-observasi"],"k":4,"p":"Pertemuan pra-observasi dilakukan pengawas dan guru sebelum observasi kelas untuk menyepakati fokus dan aspek yang akan diamati, memastikan proses supervisi terarah dan disepakati bersama, bukan mendadak atau sepihak.","t":0},{"m":0,"q":"Untuk menindaklanjuti hasil supervisi akademik yang menunjukkan kesenjangan kompetensi guru di banyak madrasah binaan, pengawas dapat berkoordinasi dengan...","o":["Dinas pendidikan daerah dan perguruan tinggi, untuk menyusun kebijakan kenaikan pangkat guru berdasarkan hasil supervisi akademik madrasah","Kantor Kemenag, MGMP, dan lembaga pelatihan untuk merancang program pengembangan profesional berkelanjutan (PKB) yang lebih terstruktur dan berdampak luas","Pengawas lain dan wali murid, untuk menyamakan penilaian kinerja guru serta membahas keluhan masyarakat terhadap mutu pembelajaran","Kantor Kemenag dan kepala madrasah, untuk menetapkan sanksi administratif bagi guru yang belum memenuhi standar kompetensi minimal","Kepala madrasah dan komite, agar anggaran pelatihan dapat dialokasikan dari dana BOS untuk semua guru pada tahun anggaran berikutnya"],"k":1,"p":"Kesenjangan kompetensi guru di banyak madrasah binaan memerlukan koordinasi pengawas dengan Kantor Kemenag, MGMP, dan lembaga pelatihan untuk merancang program PKB yang lebih terstruktur, sistemik, dan berdampak luas dibanding penanganan kasus per kasus.","t":0},{"m":0,"q":"Pak Pengawas Fauzi menggunakan pendekatan coaching dengan bertanya reflektif (\"Menurut Bapak/Ibu, apa yang membuat pembelajaran tadi efektif?\") dibanding memberi penilaian langsung. Manfaat utama pendekatan ini adalah...","o":["Menghindari konflik dengan guru karena pengawas tidak perlu menyampaikan temuan observasi yang bersifat kritis kepada guru","Meningkatkan kepatuhan guru terhadap arahan pengawas karena pertanyaan terarah membuat guru menyetujui rencana perbaikan yang sudah disiapkan","Mendorong guru melakukan refleksi mandiri dan menemukan sendiri solusi perbaikan, meningkatkan kepemilikan (ownership) terhadap proses pengembangan diri","Memudahkan pengawas menilai guru karena jawaban reflektif guru dapat langsung dicatat sebagai skor kinerja pada instrumen supervisi","Mempercepat pengambilan keputusan oleh pengawas karena guru yang bertanya balik akan menerima rekomendasi lebih cepat dan jelas"],"k":2,"p":"Pendekatan coaching berbasis pertanyaan reflektif mendorong guru melakukan refleksi mandiri dan menemukan sendiri solusi perbaikan, meningkatkan rasa kepemilikan terhadap proses pengembangan diri dibanding hanya menerima penilaian searah.","t":1},{"m":0,"q":"Aspek yang perlu diperhatikan pengawas saat menelaah kesesuaian penilaian pembelajaran (asesmen) yang dirancang guru adalah...","o":["Kesesuaian jumlah soal ulangan dengan alokasi waktu pembelajaran serta ketepatan format penulisan butir soal oleh guru","Keselarasan jadwal penilaian dengan kalender akademik madrasah dan kesiapan guru melaporkan hasil kepada orang tua murid","Kelengkapan dokumen penilaian guru, seperti daftar nilai dan rekap kehadiran murid, yang disimpan rapi pada akhir semester","Kesesuaian teknik dan instrumen penilaian dengan tujuan pembelajaran serta karakteristik kompetensi yang diukur (kognitif, afektif, psikomotorik)","Tingkat kesulitan soal dan kesesuaiannya dengan rata-rata nilai murid pada semester sebelumnya di madrasah yang sama"],"k":3,"p":"Telaah asesmen pembelajaran mencakup kesesuaian teknik dan instrumen penilaian dengan tujuan pembelajaran serta karakteristik kompetensi yang diukur (kognitif, afektif, psikomotorik), memastikan penilaian benar-benar mengukur capaian yang dimaksud.","t":0},{"m":0,"q":"Bu Pengawas Wardah merancang program pendampingan literasi-numerasi berbasis hasil Asesmen Nasional (AN) di madrasah binaannya. Pendekatan berbasis data ini penting karena...","o":["Mengurangi peran guru dalam merancang pembelajaran karena materi pendampingan telah disiapkan pengawas berdasarkan hasil asesmen","Memastikan semua madrasah binaan memperoleh program yang sama sehingga tidak ada perbedaan layanan pembinaan antarmadrasah","Meningkatkan peringkat madrasah binaan pada penilaian tahunan karena hasil asesmen langsung menentukan akreditasi madrasah","Memastikan program pendampingan tepat sasaran sesuai kebutuhan riil capaian siswa di masing-masing madrasah binaan, meningkatkan efektivitas intervensi","Memudahkan pengawas menyusun laporan karena data Asesmen Nasional dapat disalin langsung menjadi laporan hasil pengawasan"],"k":3,"p":"Program pendampingan berbasis data hasil AN memastikan intervensi tepat sasaran sesuai kebutuhan riil capaian siswa di masing-masing madrasah binaan, meningkatkan efektivitas program dibanding pendekatan generik tanpa dasar data.","t":1},{"m":0,"q":"Untuk membangun hubungan kolaboratif (bukan hierarkis-mengancam) dengan guru selama supervisi, pengawas perlu menerapkan komunikasi yang...","o":["Persuasif, kompetitif, dan berorientasi pada peringkat antarguru","Empatik, suportif, dan berorientasi pada solusi bersama","Tegas, lugas, dan berorientasi pada kepatuhan terhadap arahan","Netral, formal, dan berorientasi pada penyampaian temuan tertulis","Santai, akrab, dan berorientasi pada hubungan pribadi yang erat"],"k":1,"p":"Komunikasi yang empatik, suportif, dan berorientasi solusi bersama membangun hubungan kolaboratif antara pengawas dan guru, menciptakan iklim supervisi yang aman secara psikologis dan mendorong keterbukaan guru terhadap pembinaan.","t":0},{"m":0,"q":"Pengawas Pak Anas menemukan bahwa penerapan kurikulum di salah satu madrasah binaan belum sepenuhnya sesuai pedoman resmi. Langkah pertama yang tepat sebelum mengambil tindakan lebih lanjut adalah...","o":["Melaporkan temuan kepada Kantor Kemenag disertai usulan pembinaan khusus agar keputusan diambil oleh pejabat yang berwenang","Mengumpulkan guru dan menyampaikan hasil temuan secara terbuka agar semua pihak memahami bagian kurikulum yang perlu diperbaiki","Mengganti perangkat kurikulum madrasah dengan dokumen contoh dari madrasah lain yang sudah sesuai pedoman agar cepat terselesaikan","Segera menyampaikan teguran tertulis kepada kepala madrasah agar penerapan kurikulum disesuaikan dengan pedoman resmi sebelum akhir semester","Melakukan klarifikasi dan dialog dengan kepala madrasah serta guru terkait untuk memahami akar penyebab ketidaksesuaian sebelum merumuskan solusi"],"k":4,"p":"Sebelum mengambil tindakan lebih lanjut, pengawas perlu melakukan klarifikasi dan dialog dengan pihak madrasah untuk memahami akar penyebab ketidaksesuaian penerapan kurikulum, memastikan solusi yang dirumuskan tepat sasaran dan konstruktif.","t":1},{"m":0,"q":"Dokumen yang memuat hasil pelaksanaan program pengawasan selama satu tahun, termasuk capaian dan rekomendasi tindak lanjut, disebut...","o":["Laporan Pelaksanaan Program Pengawasan (LPPP)","Laporan Hasil Evaluasi Diri Madrasah (EDM)","Rencana Kerja Jangka Menengah (RKJM)","Program Pengawasan (Proswas)","Sasaran Kinerja Pegawai (SKP)"],"k":0,"p":"Laporan Pelaksanaan Program Pengawasan (LPPP) memuat hasil pelaksanaan program pengawasan selama satu tahun, mencakup capaian, temuan, dan rekomendasi tindak lanjut, menjadi bentuk pertanggungjawaban kinerja pengawas.","t":0},{"m":0,"q":"Untuk memperkuat kapasitas kepala madrasah dalam melaksanakan supervisi internal secara mandiri, pengawas dapat berperan sebagai...","o":["Penilai yang mengukur kinerja supervisi kepala madrasah setiap semester dan menetapkan peringkat antarmadrasah binaan","Fasilitator administrasi yang menyiapkan format laporan supervisi internal agar kepala madrasah tinggal mengisi hasil observasi","Mentor yang membekali kepala madrasah dengan keterampilan supervisi akademik melalui pelatihan dan pendampingan bertahap","Pengganti yang mengambil alih pelaksanaan supervisi akademik di madrasah dan menyerahkan laporan akhir kepada kepala madrasah","Pengamat yang hadir pada setiap supervisi internal dan memberi catatan tertulis kepada kepala madrasah setelah kegiatan selesai"],"k":2,"p":"Pengawas berperan sebagai mentor yang membekali kepala madrasah dengan keterampilan supervisi akademik melalui pelatihan dan pendampingan bertahap, memperkuat kapasitas internal madrasah agar tidak selalu bergantung pada pengawas eksternal.","t":0},{"m":0,"q":"Bu Pengawas Latifah menggunakan hasil supervisi sebagai salah satu data pendukung rekomendasi kenaikan pangkat/jabatan fungsional guru, bukan sebagai alat menghukum. Pendekatan ini mencerminkan prinsip supervisi yang...","o":["Terpisah dari penilaian karier guru agar pembinaan tidak dipengaruhi kepentingan administratif","Terintegrasi dengan sistem pengembangan karier profesional guru secara konstruktif","Setara dengan penilaian kinerja tahunan yang dilakukan oleh kepala madrasah terhadap guru","Bersifat rahasia pengawas dan tidak dibagikan kepada guru maupun kepala madrasah","Berfungsi sebagai dasar sanksi dan penurunan jabatan bagi guru yang belum memenuhi standar"],"k":1,"p":"Mengintegrasikan hasil supervisi dengan sistem pengembangan karier (kenaikan pangkat/jabatan) mencerminkan prinsip supervisi yang konstruktif, mendukung pertumbuhan profesional guru, bukan sekadar alat evaluatif yang bersifat menghukum.","t":1},{"m":0,"q":"Aspek kompetensi profesional guru yang menjadi fokus telaah pengawas dalam supervisi akademik mencakup...","o":["Kemampuan guru mengelola kelas, membangun interaksi dengan murid, dan menerapkan strategi pembelajaran yang sesuai karakteristik peserta didik","Kemampuan guru menyusun administrasi pembelajaran, mengelola dokumen penilaian, dan melaporkan hasil belajar kepada kepala madrasah tepat waktu","Sikap guru dalam bekerja sama dengan rekan sejawat, menjaga ketepatan waktu hadir, dan berpartisipasi dalam kegiatan madrasah","Kemampuan guru memanfaatkan teknologi informasi dalam pembelajaran dan mempublikasikan karya ilmiah pada jurnal yang terakreditasi","Penguasaan materi, struktur, konsep, dan pola pikir keilmuan mata pelajaran yang diampu, serta kemampuan mengembangkannya secara berkelanjutan"],"k":4,"p":"Kompetensi profesional guru mencakup penguasaan materi, struktur, konsep, dan pola pikir keilmuan mata pelajaran yang diampu, serta kemampuan mengembangkan kompetensi tersebut secara berkelanjutan, menjadi salah satu fokus utama telaah pengawas.","t":0},{"m":0,"q":"Pak Pengawas Bahtiar merancang supervisi berbasis siklus PDCA (Plan-Do- Check-Act) dalam pembinaan madrasah binaannya. Manfaat utama pendekatan siklus ini adalah...","o":["Memastikan proses pembinaan berkelanjutan dan sistematis, dengan evaluasi dan penyesuaian berulang untuk perbaikan mutu yang terus- menerus","Mempercepat penyelesaian program pembinaan karena setiap tahap dijalankan satu kali dengan target waktu yang telah ditetapkan","Mengurangi kebutuhan data pembinaan karena keputusan perbaikan diambil berdasarkan pengalaman pengawas pada tahun-tahun sebelumnya","Menyeragamkan pembinaan di setiap madrasah binaan karena langkah Plan sampai Act ditetapkan Kantor Kemenag secara terpusat","Memudahkan penilaian kinerja pengawas karena setiap tahap siklus menghasilkan angka yang dapat dibandingkan antarpengawas"],"k":0,"p":"Siklus PDCA (Plan-Do-Check-Act) memastikan proses pembinaan berkelanjutan dan sistematis, dengan evaluasi dan penyesuaian berulang untuk perbaikan mutu yang terus-menerus (continuous improvement), bukan pembinaan sesaat tanpa tindak lanjut.","t":1},{"m":0,"q":"Untuk menjaga netralitas dan menghindari konflik kepentingan dalam supervisi, pengawas perlu...","o":["Menolak undangan kegiatan dari madrasah binaan dan menyerahkan tugas pemantauan kepada pengawas lain di wilayah yang sama","Menyesuaikan hasil penilaian dengan harapan kepala madrasah agar hubungan kerja tetap baik dan pembinaan berjalan lancar","Mengutamakan madrasah dengan prestasi tinggi dalam jadwal kunjungan agar hasil pengawasan terlihat baik pada laporan tahunan","Melaksanakan tugas secara profesional dan objektif, menghindari keberpihakan yang tidak berdasar bukti, sesuai kode etik pengawas","Menjaga jarak dengan guru dan kepala madrasah serta membatasi komunikasi pada urusan resmi agar tidak terjadi kedekatan pribadi"],"k":3,"p":"Menjaga netralitas memerlukan pelaksanaan tugas secara profesional dan objektif sesuai kode etik pengawas, menghindari keberpihakan yang tidak berdasar bukti, memastikan integritas proses supervisi tetap terjaga.","t":0},{"m":0,"q":"Bu Pengawas Nurul memfasilitasi kegiatan lesson study antarguru lintas madrasah binaan sebagai strategi pembinaan kolaboratif. Tahapan lesson study yang tepat secara berurutan adalah...","o":["Perencanaan (plan), refleksi (see), pelaksanaan dan observasi (do)","Pelaksanaan dan observasi (do), refleksi (see), perencanaan (plan)","Perencanaan (plan), pelaksanaan dan observasi (do), refleksi (see)","Pelaksanaan (do), perencanaan (plan), refleksi dan observasi (see)","Observasi (see), perencanaan (plan), pelaksanaan dan refleksi (do)"],"k":2,"p":"Lesson study mengikuti tahapan plan (perencanaan bersama), do (pelaksanaan pembelajaran yang diobservasi rekan sejawat), dan see (refleksi bersama atas hasil observasi), menjadi model pembinaan kolaboratif berbasis praktik nyata.","t":1},{"m":0,"q":"Untuk memastikan hasil supervisi akademik dapat ditindaklanjuti secara efektif, pengawas perlu menyusun...","o":["Rekomendasi yang spesifik, terukur, dan realistis, disertai jadwal monitoring implementasinya","Rekomendasi yang disusun oleh kepala madrasah dan disetujui pengawas pada akhir tahun ajaran","Rekomendasi yang bersifat teguran tertulis disertai batas waktu perbaikan bagi guru yang bermasalah","Rekomendasi yang mencakup semua temuan sekaligus dengan target perbaikan dalam satu semester","Rekomendasi yang umum dan fleksibel agar guru bebas menyesuaikannya dengan kondisi masing-masing"],"k":0,"p":"Tindak lanjut supervisi yang efektif memerlukan rekomendasi yang spesifik, terukur, dan realistis (sesuai konteks masing-masing guru), disertai jadwal monitoring implementasi agar perbaikan yang direkomendasikan benar- benar terlaksana.","t":0},{"m":0,"q":"Pengawas Pak Jamal mengintegrasikan nilai keteladanan dan amanah dalam melaksanakan tugas pengawasan, memastikan proses pembinaan dilakukan dengan niat tulus membantu madrasah berkembang. Pendekatan ini mencerminkan...","o":["Strategi pencitraan pengawas di mata madrasah binaan, yang meningkatkan penerimaan guru terhadap hasil pengawasan","Pendekatan kekeluargaan yang mengutamakan kedekatan pribadi pengawas dengan guru dalam menentukan hasil penilaian","Nilai kepatuhan birokrasi yang mengutamakan ketaatan guru pada arahan atasan sebagai ukuran keberhasilan pembinaan","Penerapan formalitas ibadah pada kegiatan pengawasan, yang menggantikan penilaian objektif terhadap kompetensi guru di madrasah","Nilai kepemimpinan pengawasan yang Islami, memperkuat esensi tugas pengawasan sebagai pembinaan yang suportif dan bermartabat"],"k":4,"p":"Mengintegrasikan nilai keteladanan dan amanah dalam tugas pengawasan memperkuat esensi pengawasan sebagai pembinaan yang suportif dan bermartabat, selaras dengan prinsip pengawasan modern sekaligus nilai keislaman yang relevan di lingkungan madrasah.","t":1},{"m":0,"q":"Untuk mengevaluasi efektivitas program pengawasan akademik secara keseluruhan dalam satu tahun, pengawas dapat menganalisis...","o":["Tingkat kepuasan kepala madrasah terhadap sikap pengawas selama kunjungan dan ketepatan jadwal pelaksanaan pembinaan","Perkembangan kompetensi guru dan mutu pembelajaran di madrasah binaan dari waktu ke waktu, serta tingkat implementasi rekomendasi tindak lanjut","Jumlah kunjungan pengawas ke madrasah binaan dan kelengkapan laporan kunjungan yang diserahkan setiap bulan kepada Kantor Kemenag","Kelengkapan administrasi kepegawaian guru di madrasah binaan dan kepatuhan guru terhadap kehadiran pada hari kerja","Capaian akreditasi madrasah pada akhir tahun serta peringkat madrasah dalam lomba tingkat kabupaten"],"k":1,"p":"Evaluasi efektivitas program pengawasan yang komprehensif menganalisis perkembangan kompetensi guru dan mutu pembelajaran dari waktu ke waktu, serta implementasi rekomendasi tindak lanjut, bukan hanya indikator kuantitatif seperti jumlah kunjungan.","t":0},{"m":0,"q":"Bu Pengawas Farida mendorong madrasah binaan mengembangkan inovasi pembelajaran sesuai konteks lokal masing-masing, bukan menyeragamkan pendekatan di semua madrasah. Prinsip ini mencerminkan supervisi yang bersifat...","o":["Direktif dan berpusat pada arahan pengawas untuk setiap madrasah","Seragam dan berpedoman pada standar tunggal yang ditetapkan pengawas","Kontekstual dan menghargai kearifan lokal masing-masing madrasah","Kompetitif dan berorientasi pada peringkat antarmadrasah binaan","Administratif dan berfokus pada kelengkapan dokumen madrasah"],"k":2,"p":"Supervisi kontekstual menghargai kearifan lokal dan keunikan konteks masing-masing madrasah binaan, mendorong inovasi yang relevan dengan kondisi setempat, bukan menyeragamkan pendekatan tanpa mempertimbangkan perbedaan konteks.","t":1},{"m":0,"q":"Untuk membangun sistem pelaporan hasil supervisi yang transparan dan akuntabel, pengawas perlu memastikan laporan mencakup...","o":["Perbandingan peringkat guru antarmadrasah, nilai akhir setiap guru, dan catatan khusus mengenai guru yang kurang kooperatif","Hasil wawancara dengan kepala madrasah, pendapat guru senior, dan rekomendasi yang disetujui oleh semua pihak yang terlibat","Ringkasan kegiatan, daftar hadir pertemuan, dan dokumentasi foto yang menunjukkan pelaksanaan supervisi sudah dilakukan","Data dan bukti konkret dari observasi, analisis objektif, serta rekomendasi yang dapat dipertanggungjawabkan","Penilaian umum terhadap sikap guru, kesimpulan pengawas, dan saran perbaikan yang disusun berdasarkan kesan selama kunjungan"],"k":3,"p":"Laporan supervisi yang transparan dan akuntabel memuat data dan bukti konkret dari observasi, analisis objektif, serta rekomendasi yang dapat dipertanggungjawabkan, memastikan hasil supervisi kredibel dan bermanfaat bagi pembinaan.","t":0},{"m":0,"q":"Pak Pengawas Iqbal memanfaatkan aplikasi digital untuk mendokumentasikan dan menganalisis hasil supervisi dari seluruh madrasah binaannya secara terintegrasi. Manfaat utama pendekatan ini adalah...","o":["Mengurangi kebutuhan kunjungan langsung ke madrasah karena pembinaan guru dapat dialihkan ke pesan dan pertemuan daring","Mempercepat penentuan peringkat madrasah binaan karena aplikasi menghitung nilai akhir secara otomatis dan pengawas tidak perlu menganalisis","Menghemat anggaran perjalanan dinas pengawas karena data supervisi madrasah dapat diisi sendiri oleh kepala madrasah","Memudahkan pemantauan tren dan pola perkembangan mutu pembelajaran lintas madrasah binaan, mendukung pengambilan keputusan berbasis data","Menggantikan pertemuan pasca-observasi dengan guru karena hasil supervisi dapat dikirim otomatis melalui aplikasi kepada guru"],"k":3,"p":"Digitalisasi dokumentasi dan analisis hasil supervisi memudahkan pemantauan tren dan pola perkembangan mutu pembelajaran lintas madrasah binaan, mendukung pengambilan keputusan berbasis data (data-driven decision making) yang lebih strategis dan efisien.","t":1},{"m":0,"q":"Untuk memastikan supervisi akademik berdampak pada peningkatan hasil belajar siswa (bukan hanya perbaikan administratif guru), pengawas perlu menghubungkan hasil supervisi dengan...","o":["Kelengkapan perangkat pembelajaran guru pada akhir semester untuk melihat keterkaitan antara administrasi dan keberhasilan mengajar","Data capaian belajar siswa (nilai, asesmen formatif/sumatif) untuk melihat korelasi antara perbaikan praktik mengajar dan hasil belajar","Jumlah pelatihan yang diikuti guru selama satu tahun untuk melihat kesesuaian antara peningkatan kompetensi dan sertifikat yang diperoleh","Hasil penilaian kinerja guru oleh kepala madrasah untuk melihat kesesuaian antara skor supervisi dan penilaian internal madrasah","Tingkat kehadiran guru dan murid di kelas selama satu tahun untuk melihat pengaruh disiplin terhadap hasil belajar murid"],"k":1,"p":"Supervisi yang berdampak nyata perlu dihubungkan dengan data capaian belajar siswa untuk melihat korelasi antara perbaikan praktik mengajar hasil supervisi dan peningkatan hasil belajar, memastikan supervisi bukan sekadar formalitas administratif.","t":0},{"m":0,"q":"Bu Pengawas Ratna menerapkan pendekatan supervisi yang membedakan intensitas pembinaan antara madrasah dengan kondisi baik dan madrasah yang memerlukan perhatian lebih. Prinsip ini disebut supervisi yang bersifat...","o":["Berjenjang/berbasis hierarki jabatan kepala madrasah (hierarchical supervision)","Seragam/berstandar tunggal bagi setiap madrasah binaan (uniform supervision)","Kompetitif/berbasis peringkat antarmadrasah binaan (ranking-based supervision)","Berkala/berbasis jadwal kunjungan yang tetap (periodic supervision)","Diferensiasi/berbasis kebutuhan masing-masing madrasah (differentiated supervision)"],"k":4,"p":"Supervisi diferensiasi menyesuaikan intensitas dan fokus pembinaan berdasarkan kebutuhan masing-masing madrasah, memberikan perhatian lebih intensif bagi madrasah yang memerlukan, sambil tetap memantau madrasah dengan kondisi baik secara proporsional.","t":1},{"m":0,"q":"Untuk mengembangkan kompetensi diri secara berkelanjutan sebagai pengawas, langkah yang tepat dilakukan adalah...","o":["Mengikuti pelatihan, membaca perkembangan kebijakan pendidikan terkini, dan aktif dalam forum profesi pengawas (mis. POKJAWAS)","Mengandalkan pengalaman bertahun-tahun sebagai guru dan pengawas serta mempertahankan metode pembinaan yang sudah terbukti efektif","Memusatkan waktu pada penyelesaian laporan administrasi pengawasan dan menyerahkan pengembangan diri kepada kegiatan tahunan","Mengikuti pelatihan sesuai minat pribadi di bidang lain dan menunda pembelajaran kebijakan sampai ada perubahan peraturan","Menunggu penugasan dari Kantor Kemenag untuk mengikuti pelatihan dan menjalankan program sesuai arahan yang diterima"],"k":0,"p":"Pengembangan kompetensi berkelanjutan pengawas memerlukan partisipasi aktif dalam pelatihan, pembaruan pengetahuan kebijakan pendidikan terkini, dan forum profesi seperti POKJAWAS (Kelompok Kerja Pengawas), memastikan kompetensi pengawas tetap relevan dan mutakhir.","t":0},{"m":0,"q":"Pak Pengawas Salim memberikan penghargaan/pengakuan terhadap madrasah binaan yang menunjukkan peningkatan mutu signifikan sebagai bentuk motivasi. Manfaat utama strategi ini adalah...","o":["Menekan madrasah lain agar meningkatkan mutu karena penghargaan menunjukkan standar yang harus dicapai dalam waktu singkat","Mempermudah pengawas menetapkan madrasah unggulan karena penghargaan menjadi dasar utama penilaian mutu di tingkat kabupaten","Memperkuat motivasi intrinsik madrasah untuk terus meningkatkan mutu, menciptakan iklim kompetisi yang sehat antarmadrasah binaan","Meningkatkan citra pengawas di mata Kantor Kemenag karena jumlah penghargaan menjadi ukuran utama kinerja pengawasan","Mengurangi jumlah kunjungan pembinaan pada madrasah penerima penghargaan karena mutu sudah dianggap memenuhi standar"],"k":2,"p":"Penghargaan atas peningkatan mutu memperkuat motivasi intrinsik madrasah untuk terus berkembang, menciptakan iklim kompetisi yang sehat dan konstruktif antarmadrasah binaan, mendorong semangat perbaikan berkelanjutan.","t":1},{"m":0,"q":"Untuk memastikan konsistensi standar penilaian supervisi antarpengawas dalam satu wilayah kerja, diperlukan...","o":["Penyeragaman jadwal kunjungan supervisi antarpengawas agar waktu pelaksanaan dan lama observasi di setiap madrasah sama","Kalibrasi bersama (moderasi) terhadap instrumen dan kriteria penilaian supervisi melalui forum koordinasi pengawas secara berkala","Penunjukan satu pengawas senior yang menilai ulang laporan pengawas lain dan menetapkan nilai akhir untuk setiap madrasah","Penggunaan instrumen yang disusun sendiri oleh tiap pengawas sesuai pengalaman agar penilaian sesuai dengan karakter madrasah","Pembagian wilayah kerja berdasarkan jumlah madrasah agar setiap pengawas menilai madrasah yang menjadi tanggung jawabnya"],"k":1,"p":"Konsistensi standar antarpengawas memerlukan kalibrasi bersama (moderasi) melalui forum koordinasi pengawas secara berkala, memastikan persepsi dan kriteria penilaian selaras sehingga hasil supervisi objektif di seluruh wilayah kerja.","t":0},{"m":0,"q":"Bu Pengawas Sari melibatkan kepala madrasah dan guru senior dalam merumuskan program pengawasan tahunan, bukan menyusunnya secara sepihak. Manfaat utama pendekatan partisipatif ini adalah...","o":["Meningkatkan jumlah kegiatan pengawasan karena usulan kepala madrasah dan guru senior ditambahkan ke dalam program tahunan","Mempercepat penyusunan program karena keputusan dapat diambil cepat oleh pihak yang dinilai paling memahami kondisi madrasah","Mengurangi penolakan pada awal tahun karena pihak yang dilibatkan telah menyetujui jadwal kegiatan sebelum program disahkan","Mengurangi tanggung jawab pengawas atas hasil pengawasan karena pelaksanaan program dibagi bersama kepala madrasah dan guru senior","Meningkatkan relevansi program dengan kebutuhan riil madrasah serta membangun rasa memiliki (ownership) terhadap proses pengawasan"],"k":4,"p":"Pelibatan kepala madrasah dan guru senior dalam perumusan program pengawasan meningkatkan relevansi program dengan kebutuhan riil serta membangun rasa memiliki terhadap proses pengawasan, memperkuat efektivitas implementasi program di lapangan.","t":1},{"m":0,"q":"Untuk menangani kasus guru yang menunjukkan resistensi terhadap pembinaan supervisi akademik, pendekatan yang tepat bagi pengawas adalah...","o":["Melakukan pendekatan personal untuk memahami akar resistensi, membangun kepercayaan secara bertahap, dan menyesuaikan strategi pembinaan sesuai kondisi guru","Menugaskan guru senior mengawasi guru tersebut secara terus-menerus dan melaporkan perkembangannya setiap minggu kepada pengawas","Mengubah penilaian guru menjadi lebih rendah pada aspek kolaborasi agar guru memahami konsekuensi menolak arahan pembinaan","Menyampaikan teguran tertulis kepada guru dan melaporkan perilakunya kepada kepala madrasah agar sikap tersebut tercatat dalam kinerja","Menghentikan sementara pembinaan guru tersebut dan memusatkan perhatian pada guru yang terbuka agar sumber daya pembinaan tepat sasaran"],"k":0,"p":"Resistensi guru terhadap pembinaan memerlukan pendekatan personal untuk memahami akar masalah, membangun kepercayaan secara bertahap, dan menyesuaikan strategi pembinaan, bukan pemaksaan atau sanksi yang justru dapat memperburuk hubungan dan menghambat perbaikan.","t":0},{"m":0,"q":"Pak Pengawas Rahmat mendorong madrasah binaan menerapkan penilaian berbasis portofolio sebagai pelengkap tes tertulis dalam mengukur capaian belajar siswa. Manfaat utama rekomendasi ini adalah...","o":["Meningkatkan nilai rapor murid karena portofolio memberi kesempatan memperbaiki hasil tes yang kurang baik dengan batas waktu yang longgar","Mengurangi beban penilaian guru karena portofolio disusun murid sendiri dan nilai akhir dapat ditetapkan langsung berdasarkan kumpulan karya","Memudahkan pengawas membandingkan capaian antarmadrasah karena bentuk portofolio sama dan nilainya dapat dijumlahkan dalam satu tabel","Memberikan gambaran capaian belajar siswa yang lebih holistik, mencakup proses dan perkembangan, tidak hanya hasil akhir tes tertulis","Menghemat waktu pembelajaran karena portofolio menggantikan ulangan harian dan penilaian akhir semester pada semua mata pelajaran"],"k":3,"p":"Penilaian berbasis portofolio memberikan gambaran capaian belajar yang lebih holistik, mencakup proses dan perkembangan siswa dari waktu ke waktu, melengkapi (bukan menggantikan) tes tertulis yang cenderung hanya mengukur hasil akhir.","t":1},{"m":0,"q":"Untuk memastikan program pembinaan pengawas selaras dengan kebijakan kurikulum terbaru, pengawas perlu...","o":["Mempertahankan program pembinaan yang telah berjalan karena sudah terbukti efektif, lalu menyesuaikannya jika madrasah mengajukan keberatan","Meminta kepala madrasah menafsirkan kebijakan kurikulum terbaru dan menyampaikannya kepada pengawas pada pertemuan awal semester","Secara aktif mempelajari dan memahami kebijakan kurikulum terbaru sebelum melaksanakan pembinaan ke madrasah binaan","Menyalin pedoman kurikulum dari pengawas wilayah lain yang lebih dahulu melaksanakan pembinaan agar program tersusun lebih cepat","Menunggu sosialisasi resmi dari Kantor Kemenag pada akhir tahun ajaran, lalu menyesuaikan program pembinaan berdasarkan hasil sosialisasi"],"k":2,"p":"Pengawas perlu secara aktif mempelajari dan memahami kebijakan kurikulum terbaru sebelum melaksanakan pembinaan, memastikan arahan yang diberikan kepada madrasah binaan akurat dan sesuai perkembangan kebijakan pendidikan terkini.","t":0},{"m":0,"q":"Bu Pengawas Dewi merancang supervisi akademik yang juga memperhatikan kesejahteraan psikologis guru, tidak hanya aspek teknis mengajar. Manfaat utama pendekatan holistik ini adalah...","o":["Memastikan pembinaan guru dilakukan secara komprehensif, mengingat kondisi psikologis guru turut memengaruhi kualitas pengajaran dan interaksi dengan siswa","Memudahkan pengawas menilai kinerja guru karena kondisi psikologis dapat diukur dengan skor yang sama seperti kompetensi mengajar","Memastikan pembinaan guru fokus pada kondisi emosional, karena kesejahteraan psikologis lebih menentukan mutu pembelajaran daripada kemampuan teknis mengajar","Mengurangi tekanan terhadap guru karena pengawas tidak lagi menilai kemampuan teknis mengajar, melainkan membantu guru mengatasi masalah pribadi","Menggantikan peran konselor madrasah dalam menangani masalah guru, sehingga pengawas dapat memberi layanan konseling secara langsung"],"k":0,"p":"Pendekatan supervisi holistik yang memperhatikan kesejahteraan psikologis guru memastikan pembinaan dilakukan secara komprehensif, mengingat kondisi psikologis turut memengaruhi kualitas pengajaran dan interaksi guru dengan siswa di kelas.","t":1},{"m":0,"q":"Untuk membangun budaya evaluasi diri (self-assessment) di kalangan guru madrasah binaan, pengawas dapat mendorong penerapan...","o":["Angket kepuasan murid terhadap cara mengajar guru yang diisi setiap akhir semester, sebagai dasar penentuan guru terbaik madrasah","Daftar periksa kelengkapan perangkat pembelajaran yang diperiksa pengawas setiap bulan, sebagai dasar penilaian kedisiplinan administrasi guru","Catatan observasi pengawas yang dibagikan kepada guru setelah kunjungan kelas, sebagai dasar perbaikan yang ditetapkan pengawas","Laporan penilaian kinerja guru oleh kepala madrasah yang dikumpulkan setiap semester, sebagai dasar pemberian tunjangan kinerja guru","Jurnal refleksi mengajar (teaching journal) yang diisi guru secara rutin, sebagai sarana refleksi berkelanjutan atas praktik mengajarnya sendiri"],"k":4,"p":"Jurnal refleksi mengajar yang diisi guru secara rutin membangun budaya evaluasi diri (self-assessment), mendorong refleksi berkelanjutan atas praktik mengajar sendiri, melengkapi supervisi eksternal dengan kesadaran reflektif internal guru.","t":0},{"m":0,"q":"Pak Anwar mengobservasi Bu Lina di sebuah MTs. Selama 40 menit, murid hanya mengerjakan tugas mandiri tanpa interaksi. Saat pasca-observasi, Bu Lina berkata, 'Murid saya memang sulit diajak berdiskusi.' Langkah pengawas yang paling sesuai dengan prinsip supervisi reflektif adalah...","o":["Meminta Bu Lina menilai pembelajarannya sendiri, lalu mengaitkan catatan observasi dengan penilaian itu.","Menjelaskan bahwa pernyataan itu bertentangan dengan catatan observasi, lalu memberikan skor kinerja.","Menyepakati observasi ulang pekan depan dan menunda pembahasan sampai data pengamatan lebih lengkap.","Menawarkan beberapa strategi diskusi yang berhasil di kelas lain agar Bu Lina memilih salah satunya.","Menyajikan catatan observasi lebih dulu, lalu meminta Bu Lina menanggapi temuan tersebut."],"k":0,"p":"Pasca-observasi menempatkan refleksi guru lebih dulu. Membuka dengan catatan atau skor pengawas melewati tahap itu. Menawarkan strategi mengambil proses berpikir dari guru. Menunda umpan balik tidak perlu karena data sudah cukup.","t":2},{"m":0,"q":"Pengawas membina enam guru di satu MI. Dua guru baru kesulitan menyusun modul ajar. Dua guru senior sudah mahir dan aktif berinovasi. Dua guru lain cukup baik, tetapi enggan diobservasi. Rancangan supervisi yang paling tepat adalah...","o":["Observasi kelas dengan instrumen dan jadwal yang sama untuk keenam guru agar penilaian adil.","Pendampingan khusus bagi guru baru, sedangkan guru lain mengisi refleksi mandiri tanpa pertemuan.","Workshop klasikal untuk keenam guru agar pembinaan efisien dan tidak terkesan membeda-bedakan.","Supervisi klinis bagi semua guru dengan fokus pada kelemahan yang paling sering ditemukan di MI.","Pendampingan intensif bagi guru baru, peer tutoring oleh guru senior, dan dialog awal bagi guru yang enggan."],"k":4,"p":"Prinsip diferensiasi menyesuaikan pembinaan dengan kebutuhan tiap guru. Perlakuan seragam mengabaikan perbedaan itu. Membiarkan guru yang enggan tanpa pertemuan juga keliru, karena mereka perlu dialog awal.","t":2},{"m":0,"q":"Data observasi 20 guru di empat madrasah binaan menunjukkan rata-rata skor perencanaan 82, pelaksanaan 76, penilaian 58, serta refleksi dan tindak lanjut 51. Prioritas pembinaan semester ini yang paling tepat adalah...","o":["Pendampingan penilaian dan refleksi, karena keduanya paling rendah dan saling berkaitan.","Pelatihan pelaksanaan pembelajaran, karena aspek ini berhubungan langsung dengan hasil belajar murid.","Penguatan perencanaan, karena aspek ini menjadi dasar seluruh kegiatan pembelajaran di kelas.","Observasi ulang semua aspek, karena selisih skor belum cukup untuk menentukan prioritas pembinaan.","Pembinaan di madrasah dengan skor terendah saja, agar sumber daya tidak tersebar ke semua madrasah."],"k":0,"p":"Penilaian (58) dan refleksi (51) paling rendah dan saling terkait. Perencanaan dan pelaksanaan sudah tinggi. Selisih skor sudah jelas, sehingga observasi ulang tidak perlu. Data per madrasah tidak tersedia untuk membatasi pembinaan.","t":2},{"m":1,"q":"Fokus utama supervisi manajerial yang dilakukan pengawas terhadap madrasah binaan adalah menilai efektivitas...","o":["Proses pembelajaran di kelas semata","Pengelolaan administrasi, sumber daya, dan tata kelola madrasah secara keseluruhan","Penguasaan materi ajar guru","Kemampuan pedagogik guru","Hasil belajar siswa secara individual"],"k":1,"p":"Supervisi manajerial berfokus pada penilaian efektivitas pengelolaan administrasi, sumber daya, dan tata kelola madrasah secara keseluruhan, berbeda dengan supervisi akademik yang berfokus pada proses pembelajaran di kelas.","t":0},{"m":1,"q":"Pengawas Pak Hendra melakukan telaah terhadap dokumen RKJM dan RKT madrasah binaan untuk menilai kesesuaiannya dengan hasil EDM. Manfaat utama telaah ini adalah...","o":["Hanya formalitas administratif tanpa dampak nyata","Menggantikan sepenuhnya tanggung jawab kepala madrasah dalam perencanaan","Memastikan perencanaan madrasah didasarkan pada data riil kondisi madrasah, bukan sekadar dokumen formalitas tanpa dasar analisis","Tidak relevan dengan tugas pengawasan manajerial","Hanya bermanfaat menjelang akreditasi"],"k":2,"p":"Telaah kesesuaian RKJM/RKT dengan hasil EDM memastikan perencanaan madrasah didasarkan pada data riil kondisi madrasah, bukan sekadar dokumen formalitas, sehingga program yang direncanakan benar-benar menjawab kebutuhan perbaikan yang teridentifikasi.","t":1},{"m":1,"q":"Delapan Standar Nasional Pendidikan (SNP) yang menjadi acuan utama supervisi manajerial pengawas terhadap madrasah binaan meliputi Standar Isi, Proses, Kompetensi Lulusan, PTK, Sarana Prasarana, Pengelolaan, Pembiayaan, dan...","o":["Standar Kurikulum Nasional","Standar Digitalisasi Sekolah","Standar Akreditasi Madrasah","Standar Penilaian","Standar Kepala Madrasah"],"k":3,"p":"Delapan SNP terdiri dari Standar Isi, Proses, Kompetensi Lulusan, Pendidik dan Tenaga Kependidikan (PTK), Sarana Prasarana, Pengelolaan, Pembiayaan, dan Standar Penilaian, menjadi kerangka acuan utama supervisi manajerial pengawas.","t":0},{"m":1,"q":"Bu Pengawas Yuliana mendapati pengelolaan keuangan BOS di salah satu madrasah binaan kurang transparan. Langkah supervisi manajerial yang tepat adalah...","o":["Langsung melaporkan ke pihak berwajib tanpa klarifikasi","Memberikan sanksi langsung tanpa proses pembinaan","Mengabaikan temuan karena dianggap urusan internal madrasah","Melakukan pendampingan dan pembinaan terkait tata kelola keuangan yang akuntabel, sekaligus memastikan kepatuhan terhadap regulasi penggunaan dana BOS","Menutupi temuan demi menjaga nama baik madrasah"],"k":3,"p":"Pengawas yang menemukan pengelolaan keuangan kurang transparan sebaiknya melakukan pendampingan dan pembinaan tata kelola keuangan yang akuntabel, memastikan kepatuhan regulasi, sebelum mengambil langkah lebih lanjut jika diperlukan.","t":1},{"m":1,"q":"Instrumen yang digunakan pengawas untuk menilai kelengkapan dan keakuratan administrasi kepegawaian (PTK) di madrasah binaan disebut...","o":["Instrumen supervisi akademik","Instrumen supervisi manajerial bidang PTK","Buku tamu madrasah","Rapor siswa","Daftar hadir supervisi kelas"],"k":1,"p":"Instrumen supervisi manajerial bidang PTK digunakan pengawas untuk menilai kelengkapan dan keakuratan administrasi kepegawaian, mencakup data kualifikasi, sertifikasi, dan penempatan tenaga pendidik dan kependidikan di madrasah.","t":0},{"m":1,"q":"Pak Pengawas Junaidi menemukan bahwa sarana laboratorium di madrasah binaan belum dimanfaatkan optimal meski tersedia. Rekomendasi tindak lanjut yang tepat adalah...","o":["Mengusulkan penghapusan aset laboratorium","Menunda tindak lanjut hingga tahun ajaran berikutnya","Mengabaikan temuan karena dianggap bukan prioritas","Menyalahkan kepala madrasah sepenuhnya tanpa solusi","Mendorong madrasah menyusun jadwal pemanfaatan yang terstruktur serta memberikan pelatihan bagi guru terkait pemanfaatan sarana tersebut dalam pembelajaran"],"k":4,"p":"Sarana yang belum dimanfaatkan optimal sebaiknya ditindaklanjuti dengan mendorong penyusunan jadwal pemanfaatan terstruktur serta pelatihan guru, memastikan investasi sarana benar-benar mendukung peningkatan kualitas pembelajaran.","t":1},{"m":1,"q":"Untuk menilai efektivitas kepemimpinan kepala madrasah dalam supervisi manajerial, pengawas perlu memperhatikan indikator...","o":["Ketercapaian target RKT/RKJM, efektivitas pengelolaan sumber daya, dan iklim kerja madrasah secara keseluruhan","Hanya popularitas kepala madrasah di kalangan guru","Hanya penampilan fisik ruang kepala madrasah","Jumlah rapat yang diselenggarakan","Kepatuhan administratif semata tanpa melihat dampak nyata"],"k":0,"p":"Efektivitas kepemimpinan kepala madrasah dinilai melalui ketercapaian target perencanaan (RKT/RKJM), efektivitas pengelolaan sumber daya, dan iklim kerja madrasah secara keseluruhan, bukan hanya indikator permukaan seperti popularitas atau kepatuhan administratif semata.","t":0},{"m":1,"q":"Bu Pengawas Ida memfasilitasi forum kepala madrasah lintas madrasah binaan untuk berbagi praktik baik dalam pengelolaan manajerial. Manfaat utama pendekatan ini adalah...","o":["Hanya formalitas tanpa dampak nyata","Menggantikan sepenuhnya supervisi individual pengawas","Membangun komunitas belajar antarkepala madrasah, memperkuat kapasitas manajerial kolektif melalui pertukaran pengalaman nyata","Tidak relevan dengan tugas pengawasan manajerial","Hanya bermanfaat bagi kepala madrasah baru"],"k":2,"p":"Forum berbagi praktik baik antarkepala madrasah membangun komunitas belajar (professional learning community) yang memperkuat kapasitas manajerial kolektif melalui pertukaran pengalaman nyata, memperluas dampak pembinaan pengawas melampaui supervisi individual.","t":1},{"m":1,"q":"Untuk menilai kesesuaian pengelolaan kurikulum (KOSP) madrasah binaan dengan kerangka kurikulum nasional, pengawas perlu menelaah...","o":["Hanya sampul dokumen KOSP","Kesesuaian visi-misi, struktur kurikulum, dan program pengembangan dengan karakteristik peserta didik serta kerangka kurikulum nasional yang berlaku","Jumlah halaman dokumen semata","Hanya tanda tangan pengesahan dokumen","Warna kertas yang digunakan untuk mencetak dokumen"],"k":1,"p":"Telaah KOSP mencakup kesesuaian visi-misi, struktur kurikulum, dan program pengembangan dengan karakteristik peserta didik serta kerangka kurikulum nasional, memastikan dokumen bukan sekadar formalitas administratif tanpa substansi.","t":0},{"m":1,"q":"Pak Pengawas Yusuf menerapkan pendekatan supervisi manajerial berbasis siklus PDCA (Plan-Do-Check-Act) dalam pembinaan tata kelola madrasah binaan. Manfaat utama pendekatan ini adalah...","o":["Hanya menambah kerumitan administratif","Hanya efektif untuk madrasah dengan masalah manajerial serius","Tidak relevan dengan tugas pengawasan manajerial","Menggantikan sepenuhnya evaluasi tahunan","Memastikan proses pembinaan tata kelola berkelanjutan dan sistematis, dengan evaluasi dan penyesuaian berulang untuk perbaikan mutu manajerial yang terus-menerus"],"k":4,"p":"Siklus PDCA memastikan proses pembinaan tata kelola berkelanjutan dan sistematis, dengan evaluasi dan penyesuaian berulang untuk perbaikan mutu manajerial yang terus-menerus, bukan pembinaan sesaat tanpa tindak lanjut.","t":1},{"m":1,"q":"Untuk menilai efektivitas pengelolaan hubungan madrasah dengan masyarakat (humas), pengawas dapat menelaah...","o":["Tingkat partisipasi dan kepuasan orang tua/komite terhadap program madrasah, serta efektivitas komunikasi dua arah yang dibangun","Hanya jumlah surat masuk dan keluar","Kerapian papan pengumuman madrasah semata","Jumlah followers media sosial madrasah tanpa melihat interaksi nyata","Hanya laporan tertulis tanpa verifikasi lapangan"],"k":0,"p":"Efektivitas pengelolaan humas dinilai melalui tingkat partisipasi dan kepuasan orang tua/komite terhadap program madrasah, serta efektivitas komunikasi dua arah, bukan sekadar indikator administratif atau kuantitatif semata seperti jumlah surat.","t":0},{"m":1,"q":"Bu Pengawas Rahayu mendapati pola kelemahan serupa dalam pengelolaan sarana prasarana di beberapa madrasah binaannya. Tindak lanjut paling tepat adalah...","o":["Menangani setiap madrasah secara terpisah tanpa melihat pola bersama","Hanya memberikan teguran tanpa solusi pengembangan","Mengabaikan pola karena dianggap masalah individual madrasah","Merancang program pelatihan/workshop bersama tentang manajemen aset dan sarana prasarana yang menyasar kebutuhan bersama tersebut","Menunggu inisiatif dari masing-masing madrasah secara mandiri"],"k":3,"p":"Pola kelemahan serupa di beberapa madrasah binaan sebaiknya ditindaklanjuti dengan pelatihan/workshop bersama yang menyasar kebutuhan kolektif secara efisien, dibanding penanganan kasus per kasus yang kurang efektif dari sisi sumber daya.","t":1},{"m":1,"q":"Untuk memastikan objektivitas dalam menilai kinerja manajerial kepala madrasah, pengawas perlu menggunakan...","o":["Hanya kesan pribadi tanpa instrumen","Penilaian berdasarkan reputasi kepala madrasah semata","Instrumen penilaian kinerja kepala madrasah yang terstandar, berbasis bukti dari dokumen dan observasi lapangan","Mengabaikan konteks madrasah dalam penilaian","Hanya laporan dari guru tanpa verifikasi langsung"],"k":2,"p":"Objektivitas penilaian kinerja manajerial memerlukan instrumen terstandar berbasis bukti dari dokumen dan observasi lapangan, memastikan penilaian akurat dan dapat dipertanggungjawabkan, bukan sekadar kesan atau reputasi semata.","t":0},{"m":1,"q":"Pak Pengawas Ridwan memberikan pendampingan khusus kepada kepala madrasah yang baru menjabat dalam menyusun RKJM pertamanya. Manfaat utama pendekatan ini adalah...","o":["Membekali kepala madrasah baru dengan keterampilan perencanaan strategis sejak awal masa jabatan, mempercepat efektivitas kepemimpinan","Hanya menambah beban kerja pengawas","Tidak relevan dengan tugas pengawasan manajerial","Menggantikan sepenuhnya tanggung jawab kepala madrasah","Hanya bermanfaat bagi madrasah besar"],"k":0,"p":"Pendampingan khusus bagi kepala madrasah baru dalam penyusunan RKJM pertama membekali keterampilan perencanaan strategis sejak awal masa jabatan, mempercepat efektivitas kepemimpinan dan mengurangi kesalahan pada tahap krusial transisi kepemimpinan.","t":1},{"m":1,"q":"Untuk menilai kesehatan iklim kerja dan budaya organisasi madrasah binaan, pengawas dapat menggunakan teknik...","o":["Hanya observasi fisik gedung madrasah","Membandingkan gaji guru antarmadrasah","Hanya menelaah dokumen administratif","Mengandalkan laporan kepala madrasah semata tanpa verifikasi","Wawancara dan survei kepada guru, staf, serta observasi interaksi sehari-hari di lingkungan madrasah"],"k":4,"p":"Penilaian iklim kerja dan budaya organisasi memerlukan wawancara dan survei kepada guru serta staf, dipadukan observasi interaksi sehari-hari di lingkungan madrasah, memberikan gambaran lebih akurat dibanding hanya menelaah dokumen administratif.","t":0},{"m":1,"q":"Bu Pengawas Fatimah mendorong madrasah binaan menerapkan sistem informasi manajemen digital untuk mengelola data akademik dan administrasi secara terintegrasi. Manfaat utama rekomendasi ini adalah...","o":["Hanya menambah kerumitan administrasi","Meningkatkan efisiensi, akurasi, dan transparansi pengelolaan data madrasah, memudahkan pengambilan keputusan berbasis data","Menggantikan sepenuhnya peran tenaga administrasi","Tidak relevan dengan mutu pendidikan","Hanya bermanfaat untuk madrasah besar"],"k":1,"p":"Sistem informasi manajemen digital terintegrasi meningkatkan efisiensi, akurasi, dan transparansi pengelolaan data, memudahkan kepala madrasah mengambil keputusan berbasis data, relevan direkomendasikan pengawas sebagai bagian pembinaan manajerial modern.","t":1},{"m":1,"q":"Untuk menindaklanjuti hasil supervisi manajerial secara efektif, pengawas perlu menyusun...","o":["Laporan tanpa rencana tindak lanjut konkret","Hanya menyimpan hasil supervisi sebagai arsip","Rekomendasi yang spesifik, terukur, dan realistis sesuai kondisi masing-masing madrasah, disertai jadwal monitoring implementasinya","Menyerahkan sepenuhnya tindak lanjut kepada kepala madrasah tanpa pendampingan","Rekomendasi umum yang berlaku sama untuk semua madrasah binaan"],"k":2,"p":"Tindak lanjut supervisi manajerial yang efektif memerlukan rekomendasi spesifik, terukur, dan realistis sesuai kondisi masing-masing madrasah, disertai jadwal monitoring implementasi, memastikan perbaikan yang direncanakan benar-benar terlaksana.","t":0},{"m":1,"q":"Pak Pengawas Bambang menemukan bahwa manajemen konflik internal di salah satu madrasah binaan kurang efektif, menyebabkan ketegangan antarguru berkepanjangan. Pendekatan supervisi manajerial yang tepat adalah...","o":["Mengabaikan konflik karena dianggap urusan internal","Melaporkan konflik tanpa upaya penyelesaian","Memihak salah satu pihak yang berkonflik","Membantu kepala madrasah mengembangkan keterampilan manajemen konflik dan mediasi, sekaligus memfasilitasi dialog jika diperlukan untuk meredakan ketegangan","Mengganti kepala madrasah sebagai solusi instan"],"k":3,"p":"Pengawas dapat membantu kepala madrasah mengembangkan keterampilan manajemen konflik dan mediasi, serta memfasilitasi dialog jika diperlukan, mendukung penyelesaian konflik internal secara konstruktif tanpa mengambil alih tanggung jawab kepemimpinan madrasah.","t":1},{"m":1,"q":"Untuk memastikan keberlanjutan program unggulan madrasah binaan meski terjadi pergantian kepala madrasah, pengawas perlu mendorong...","o":["Program hanya bergantung pada inisiatif kepala madrasah yang menjabat saat ini","Hanya kepala madrasah yang mengetahui detail program","Penghentian program saat terjadi pergantian kepemimpinan","Dokumentasi yang baik dan pelembagaan sistem program agar tidak bergantung sepenuhnya pada individu tertentu","Mengabaikan pentingnya dokumentasi program unggulan"],"k":3,"p":"Keberlanjutan program unggulan memerlukan dokumentasi yang baik dan pelembagaan sistem, sehingga program tidak bergantung sepenuhnya pada individu kepala madrasah tertentu dan dapat terus berjalan meski terjadi pergantian kepemimpinan.","t":0},{"m":1,"q":"Bu Pengawas Nurhayati menelaah laporan keuangan RKAM madrasah binaan untuk memastikan kesesuaian antara perencanaan dan realisasi anggaran. Manfaat utama telaah ini adalah...","o":["Hanya formalitas administratif semata","Memastikan akuntabilitas dan transparansi pengelolaan keuangan madrasah, mendeteksi potensi penyimpangan sejak dini","Menggantikan sepenuhnya peran auditor internal","Tidak relevan dengan tugas pengawasan manajerial","Hanya bermanfaat menjelang akhir tahun anggaran"],"k":1,"p":"Telaah kesesuaian perencanaan dan realisasi anggaran memastikan akuntabilitas dan transparansi pengelolaan keuangan madrasah, membantu mendeteksi potensi penyimpangan sejak dini sebagai bagian dari fungsi pengawasan manajerial.","t":1},{"m":1,"q":"Untuk membangun kapasitas kepala madrasah binaan dalam manajemen risiko, pengawas dapat memberikan pembinaan tentang...","o":["Hanya mengandalkan respons spontan tanpa perencanaan","Hanya menyiapkan dokumen tanpa simulasi praktik","Mengabaikan perencanaan risiko karena dianggap jarang terjadi","Menyerahkan seluruh tanggung jawab risiko kepada pihak eksternal","Identifikasi potensi risiko, analisis dampak, dan penyusunan langkah mitigasi serta rencana kontingensi untuk berbagai skenario"],"k":4,"p":"Pembinaan manajemen risiko mencakup identifikasi potensi risiko, analisis dampak, dan penyusunan langkah mitigasi serta rencana kontingensi, membekali kepala madrasah kesiapan menghadapi berbagai skenario yang mungkin terjadi.","t":0},{"m":1,"q":"Pak Pengawas Slamet mengintegrasikan nilai amanah dan keteladanan dalam melaksanakan tugas supervisi manajerial, memastikan proses pembinaan dilakukan dengan niat tulus membantu madrasah berkembang. Pendekatan ini mencerminkan...","o":["Nilai kepemimpinan pengawasan yang Islami, memperkuat esensi tugas pengawasan manajerial sebagai pembinaan yang suportif dan bermartabat","Formalitas administratif semata","Tidak relevan dengan prinsip pengawasan modern","Hanya relevan bagi pengawas yang religius","Menggantikan sepenuhnya standar profesional pengawasan"],"k":0,"p":"Mengintegrasikan nilai amanah dan keteladanan dalam supervisi manajerial memperkuat esensi pengawasan sebagai pembinaan yang suportif dan bermartabat, selaras dengan prinsip pengawasan modern sekaligus nilai keislaman yang relevan di lingkungan madrasah.","t":1},{"m":1,"q":"Untuk mengevaluasi efektivitas program supervisi manajerial secara keseluruhan dalam satu tahun, pengawas dapat menganalisis...","o":["Hanya jumlah kunjungan yang dilakukan","Opini pribadi pengawas semata","Perkembangan tata kelola dan capaian standar madrasah binaan dari waktu ke waktu, serta tingkat implementasi rekomendasi tindak lanjut","Perbandingan semata antarmadrasah binaan tanpa konteks","Hanya kepatuhan madrasah terhadap jadwal kunjungan"],"k":2,"p":"Evaluasi efektivitas program supervisi manajerial yang komprehensif menganalisis perkembangan tata kelola dan capaian standar dari waktu ke waktu, serta implementasi rekomendasi, bukan hanya indikator kuantitatif seperti jumlah kunjungan.","t":0},{"m":1,"q":"Bu Pengawas Marlina mendorong madrasah binaan membentuk tim penjaminan mutu internal (TPMI) untuk memperkuat budaya evaluasi diri berkelanjutan. Manfaat utama rekomendasi ini adalah...","o":["Hanya menambah struktur organisasi tanpa fungsi nyata","Membangun sistem penjaminan mutu internal yang berkelanjutan, mengurangi ketergantungan penuh pada supervisi eksternal pengawas","Menggantikan sepenuhnya fungsi pengawasan eksternal","Tidak relevan dengan tugas pengawasan manajerial","Hanya bermanfaat bagi madrasah besar dengan sumber daya melimpah"],"k":1,"p":"Tim Penjaminan Mutu Internal (TPMI) membangun sistem evaluasi diri berkelanjutan di madrasah, mengurangi ketergantungan penuh pada supervisi eksternal pengawas, memperkuat kapasitas internal madrasah dalam menjaga dan meningkatkan mutu secara mandiri.","t":1},{"m":1,"q":"Untuk memastikan konsistensi standar penilaian supervisi manajerial antarpengawas dalam satu wilayah kerja, diperlukan...","o":["Membiarkan setiap pengawas menggunakan standar masing-masing","Menyerahkan sepenuhnya pada penilaian subjektif masing-masing pengawas","Hanya satu pengawas yang menentukan standar untuk seluruh wilayah","Mengabaikan perbedaan standar karena dianggap tidak penting","Kalibrasi bersama terhadap instrumen dan kriteria penilaian supervisi manajerial melalui forum koordinasi pengawas secara berkala"],"k":4,"p":"Konsistensi standar antarpengawas memerlukan kalibrasi bersama melalui forum koordinasi pengawas secara berkala, memastikan persepsi dan kriteria penilaian selaras sehingga hasil supervisi manajerial objektif di seluruh wilayah kerja.","t":0},{"m":1,"q":"Pak Pengawas Iskandar menelaah kesesuaian struktur organisasi madrasah binaan dengan kebutuhan riil dan beban kerja yang ada. Manfaat utama telaah ini adalah...","o":["Memastikan struktur organisasi efektif dan efisien, menghindari tumpang tindih tugas atau kekosongan tanggung jawab yang dapat menghambat kinerja madrasah","Hanya formalitas administratif semata","Menggantikan sepenuhnya kewenangan kepala madrasah dalam menyusun struktur","Tidak relevan dengan tugas pengawasan manajerial","Hanya bermanfaat bagi madrasah besar dengan banyak staf"],"k":0,"p":"Telaah kesesuaian struktur organisasi dengan kebutuhan riil memastikan struktur efektif dan efisien, menghindari tumpang tindih tugas atau kekosongan tanggung jawab yang dapat menghambat kinerja madrasah secara keseluruhan.","t":1},{"m":1,"q":"Bu Pengawas Halimah memberikan rekomendasi kepada madrasah binaan untuk mendiversifikasi sumber pendanaan di luar BOS, seperti kemitraan dan unit usaha madrasah. Manfaat utama rekomendasi ini adalah...","o":["Hanya menambah beban kerja kepala madrasah","Menggantikan sepenuhnya kewajiban pemerintah dalam pendanaan pendidikan","Tidak relevan dengan tugas pengawasan manajerial","Mengurangi ketergantungan pada satu sumber dana, meningkatkan ketahanan finansial madrasah untuk mendukung program pengembangan jangka panjang","Hanya efektif untuk madrasah di perkotaan"],"k":3,"p":"Diversifikasi sumber pendanaan mengurangi ketergantungan pada satu sumber dana (BOS), meningkatkan ketahanan finansial madrasah untuk mendukung program pengembangan jangka panjang, relevan sebagai bagian pembinaan manajerial pengawas terkait keberlanjutan madrasah.","t":1},{"m":1,"q":"Untuk menilai efektivitas pengelolaan arsip dan dokumentasi madrasah binaan, pengawas perlu memperhatikan...","o":["Hanya kerapian fisik lemari arsip","Jumlah dokumen yang tersimpan tanpa melihat kualitas pengelolaannya","Sistem pengarsipan yang tertata, mudah diakses, dan mendukung akuntabilitas serta kesinambungan informasi madrasah","Hanya dokumen terbaru tanpa memperhatikan arsip historis","Warna map yang digunakan untuk menyimpan dokumen"],"k":2,"p":"Efektivitas pengelolaan arsip dinilai dari sistem pengarsipan yang tertata, mudah diakses, dan mendukung akuntabilitas serta kesinambungan informasi madrasah, bukan sekadar aspek kerapian fisik semata.","t":0},{"m":1,"q":"Pak Pengawas Wahyudi mendorong madrasah binaan menerapkan prinsip manajemen berbasis madrasah (MBM) dengan melibatkan guru, komite, dan orang tua dalam pengambilan keputusan strategis. Manfaat utama pendekatan ini adalah...","o":["Meningkatkan rasa memiliki dan dukungan kolektif terhadap kebijakan madrasah, memperkaya perspektif dalam pengambilan keputusan strategis","Hanya memperlambat proses pengambilan keputusan","Melemahkan otoritas kepala madrasah","Tidak relevan dengan tugas pengawasan manajerial","Hanya efektif untuk madrasah kecil"],"k":0,"p":"Manajemen Berbasis Madrasah (MBM) yang melibatkan berbagai pemangku kepentingan meningkatkan rasa memiliki dan dukungan kolektif terhadap kebijakan madrasah, memperkaya perspektif dalam pengambilan keputusan strategis dibanding keputusan sepihak kepala madrasah.","t":1},{"m":1,"q":"Untuk membangun sistem monitoring dan evaluasi (monev) yang efektif terhadap implementasi rekomendasi supervisi manajerial, pengawas perlu memastikan...","o":["Monev hanya dilakukan sekali tanpa tindak lanjut","Monev hanya berupa laporan tertulis tanpa verifikasi lapangan","Monev diserahkan sepenuhnya kepada madrasah tanpa keterlibatan pengawas","Mengabaikan hasil monev jika menunjukkan kemajuan yang lambat","Monev dilakukan secara berkala dengan indikator yang jelas, disertai umpan balik konstruktif bagi madrasah binaan"],"k":4,"p":"Sistem monev yang efektif memerlukan pelaksanaan berkala dengan indikator jelas, disertai umpan balik konstruktif bagi madrasah binaan, memastikan implementasi rekomendasi supervisi manajerial benar-benar berjalan dan memberikan dampak nyata.","t":0},{"m":1,"q":"Bu Pengawas Suryani menemukan bahwa salah satu madrasah binaan kesulitan mengelola data PTK karena keterbatasan kompetensi digital staf tata usaha. Tindak lanjut yang tepat adalah...","o":["Mengabaikan kesulitan tersebut karena dianggap bukan prioritas","Merekomendasikan pelatihan literasi digital bagi staf tata usaha, disertai pendampingan penggunaan sistem informasi manajemen kepegawaian","Mengambil alih pengelolaan data secara langsung","Menyalahkan staf tata usaha tanpa solusi pengembangan","Menunda penanganan hingga masalah semakin parah"],"k":1,"p":"Kesulitan pengelolaan data akibat keterbatasan kompetensi digital sebaiknya ditindaklanjuti dengan pelatihan literasi digital dan pendampingan penggunaan sistem informasi, membangun kapasitas internal madrasah dalam jangka panjang.","t":1},{"m":1,"q":"Untuk mengembangkan kompetensi diri secara berkelanjutan dalam bidang supervisi manajerial, pengawas perlu...","o":["Mengandalkan pengalaman lama tanpa pembaruan pengetahuan","Menghindari perubahan kebijakan manajemen pendidikan","Mengikuti pelatihan manajemen pendidikan terkini, membaca kebijakan terbaru, dan aktif dalam forum profesi pengawas","Hanya mengandalkan instruksi atasan tanpa inisiatif belajar mandiri","Membatasi diri pada rutinitas kerja tanpa pengembangan diri"],"k":2,"p":"Pengembangan kompetensi berkelanjutan pengawas dalam supervisi manajerial memerlukan partisipasi aktif dalam pelatihan manajemen pendidikan terkini, pembaruan pengetahuan kebijakan, dan forum profesi, memastikan kompetensi pengawas tetap relevan dan mutakhir.","t":0},{"m":1,"q":"Pak Pengawas Anwar merekomendasikan madrasah binaan untuk menyusun rencana kesinambungan operasional (business continuity plan) menghadapi situasi darurat. Manfaat utama rekomendasi ini adalah...","o":["Hanya menambah dokumen administratif tanpa manfaat praktis","Menggantikan sepenuhnya tanggung jawab pemerintah dalam penanganan bencana","Tidak relevan dengan tugas pengawasan manajerial","Memastikan madrasah siap merespons situasi darurat (bencana, wabah) dengan prosedur yang jelas, meminimalkan gangguan terhadap proses pendidikan","Hanya diperlukan bagi madrasah di daerah rawan bencana"],"k":3,"p":"Rencana kesinambungan operasional memastikan madrasah siap merespons situasi darurat dengan prosedur jelas, meminimalkan gangguan terhadap proses pendidikan, relevan sebagai bagian pembinaan manajerial pengawas terkait kesiapsiagaan madrasah.","t":1},{"m":1,"q":"Untuk menilai kesesuaian pengelolaan perpustakaan madrasah dengan standar sarana prasarana, pengawas perlu menelaah...","o":["Hanya jumlah buku yang tersedia","Warna cat dinding ruang perpustakaan","Hanya kerapian rak buku semata","Kelengkapan koleksi, sistem pengelolaan, tingkat pemanfaatan oleh siswa dan guru, serta kesesuaiannya dengan kebutuhan kurikulum","Jumlah kunjungan tanpa melihat kualitas pemanfaatan"],"k":3,"p":"Telaah pengelolaan perpustakaan mencakup kelengkapan koleksi, sistem pengelolaan, tingkat pemanfaatan oleh warga madrasah, serta kesesuaian dengan kebutuhan kurikulum, memberikan gambaran komprehensif bukan sekadar aspek kuantitatif semata.","t":0},{"m":1,"q":"Bu Pengawas Zubaidah membangun hubungan komunikasi yang terbuka dengan kepala madrasah binaan, tidak hanya bersifat evaluatif tetapi juga suportif dalam pemecahan masalah bersama. Manfaat utama pendekatan ini adalah...","o":["Hanya melemahkan objektivitas pengawas","Membangun kepercayaan dan kolaborasi yang memungkinkan kepala madrasah lebih terbuka mengomunikasikan tantangan yang dihadapi, mempercepat penyelesaian masalah","Tidak relevan dengan tujuan supervisi manajerial","Mengurangi wibawa dan otoritas pengawas","Hanya efektif dengan kepala madrasah yang sudah berpengalaman"],"k":1,"p":"Komunikasi yang terbuka dan suportif membangun kepercayaan dan kolaborasi, memungkinkan kepala madrasah lebih terbuka mengomunikasikan tantangan yang dihadapi, mempercepat penyelesaian masalah dibanding hubungan yang murni evaluatif dan berjarak.","t":1},{"m":1,"q":"Untuk memastikan program supervisi manajerial pengawas sejalan dengan kebijakan pendidikan terbaru dari Kementerian Agama, pengawas perlu...","o":["Mengandalkan pemahaman kebijakan lama tanpa pembaruan","Hanya mengandalkan sosialisasi tanpa pendalaman mandiri","Menyerahkan sepenuhnya pemahaman kebijakan kepada kepala madrasah","Mengabaikan perubahan kebijakan yang dianggap tidak signifikan","Secara aktif mempelajari regulasi dan kebijakan terbaru sebelum melaksanakan pembinaan ke madrasah binaan"],"k":4,"p":"Pengawas perlu secara aktif mempelajari regulasi dan kebijakan pendidikan terbaru sebelum melaksanakan pembinaan, memastikan arahan yang diberikan kepada madrasah binaan akurat dan sesuai perkembangan kebijakan terkini.","t":0},{"m":1,"q":"Pak Pengawas Suryadi mendorong madrasah binaan menyusun SOP (Standar Operasional Prosedur) untuk berbagai layanan administratif (mis. penerimaan siswa baru, pengurusan surat). Manfaat utama rekomendasi ini adalah...","o":["Memastikan konsistensi dan kualitas layanan administratif, memudahkan pelaksanaan tugas meski terjadi pergantian petugas","Hanya menambah dokumen tanpa manfaat praktis","Tidak relevan dengan tugas pengawasan manajerial","Menggantikan sepenuhnya kebijaksanaan petugas dalam situasi khusus","Hanya diperlukan bagi madrasah besar dengan banyak siswa"],"k":0,"p":"SOP layanan administratif memastikan konsistensi dan kualitas layanan, memudahkan pelaksanaan tugas meski terjadi pergantian petugas, relevan sebagai bagian pembinaan manajerial pengawas untuk meningkatkan profesionalisme tata kelola madrasah.","t":1},{"m":1,"q":"Untuk menilai efektivitas pengelolaan ekstrakurikuler madrasah binaan dari sisi manajerial, pengawas perlu menelaah...","o":["Hanya jumlah ekstrakurikuler yang tersedia","Hanya prestasi kompetisi yang diraih semata","Perencanaan program, alokasi sumber daya (pembina, sarana, waktu), dan dampaknya terhadap pengembangan bakat serta karakter siswa","Jumlah peserta tanpa melihat kualitas pembinaan","Popularitas ekstrakurikuler di kalangan siswa"],"k":2,"p":"Telaah pengelolaan ekstrakurikuler mencakup perencanaan program, alokasi sumber daya, dan dampaknya terhadap pengembangan bakat serta karakter siswa, memberikan gambaran manajerial yang komprehensif bukan sekadar indikator kuantitatif semata.","t":0},{"m":1,"q":"Bu Pengawas Aisyah melibatkan kepala madrasah binaan dalam merumuskan indikator keberhasilan program pembinaan sebelum pelaksanaan supervisi manajerial. Manfaat utama pendekatan partisipatif ini adalah...","o":["Hanya menambah proses birokrasi","Meningkatkan relevansi indikator dengan kondisi riil madrasah serta membangun kesepahaman bersama tentang tujuan pembinaan","Mengurangi objektivitas proses supervisi","Tidak relevan dengan efektivitas program pembinaan","Hanya efektif jika jumlah madrasah binaan sedikit"],"k":1,"p":"Pelibatan kepala madrasah dalam merumuskan indikator keberhasilan meningkatkan relevansi dengan kondisi riil madrasah serta membangun kesepahaman bersama tentang tujuan pembinaan, memperkuat komitmen implementasi program supervisi manajerial.","t":1},{"m":1,"q":"Untuk memastikan hasil supervisi manajerial dapat digunakan sebagai dasar pengembangan kebijakan di tingkat Kankemenag, pengawas perlu...","o":["Menyimpan hasil supervisi sebagai dokumen rahasia tanpa analisis lanjutan","Membatasi akses hasil supervisi hanya untuk pengawas yang bersangkutan","Menggunakan hasil supervisi hanya untuk keperluan individu madrasah semata","Mengabaikan keterkaitan hasil supervisi dengan kebijakan tingkat kabupaten","Menganalisis pola dan tren dari keseluruhan hasil supervisi madrasah binaan untuk mengidentifikasi kebutuhan pengembangan kebijakan yang lebih luas"],"k":4,"p":"Menganalisis pola dan tren dari keseluruhan hasil supervisi madrasah binaan membantu mengidentifikasi kebutuhan pengembangan kebijakan di tingkat Kankemenag secara lebih luas, menjadikan hasil supervisi individual bermanfaat bagi perencanaan strategis yang lebih besar.","t":0},{"m":1,"q":"Saat memeriksa RKAM sebuah MI, pengawas menemukan anggaran pengadaan proyektor. Hasil EDM menunjukkan literasi murid kelas rendah paling lemah, tetapi data itu tidak dipakai dalam penyusunan RKAM. Temuan ini terkait tahap PDCA dan rekomendasi pengawas yang paling tepat adalah...","o":["Check, karena IKU belum diukur, sehingga madrasah perlu menghitung keterpenuhan 8 SNP terlebih dahulu.","Plan, karena prioritas anggaran belum bersumber dari data EDM, sehingga RKAM perlu disusun ulang berbasis data.","Act, karena kesenjangan sudah teridentifikasi, sehingga pengawas segera menguatkan sistem melalui rekomendasi.","Do, karena pelaksanaan belum mengikuti rencana, sehingga kepala madrasah perlu memantau penggunaan anggaran.","Plan, karena RKJM belum disusun, sehingga madrasah perlu menetapkan visi dan misi baru lebih dahulu."],"k":1,"p":"Prioritas anggaran harus bersumber dari data EDM pada tahap Plan. Do, Check, dan Act salah tahap. Pilihan Plan karena RKJM belum disusun benar tahapnya, tetapi alasannya tidak sesuai temuan.","t":2},{"m":1,"q":"Kepala MTs menyatakan TPMI sudah aktif karena SK telah terbit dan rapat digelar tiap sem
