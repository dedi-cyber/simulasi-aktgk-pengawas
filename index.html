ester. Namun TPMI tidak memakai data mutu untuk memutuskan program, dan laporan penggunaan BOS tidak diumumkan. Penilaian pengawas yang paling tepat adalah...","o":["TPMI perlu dibubarkan dan diganti tim baru, karena hasil kerjanya belum tampak pada keputusan program.","TPMI baru bersifat formal, karena belum berbasis data mutu dan transparansi BOS belum terpenuhi.","TPMI sudah memadai, hanya pengumuman laporan BOS yang perlu diperbaiki agar akuntabilitas terpenuhi.","Masalah utama ada pada partisipasi masyarakat, sehingga komite madrasah perlu mengambil alih fungsi TPMI.","TPMI sudah berfungsi baik, karena struktur dan rapat rutin memenuhi prinsip akuntabilitas."],"k":1,"p":"TPMI yang berfungsi memakai data mutu untuk keputusan program, dan MBM menuntut transparansi. Struktur dan rapat saja belum cukup. Membubarkan TPMI berlebihan. Mengalihkan fungsi ke komite menggeser peran TPMI. Memperbaiki laporan BOS saja mengabaikan penggunaan data mutu.","t":2},{"m":1,"q":"Pengawas telah menghimpun capaian IKU dan keterpenuhan 8 SNP di lima MTs binaan. Standar sarana prasarana hanya terpenuhi 54 persen di empat madrasah. Langkah pengawas berikutnya yang paling tepat dalam siklus PDCA adalah...","o":["Memantau penggunaan dana BOS di keempat madrasah untuk memastikan program sarpras berjalan.","Menunggu evaluasi akhir tahun sebelum memberi rekomendasi, agar data mencakup satu siklus penuh.","Mengukur ulang keterpenuhan standar sarpras agar data yang dipakai benar-benar valid dan mutakhir.","Menyusun rekomendasi perbaikan sarpras dan memperkuat sistem pengelolaannya di keempat madrasah.","Menyusun RKAM baru bersama kepala madrasah dengan menetapkan prioritas anggaran sarpras tahun depan."],"k":3,"p":"Setelah Check, tahap berikutnya Act, yaitu rekomendasi dan penguatan sistem. Memantau BOS termasuk Do. Menyusun RKAM baru termasuk Plan siklus berikutnya. Mengukur ulang mengulang Check. Menunggu akhir tahun menunda tanpa alasan.","t":2},{"m":2,"q":"Kegiatan sistematis mengumpulkan, menganalisis, dan menafsirkan data untuk menentukan tingkat pencapaian tujuan pendidikan disebut...","o":["Evaluasi pendidikan","Supervisi","Akreditasi semata","Sertifikasi","Pengawasan administratif"],"k":0,"p":"Evaluasi pendidikan adalah kegiatan sistematis mengumpulkan, menganalisis, dan menafsirkan data untuk menentukan tingkat pencapaian tujuan pendidikan, menjadi dasar pengambilan keputusan perbaikan dan pengembangan program.","t":0},{"m":2,"q":"Pengawas Pak Hakim merancang instrumen evaluasi program madrasah binaan yang mencakup aspek konteks, input, proses, dan produk (CIPP). Manfaat utama model evaluasi ini adalah...","o":["Hanya menambah kerumitan evaluasi","Tidak relevan dengan tugas pengawasan","Menggantikan sepenuhnya evaluasi diri madrasah (EDM)","Memberikan gambaran evaluasi yang komprehensif mencakup seluruh tahapan program, dari perencanaan hingga hasil akhir, sehingga rekomendasi lebih tepat sasaran","Hanya efektif untuk program jangka pendek"],"k":3,"p":"Model evaluasi CIPP (Context, Input, Process, Product) memberikan gambaran komprehensif mencakup seluruh tahapan program, dari perencanaan hingga hasil akhir, sehingga rekomendasi yang dihasilkan lebih tepat sasaran dan menyeluruh.","t":1},{"m":2,"q":"Evaluasi yang dilakukan selama program berlangsung untuk memberikan umpan balik perbaikan sebelum program selesai disebut evaluasi...","o":["Sumatif","Diagnostik akhir","Formatif","Ex-post facto","Terminal"],"k":2,"p":"Evaluasi formatif dilakukan selama program berlangsung untuk memberikan umpan balik perbaikan sebelum program selesai, berbeda dengan evaluasi sumatif yang dilakukan di akhir program untuk menilai keseluruhan hasil.","t":0},{"m":2,"q":"Bu Pengawas Indrawati menganalisis hasil Asesmen Nasional (AN) dari seluruh madrasah binaannya untuk mengidentifikasi pola capaian literasi-numerasi secara kolektif. Manfaat utama pendekatan berbasis data agregat ini adalah...","o":["Mengidentifikasi kebutuhan pengembangan program pembinaan secara sistemik di tingkat wilayah kerja, bukan hanya kasus per madrasah","Hanya menambah beban administratif pengawas","Tidak relevan dengan tugas evaluasi pendidikan pengawas","Menggantikan sepenuhnya evaluasi individual tiap madrasah","Hanya bermanfaat bagi madrasah dengan capaian tinggi"],"k":0,"p":"Analisis data agregat hasil AN dari seluruh madrasah binaan mengidentifikasi kebutuhan pengembangan program pembinaan secara sistemik di tingkat wilayah kerja, memberikan gambaran pola yang lebih luas dibanding evaluasi kasus per madrasah semata.","t":1},{"m":2,"q":"Instrumen evaluasi yang digunakan untuk menilai kelayakan madrasah berdasarkan delapan Standar Nasional Pendidikan secara menyeluruh disebut instrumen...","o":["Supervisi akademik","Uji kompetensi siswa","Evaluasi kinerja individu guru","Sertifikasi pendidik","Akreditasi"],"k":4,"p":"Instrumen akreditasi digunakan untuk menilai kelayakan madrasah berdasarkan delapan Standar Nasional Pendidikan secara menyeluruh, menjadi salah satu bentuk evaluasi eksternal yang komprehensif terhadap mutu satuan pendidikan.","t":0},{"m":2,"q":"Pak Pengawas Basuki menemukan bahwa evaluasi pembelajaran di salah satu madrasah binaan masih didominasi tes tertulis tanpa variasi teknik penilaian lain. Rekomendasi yang tepat adalah...","o":["Membiarkan kondisi tersebut karena dianggap sudah cukup","Mendorong guru menerapkan variasi teknik penilaian (portofolio, praktik, proyek) sesuai karakteristik kompetensi yang diukur, disertai pelatihan pendukung","Melarang penggunaan tes tertulis sepenuhnya","Menyeragamkan teknik penilaian tanpa mempertimbangkan karakteristik mata pelajaran","Mengabaikan temuan karena bukan wewenang pengawas"],"k":1,"p":"Dominasi tes tertulis tanpa variasi sebaiknya ditindaklanjuti dengan mendorong penerapan variasi teknik penilaian sesuai karakteristik kompetensi yang diukur, disertai pelatihan pendukung agar guru mampu menerapkannya secara tepat.","t":1},{"m":2,"q":"Untuk menjamin validitas hasil evaluasi program madrasah, pengawas perlu memastikan instrumen yang digunakan...","o":["Hanya berdasarkan opini pribadi pengawas","Disusun tanpa mempertimbangkan tujuan evaluasi","Benar-benar mengukur apa yang seharusnya diukur, disertai kejelasan indikator dan kriteria penilaian","Menggunakan bahasa yang rumit agar terlihat ilmiah","Diadopsi langsung tanpa penyesuaian konteks"],"k":2,"p":"Validitas instrumen evaluasi memastikan instrumen benar-benar mengukur apa yang seharusnya diukur (validitas konstruk/isi), disertai kejelasan indikator dan kriteria penilaian, menjadi syarat penting agar hasil evaluasi dapat dipercaya.","t":0},{"m":2,"q":"Bu Pengawas Rosita melibatkan guru, kepala madrasah, dan komite dalam proses evaluasi program madrasah, bukan melakukannya secara sepihak. Manfaat utama pendekatan partisipatif ini adalah...","o":["Hanya memperlambat proses evaluasi","Tidak relevan dengan tujuan evaluasi pendidikan","Mengurangi objektivitas hasil evaluasi","Memperoleh perspektif yang lebih komprehensif serta meningkatkan penerimaan terhadap hasil evaluasi dan rekomendasi yang dihasilkan","Hanya efektif untuk madrasah kecil"],"k":3,"p":"Evaluasi partisipatif yang melibatkan berbagai pemangku kepentingan memperoleh perspektif lebih komprehensif serta meningkatkan penerimaan terhadap hasil dan rekomendasi, memperkuat kemungkinan tindak lanjut benar-benar dilaksanakan.","t":1},{"m":2,"q":"Evaluasi yang dilakukan pada akhir suatu program untuk menilai keseluruhan pencapaian dan menentukan keberhasilan program disebut evaluasi...","o":["Formatif","Proses semata","Diagnostik awal","Sumatif","Harian"],"k":3,"p":"Evaluasi sumatif dilakukan pada akhir suatu program untuk menilai keseluruhan pencapaian dan menentukan keberhasilan program secara menyeluruh, berbeda dengan evaluasi formatif yang dilakukan selama proses berlangsung.","t":0},{"m":2,"q":"Pak Pengawas Darmawan menyusun laporan evaluasi yang tidak hanya berisi skor/angka, tetapi juga narasi analitis tentang faktor penyebab dan rekomendasi kontekstual. Manfaat utama pendekatan ini adalah...","o":["Hanya menambah panjang laporan tanpa nilai tambah","Memberikan pemahaman yang lebih mendalam tentang akar masalah, sehingga rekomendasi yang diberikan lebih tepat sasaran dan actionable","Mengurangi objektivitas laporan karena bersifat naratif","Tidak relevan dengan tujuan pelaporan evaluasi","Hanya diperlukan untuk madrasah dengan capaian rendah"],"k":1,"p":"Laporan evaluasi yang disertai narasi analitis tentang faktor penyebab memberikan pemahaman lebih mendalam tentang akar masalah, menghasilkan rekomendasi yang lebih tepat sasaran dan dapat ditindaklanjuti (actionable) dibanding sekadar angka/skor.","t":1},{"m":2,"q":"Untuk menilai efektivitas kebijakan pendidikan yang diterapkan di tingkat wilayah kerjanya, pengawas dapat menggunakan pendekatan evaluasi...","o":["Hanya opini subjektif tanpa data pendukung","Menilai kebijakan berdasarkan popularitasnya semata","Mengabaikan dampak kebijakan terhadap madrasah","Hanya membandingkan dengan wilayah lain tanpa konteks","Berbasis bukti (evidence-based evaluation) yang menganalisis dampak kebijakan terhadap indikator mutu pendidikan secara objektif"],"k":4,"p":"Evaluasi berbasis bukti (evidence-based evaluation) menganalisis dampak kebijakan terhadap indikator mutu pendidikan secara objektif, memberikan dasar yang kredibel untuk menilai efektivitas kebijakan yang diterapkan di wilayah kerja.","t":0},{"m":2,"q":"Bu Pengawas Nabila menerapkan prinsip evaluasi yang berkelanjutan (bukan sekadar evaluasi tahunan sesaat) terhadap program madrasah binaan. Manfaat utama pendekatan ini adalah...","o":["Memungkinkan deteksi dini permasalahan dan penyesuaian program secara responsif, tidak menunggu hingga akhir periode untuk melakukan perbaikan","Hanya menambah beban kerja tanpa manfaat tambahan","Tidak relevan dengan prinsip evaluasi modern","Mengurangi fokus pada evaluasi akhir yang lebih penting","Hanya efektif untuk program berskala besar"],"k":0,"p":"Evaluasi berkelanjutan memungkinkan deteksi dini permasalahan dan penyesuaian program secara responsif, tidak menunggu hingga akhir periode untuk melakukan perbaikan, meningkatkan efektivitas program secara keseluruhan.","t":1},{"m":2,"q":"Untuk menjamin reliabilitas instrumen evaluasi yang digunakan berulang kali di berbagai madrasah binaan, pengawas perlu memastikan instrumen...","o":["Disusun secara acak tanpa uji coba","Selalu menghasilkan skor tinggi agar madrasah senang","Menghasilkan hasil yang konsisten meski digunakan oleh evaluator atau pada waktu yang berbeda","Hanya digunakan sekali tanpa perlu konsistensi","Berbeda-beda setiap kali digunakan agar tidak monoton"],"k":2,"p":"Reliabilitas instrumen evaluasi menjamin instrumen menghasilkan hasil yang konsisten meski digunakan oleh evaluator berbeda atau pada waktu berbeda, penting agar hasil evaluasi dapat dipercaya dan dibandingkan secara adil antarmadrasah.","t":0},{"m":2,"q":"Pak Pengawas Firmansyah menggunakan hasil evaluasi sebagai dasar memberikan penghargaan sekaligus pendampingan intensif, bukan sekadar sanksi bagi madrasah dengan capaian rendah. Pendekatan ini mencerminkan prinsip evaluasi yang...","o":["Punitif semata","Konstruktif, berorientasi pada perbaikan dan pengembangan, bukan sekadar penghakiman","Menghukum tanpa solusi","Hanya fokus pada capaian tinggi","Mengabaikan madrasah dengan capaian rendah"],"k":1,"p":"Pendekatan evaluasi yang konstruktif berorientasi pada perbaikan dan pengembangan, memberikan penghargaan bagi capaian baik sekaligus pendampingan intensif bagi yang memerlukan, bukan sekadar penghakiman atau sanksi semata.","t":1},{"m":2,"q":"Untuk mengevaluasi dampak program pengembangan profesional guru (PKB) terhadap kualitas pembelajaran, pengawas perlu menganalisis keterkaitan antara...","o":["Hanya jumlah guru yang mengikuti pelatihan","Lokasi penyelenggaraan pelatihan","Biaya pelatihan yang dikeluarkan semata","Popularitas pelatihan di kalangan guru","Partisipasi guru dalam PKB dengan perubahan nyata dalam praktik mengajar dan capaian belajar siswa"],"k":4,"p":"Evaluasi dampak PKB perlu menganalisis keterkaitan antara partisipasi guru dengan perubahan nyata dalam praktik mengajar dan capaian belajar siswa, memastikan program benar-benar berdampak bukan sekadar terlaksana secara administratif.","t":0},{"m":2,"q":"Bu Pengawas Kartini merancang evaluasi program yang melibatkan triangulasi sumber data (dokumen, observasi, wawancara) untuk meningkatkan kredibilitas hasil. Manfaat utama triangulasi ini adalah...","o":["Memverifikasi temuan dari berbagai sumber untuk mengurangi bias dan meningkatkan keakuratan kesimpulan evaluasi","Hanya menambah waktu pelaksanaan evaluasi","Tidak relevan dengan kualitas hasil evaluasi","Menggantikan sepenuhnya kebutuhan instrumen terstandar","Hanya diperlukan untuk evaluasi berskala besar"],"k":0,"p":"Triangulasi sumber data memverifikasi temuan dari berbagai sudut (dokumen, observasi, wawancara), mengurangi bias satu sumber data tunggal, dan meningkatkan keakuratan serta kredibilitas kesimpulan evaluasi secara keseluruhan.","t":1},{"m":2,"q":"Untuk memastikan hasil evaluasi program dapat ditindaklanjuti secara efektif oleh madrasah binaan, pengawas perlu menyusun rekomendasi yang...","o":["Bersifat umum dan berlaku sama untuk semua madrasah","Terlalu ideal tanpa mempertimbangkan keterbatasan sumber daya madrasah","Hanya berupa kritik tanpa solusi","Spesifik, realistis sesuai konteks madrasah, dan disertai langkah konkret yang dapat diimplementasikan","Disampaikan tanpa diskusi dengan pihak madrasah"],"k":3,"p":"Rekomendasi hasil evaluasi yang efektif bersifat spesifik, realistis sesuai konteks dan keterbatasan masing-masing madrasah, disertai langkah konkret yang dapat diimplementasikan, bukan sekadar kritik umum atau rekomendasi ideal tanpa mempertimbangkan kondisi riil.","t":0},{"m":2,"q":"Pak Pengawas Iwan menggunakan data hasil evaluasi dari beberapa tahun untuk menganalisis tren perkembangan mutu madrasah binaan (bukan hanya snapshot satu tahun). Manfaat utama pendekatan longitudinal ini adalah...","o":["Hanya menambah kompleksitas analisis","Tidak relevan dengan tujuan evaluasi","Memberikan gambaran perkembangan yang lebih akurat, membedakan tren jangka panjang dari fluktuasi sesaat","Menggantikan sepenuhnya kebutuhan evaluasi tahunan","Hanya bermanfaat untuk madrasah dengan data lengkap"],"k":2,"p":"Analisis data longitudinal (beberapa tahun) memberikan gambaran perkembangan yang lebih akurat, membedakan tren jangka panjang dari fluktuasi sesaat yang mungkin dipengaruhi faktor temporer, meningkatkan kualitas interpretasi hasil evaluasi.","t":1},{"m":2,"q":"Untuk menjaga objektivitas dan menghindari konflik kepentingan dalam evaluasi program madrasah binaan, pengawas perlu...","o":["Menerapkan prosedur evaluasi yang transparan dan berbasis bukti, serta menghindari keberpihakan yang tidak berdasar data","Melibatkan pihak yang memiliki kepentingan langsung terhadap hasil evaluasi","Mengabaikan aspek etika dalam pelaksanaan evaluasi","Memberikan penilaian berdasarkan kedekatan personal dengan kepala madrasah","Menghindari seluruh dokumentasi proses evaluasi"],"k":0,"p":"Menjaga objektivitas memerlukan prosedur evaluasi yang transparan dan berbasis bukti, menghindari keberpihakan yang tidak berdasar data, memastikan integritas proses evaluasi tetap terjaga sesuai kode etik pengawas.","t":0},{"m":2,"q":"Bu Pengawas Hasnah mengevaluasi efektivitas program literasi madrasah dengan membandingkan data awal (baseline) dan data setelah program berjalan (endline). Pendekatan ini disebut evaluasi berbasis...","o":["Opini subjektif","Observasi sesaat tanpa data historis","Studi kasus tunggal tanpa pembanding","Wawancara semata","Perbandingan sebelum-sesudah (before-after comparison)"],"k":4,"p":"Evaluasi berbasis perbandingan sebelum-sesudah (before-after comparison) menggunakan data baseline dan endline untuk menilai perubahan yang terjadi akibat program, memberikan bukti lebih kuat tentang dampak program dibanding hanya melihat kondisi akhir semata.","t":1},{"m":2,"q":"Untuk memastikan evaluasi program pendidikan inklusif berjalan efektif, pengawas perlu menilai...","o":["Hanya jumlah siswa berkebutuhan khusus yang terdaftar","Kesesuaian layanan, aksesibilitas, dan dukungan yang diberikan terhadap kebutuhan belajar siswa berkebutuhan khusus secara nyata","Hanya keberadaan dokumen kebijakan inklusif tanpa implementasi","Popularitas program inklusif di kalangan masyarakat","Jumlah guru pendamping khusus tanpa menilai kualitas pendampingan"],"k":1,"p":"Evaluasi program pendidikan inklusif menilai kesesuaian layanan, aksesibilitas, dan dukungan nyata terhadap kebutuhan belajar siswa berkebutuhan khusus, bukan sekadar indikator administratif seperti jumlah siswa terdaftar atau dokumen kebijakan semata.","t":0},{"m":2,"q":"Pak Pengawas Ghazali mengintegrasikan nilai kejujuran dan objektivitas dalam melaksanakan evaluasi, memastikan hasil evaluasi mencerminkan kondisi riil tanpa manipulasi data. Pendekatan ini mencerminkan...","o":["Formalitas administratif semata","Tidak relevan dengan prinsip evaluasi modern","Integritas profesional yang penting dalam evaluasi pendidikan, memastikan hasil evaluasi dapat dipercaya dan digunakan sebagai dasar perbaikan yang tepat","Hanya relevan bagi pengawas yang religius","Menghambat kelancaran proses evaluasi"],"k":2,"p":"Integritas profesional (kejujuran dan objektivitas) sangat penting dalam evaluasi pendidikan, memastikan hasil evaluasi mencerminkan kondisi riil dan dapat dipercaya sebagai dasar perbaikan yang tepat, bukan data yang dimanipulasi demi citra semata.","t":1},{"m":2,"q":"Untuk mengevaluasi efektivitas sistem penilaian (asesmen) yang diterapkan madrasah binaan, pengawas perlu menelaah kesesuaian antara...","o":["Hanya jumlah soal ujian yang dibuat","Kecepatan guru mengoreksi hasil ujian","Kerapian format dokumen penilaian semata","Teknik penilaian, tujuan pembelajaran, dan karakteristik kompetensi yang hendak diukur (kognitif, afektif, psikomotorik)","Warna kertas soal ujian yang digunakan"],"k":3,"p":"Telaah efektivitas sistem penilaian mencakup kesesuaian teknik penilaian, tujuan pembelajaran, dan karakteristik kompetensi yang diukur, memastikan asesmen benar-benar mengukur capaian yang dimaksud, bukan sekadar aspek administratif formal.","t":0},{"m":2,"q":"Bu Pengawas Salamah menggunakan hasil evaluasi sebagai bahan diskusi reflektif bersama kepala madrasah dan guru, bukan sekadar menyampaikan hasil secara sepihak. Manfaat utama pendekatan dialogis ini adalah...","o":["Hanya memperlambat proses tindak lanjut","Tidak relevan dengan tujuan evaluasi pendidikan","Mengurangi objektivitas hasil evaluasi","Membangun pemahaman bersama tentang makna hasil evaluasi dan merumuskan solusi secara kolaboratif, meningkatkan komitmen implementasi perbaikan","Hanya efektif dengan kepala madrasah yang sudah berpengalaman"],"k":3,"p":"Pendekatan dialogis dalam membahas hasil evaluasi membangun pemahaman bersama tentang makna hasil dan merumuskan solusi secara kolaboratif, meningkatkan komitmen pihak madrasah dalam mengimplementasikan perbaikan yang direkomendasikan.","t":1},{"m":2,"q":"Untuk menilai kualitas soal ujian yang disusun guru madrasah binaan, pengawas dapat menelaah aspek...","o":["Hanya jumlah soal yang dibuat","Kesesuaian dengan kisi-kisi, tingkat kesulitan yang proporsional, serta kejelasan rumusan soal dan kunci jawaban","Kerapian pengetikan semata","Warna kertas ujian","Kecepatan waktu pembuatan soal oleh guru"],"k":1,"p":"Telaah kualitas soal ujian mencakup kesesuaian dengan kisi-kisi, tingkat kesulitan yang proporsional, serta kejelasan rumusan soal dan kunci jawaban, memastikan soal benar-benar valid mengukur kompetensi yang dimaksud.","t":0},{"m":2,"q":"Pak Pengawas Yudhistira merancang evaluasi program dengan melibatkan indikator kuantitatif (skor, angka) dan kualitatif (narasi, observasi) secara seimbang. Manfaat utama pendekatan mixed-method ini adalah...","o":["Hanya menambah kompleksitas tanpa manfaat tambahan","Hanya efektif untuk evaluasi berskala besar","Mengurangi objektivitas evaluasi","Tidak relevan dengan tujuan evaluasi pendidikan","Memberikan gambaran yang lebih holistik dan mendalam, menggabungkan kekuatan data terukur dengan konteks dan nuansa yang tidak tertangkap angka semata"],"k":4,"p":"Pendekatan mixed-method (kuantitatif-kualitatif) memberikan gambaran lebih holistik dan mendalam, menggabungkan kekuatan data terukur dengan konteks dan nuansa yang tidak tertangkap angka semata, menghasilkan evaluasi yang lebih kaya dan bermakna.","t":1},{"m":2,"q":"Untuk mengevaluasi efektivitas kepemimpinan pembelajaran (instructional leadership) kepala madrasah, pengawas perlu menilai...","o":["Keterlibatan aktif kepala madrasah dalam memantau, membina, dan meningkatkan kualitas proses belajar-mengajar secara langsung","Hanya kehadiran kepala madrasah di sekolah","Kerapian penampilan kepala madrasah","Popularitas kepala madrasah di kalangan siswa","Jumlah rapat yang dipimpin kepala madrasah"],"k":0,"p":"Evaluasi kepemimpinan pembelajaran menilai keterlibatan aktif kepala madrasah dalam memantau dan membina kualitas proses belajar-mengajar secara langsung, bukan sekadar indikator administratif atau permukaan seperti kehadiran semata.","t":0},{"m":2,"q":"Bu Pengawas Wulandari menerapkan prinsip evaluasi yang adil (fairness), memastikan seluruh madrasah binaan dinilai dengan standar dan kesempatan yang setara. Prinsip ini penting karena...","o":["Hanya untuk formalitas administratif","Tidak berpengaruh terhadap kualitas hasil evaluasi","Menjamin kredibilitas hasil evaluasi dan mencegah kesenjangan perlakuan yang dapat merugikan madrasah tertentu","Mengurangi fleksibilitas pengawas dalam menilai konteks unik madrasah","Hanya relevan untuk evaluasi berskala nasional"],"k":2,"p":"Prinsip keadilan (fairness) dalam evaluasi menjamin kredibilitas hasil dan mencegah kesenjangan perlakuan yang dapat merugikan madrasah tertentu, memastikan seluruh madrasah binaan dinilai dengan standar dan kesempatan yang setara.","t":1},{"m":2,"q":"Untuk memastikan evaluasi program madrasah binaan berdampak pada perbaikan berkelanjutan (bukan hanya laporan formalitas), pengawas perlu memastikan adanya...","o":["Laporan evaluasi yang disimpan sebagai arsip semata","Siklus tindak lanjut yang jelas, mencakup rencana aksi, implementasi, dan evaluasi ulang untuk memastikan perbaikan benar-benar terjadi","Evaluasi yang dilakukan hanya sekali tanpa pengulangan","Rekomendasi yang tidak perlu dipantau implementasinya","Hasil evaluasi yang hanya disampaikan secara lisan tanpa dokumentasi"],"k":1,"p":"Dampak berkelanjutan dari evaluasi memerlukan siklus tindak lanjut yang jelas — rencana aksi, implementasi, dan evaluasi ulang — memastikan perbaikan benar-benar terjadi, bukan sekadar laporan yang berhenti sebagai dokumen formalitas.","t":0},{"m":2,"q":"Pak Pengawas Rasyid menggunakan hasil evaluasi kinerja guru sebagai salah satu data pendukung Pengelolaan Kinerja Guru (PMM), diintegrasikan dengan hasil supervisi akademik. Manfaat utama integrasi ini adalah...","o":["Hanya menambah beban administratif","Hanya bermanfaat bagi guru senior","Tidak relevan dengan tugas evaluasi pendidikan pengawas","Menggantikan sepenuhnya peran kepala madrasah dalam penilaian kinerja","Memberikan gambaran kinerja guru yang lebih komprehensif dan konsisten, menghindari duplikasi penilaian yang tidak sinkron antarsistem"],"k":4,"p":"Integrasi hasil evaluasi dengan sistem PMM memberikan gambaran kinerja guru yang lebih komprehensif dan konsisten, menghindari duplikasi atau ketidaksinkronan antara berbagai sistem penilaian yang ada.","t":1},{"m":2,"q":"Untuk mengembangkan kompetensi diri dalam bidang evaluasi pendidikan secara berkelanjutan, pengawas perlu...","o":["Mempelajari perkembangan metodologi evaluasi terkini, mengikuti pelatihan, dan aktif dalam forum profesi pengawas","Mengandalkan pengetahuan lama tanpa pembaruan","Menghindari metode evaluasi baru karena dianggap merepotkan","Hanya mengandalkan template evaluasi yang sudah ada tanpa penyesuaian","Membatasi diri pada evaluasi administratif semata"],"k":0,"p":"Pengembangan kompetensi berkelanjutan dalam evaluasi pendidikan memerlukan pembelajaran metodologi evaluasi terkini, partisipasi pelatihan, dan forum profesi, memastikan kompetensi evaluasi pengawas tetap relevan dan mutakhir.","t":0},{"m":2,"q":"Bu Pengawas Zahra merancang instrumen evaluasi yang mempertimbangkan konteks unik masing-masing madrasah binaan (mis. madrasah di daerah terpencil vs perkotaan), bukan instrumen yang seragam mutlak. Manfaat utama pendekatan kontekstual ini adalah...","o":["Hanya menambah kerumitan penyusunan instrumen","Tidak relevan dengan prinsip evaluasi yang objektif","Mengurangi standar mutu yang harus dicapai semua madrasah","Menghasilkan evaluasi yang lebih adil dan relevan, mempertimbangkan tantangan dan sumber daya berbeda yang dihadapi masing-masing madrasah","Hanya efektif untuk madrasah di daerah terpencil"],"k":3,"p":"Evaluasi kontekstual yang mempertimbangkan perbedaan kondisi madrasah menghasilkan penilaian yang lebih adil dan relevan, mengakui tantangan dan sumber daya berbeda tanpa mengorbankan standar mutu yang tetap menjadi acuan bersama.","t":1},{"m":2,"q":"Untuk memastikan hasil evaluasi pendidikan dapat dipahami dan dimanfaatkan oleh berbagai pemangku kepentingan (guru, kepala madrasah, komite), pengawas perlu menyajikan laporan dalam bentuk...","o":["Hanya angka statistik tanpa penjelasan","Istilah teknis yang kompleks tanpa penyederhanaan","Bahasa yang jelas dan mudah dipahami, disertai visualisasi data sederhana dan rekomendasi praktis yang actionable","Laporan yang sangat panjang tanpa ringkasan eksekutif","Hanya disampaikan secara lisan tanpa dokumen tertulis"],"k":2,"p":"Laporan evaluasi yang efektif disajikan dalam bahasa jelas dan mudah dipahami, disertai visualisasi data sederhana dan rekomendasi praktis, memastikan seluruh pemangku kepentingan (bukan hanya kalangan teknis) dapat memahami dan memanfaatkan hasil evaluasi.","t":0},{"m":2,"q":"Evaluasi yang dilakukan sebelum program dimulai untuk mengidentifikasi kebutuhan dan kondisi awal disebut evaluasi...","o":["Diagnostik/kebutuhan (needs assessment)","Sumatif","Formatif pertengahan","Terminal","Ex-post"],"k":0,"p":"Evaluasi diagnostik/kebutuhan (needs assessment) dilakukan sebelum program dimulai untuk mengidentifikasi kebutuhan dan kondisi awal, menjadi dasar perancangan program yang tepat sasaran sesuai kondisi riil yang dihadapi.","t":0},{"m":2,"q":"Pak Pengawas Hamid menggunakan hasil evaluasi untuk memetakan madrasah binaan ke dalam kategori (mis. mandiri, berkembang, rintisan) guna menyesuaikan strategi pembinaan. Manfaat utama pendekatan pemetaan ini adalah...","o":["Hanya melabeli madrasah tanpa manfaat praktis","Hanya bermanfaat bagi madrasah kategori mandiri","Menciptakan diskriminasi antarmadrasah binaan","Tidak relevan dengan tujuan evaluasi pendidikan","Memungkinkan strategi pembinaan yang lebih tepat sasaran dan proporsional sesuai tingkat kebutuhan masing-masing kategori madrasah"],"k":4,"p":"Pemetaan madrasah berdasarkan hasil evaluasi memungkinkan strategi pembinaan yang lebih tepat sasaran dan proporsional, memberikan perhatian sesuai tingkat kebutuhan masing-masing kategori, bukan pendekatan seragam yang kurang efisien.","t":1},{"m":2,"q":"Untuk menilai keakuratan data yang dilaporkan madrasah binaan dalam sistem informasi (EMIS), pengawas perlu melakukan...","o":["Hanya menerima data tanpa verifikasi","Verifikasi silang data yang dilaporkan dengan kondisi riil di lapangan melalui kunjungan dan observasi langsung","Mengabaikan potensi ketidakakuratan data","Mempercayai sepenuhnya laporan tanpa validasi","Hanya memeriksa data sekali dalam setahun tanpa pembaruan"],"k":1,"p":"Verifikasi silang data EMIS dengan kondisi riil di lapangan melalui kunjungan dan observasi langsung memastikan keakuratan data yang dilaporkan, penting karena data ini sering menjadi dasar pengambilan kebijakan dan alokasi sumber daya.","t":0},{"m":2,"q":"Bu Pengawas Aminah mengevaluasi dampak program bantuan operasional terhadap peningkatan mutu madrasah binaan dengan membandingkan indikator sebelum dan sesudah bantuan diterima. Pendekatan evaluasi ini termasuk evaluasi...","o":["Proses semata","Input tanpa melihat hasil","Dampak (impact evaluation)","Administratif murni","Reaktif tanpa perencanaan"],"k":2,"p":"Evaluasi dampak (impact evaluation) menilai perubahan yang terjadi akibat suatu program atau intervensi (bantuan operasional) dengan membandingkan kondisi sebelum dan sesudah, memberikan bukti nyata tentang efektivitas program terhadap peningkatan mutu.","t":1},{"m":2,"q":"Untuk memastikan evaluasi program keagamaan (mis. praktik ibadah, tahfizh) di madrasah dilakukan secara tepat, pengawas perlu menilai...","o":["Hanya jumlah hafalan yang dicapai siswa","Popularitas program di kalangan wali santri","Hanya kerapian dokumentasi program","Kesesuaian proses pembinaan dengan tujuan pembentukan karakter dan pemahaman keagamaan yang mendalam, bukan sekadar capaian kuantitatif","Durasi program tanpa melihat kualitas pembinaan"],"k":3,"p":"Evaluasi program keagamaan perlu menilai kesesuaian proses pembinaan dengan tujuan pembentukan karakter dan pemahaman keagamaan yang mendalam, bukan sekadar capaian kuantitatif seperti jumlah hafalan tanpa melihat kualitas pemahaman dan penghayatan.","t":0},{"m":2,"q":"Pak Pengawas Nasrullah menyusun rencana evaluasi yang mempertimbangkan keterbatasan waktu dan sumber daya, memilih fokus evaluasi yang paling prioritas dibanding mencoba mengevaluasi semua aspek sekaligus. Prinsip ini mencerminkan...","o":["Evaluasi yang tidak lengkap dan kurang bertanggung jawab","Tidak relevan dengan prinsip evaluasi komprehensif","Mengabaikan aspek penting demi kepraktisan semata","Efisiensi dan fokus strategis dalam evaluasi, memastikan sumber daya terbatas dialokasikan pada aspek yang paling berdampak","Hanya berlaku untuk pengawas dengan banyak madrasah binaan"],"k":3,"p":"Memilih fokus evaluasi prioritas mencerminkan efisiensi dan fokus strategis, memastikan sumber daya terbatas (waktu, tenaga) dialokasikan pada aspek yang paling berdampak, lebih realistis dibanding mencoba mengevaluasi semua aspek sekaligus secara dangkal.","t":1},{"m":2,"q":"Untuk mengevaluasi efektivitas transisi pembelajaran dari kurikulum lama ke kurikulum baru di madrasah binaan, pengawas perlu membandingkan...","o":["Hanya nama kurikulum yang digunakan","Kesiapan guru, ketersediaan sumber belajar, dan capaian siswa sebelum dan selama masa transisi, untuk menilai kelancaran implementasi","Jumlah halaman dokumen kurikulum baru","Popularitas kurikulum baru di kalangan orang tua","Kecepatan sosialisasi kurikulum tanpa melihat implementasi nyata"],"k":1,"p":"Evaluasi transisi kurikulum perlu membandingkan kesiapan guru, ketersediaan sumber belajar, dan capaian siswa sebelum-selama masa transisi, memberikan gambaran nyata tentang kelancaran implementasi kebijakan kurikulum baru di lapangan.","t":0},{"m":2,"q":"Sebuah program literasi di MTs tidak menaikkan skor murid. Evaluator mencatat kebutuhan murid sudah dipetakan, buku dan anggaran memadai, tetapi guru tidak mengikuti jadwal program dan tidak ada pemantauan. Komponen CIPP yang paling menjelaskan kegagalan beserta pertanyaan evaluasinya adalah...","o":["Product: apakah hasil program mencapai tujuan sehingga layak dilanjutkan atau dihentikan?","Context: apakah tujuan program sesuai dengan kebutuhan murid dan lingkungan madrasah?","Input: apakah sumber daya, strategi, dan anggaran program sudah direncanakan secara memadai?","Process: apakah kebutuhan murid sudah dipetakan sebelum program dirancang dan dilaksanakan?","Process: apakah pelaksanaan program berjalan sesuai rencana dan dipantau secara berkala?"],"k":4,"p":"Kebutuhan, sumber daya, dan anggaran sudah memadai, sehingga masalah ada pada pelaksanaan dan pemantauan, yaitu Process. Pertanyaan tentang kebutuhan milik Context, sumber daya milik Input, dan hasil milik Product.","t":2},{"m":2,"q":"Setelah pelatihan asesmen untuk 30 guru, 92 persen peserta menyatakan puas, dan skor tes naik dari 55 menjadi 80. Tiga bulan kemudian, hanya 6 guru memakai teknik baru di kelas. Kesimpulan evaluasi Kirkpatrick yang paling tepat adalah...","o":["Learning dan Behavior tercapai pada 6 guru, sehingga Results sudah dapat dinilai di semua madrasah.","Reaction dan Learning tercapai, tetapi Behavior belum, sehingga hambatan penerapan di kelas perlu ditelusuri.","Behavior sudah tercapai karena ada guru yang menerapkan teknik baru, sehingga Results siap dinilai.","Pelatihan berhasil seluruhnya, karena kepuasan dan kenaikan skor menunjukkan tujuan pembelajaran tercapai.","Reaction tercapai, tetapi Learning belum, karena kenaikan skor tes belum menjamin pemahaman yang mendalam."],"k":1,"p":"Kepuasan (Reaction) dan kenaikan skor (Learning) tercapai. Hanya 6 dari 30 guru, yaitu 20 persen, menerapkan teknik baru, sehingga Behavior belum tercapai. Results baru bermakna setelah Behavior berubah.","t":2},{"m":2,"q":"Pengawas mencatat tiga hal: (a) rata-rata ulangan matematika kelas V adalah 68, (b) kesimpulan bahwa 40 persen murid belum menguasai pecahan, (c) keputusan merevisi strategi pembelajaran pecahan. Penyebutan yang tepat untuk (a), (b), dan (c) berturut-turut adalah...","o":["penilaian, evaluasi, pengukuran","penilaian, pengukuran, evaluasi","pengukuran, penilaian, evaluasi","evaluasi, penilaian, pengukuran","pengukuran, evaluasi, penilaian"],"k":2,"p":"Angka rata-rata adalah hasil pengukuran. Deskripsi capaian murid adalah penilaian. Keputusan merevisi strategi adalah evaluasi. Urutan lain menukar dua atau tiga istilah itu.","t":2},{"m":3,"q":"Penelitian yang dilakukan pengawas untuk memperbaiki dan meningkatkan kualitas praktik kepengawasan melalui siklus tindakan reflektif disebut...","o":["Penelitian eksperimen murni","Penelitian korelasional","Penelitian deskriptif semata","Studi kasus tanpa intervensi","Penelitian Tindakan Sekolah/Kepengawasan (PTS/PTK Pengawas)"],"k":4,"p":"Penelitian Tindakan Sekolah/Kepengawasan (PTS) adalah penelitian yang dilakukan pengawas untuk memperbaiki dan meningkatkan kualitas praktik kepengawasan melalui siklus tindakan reflektif (perencanaan- pelaksanaan-observasi-refleksi) yang berulang.","t":0},{"m":3,"q":"Pengawas Pak Yunus merancang PTS untuk meningkatkan efektivitas program pendampingan literasi di madrasah binaannya. Tahap pertama dalam siklus PTS yang perlu dilakukan adalah...","o":["Melakukan identifikasi masalah dan menyusun perencanaan tindakan (planning) berdasarkan analisis kondisi awal","Langsung melaksanakan tindakan tanpa perencanaan","Menyusun laporan akhir penelitian","Mempublikasikan hasil penelitian ke jurnal","Mengumpulkan data pasca-tindakan"],"k":0,"p":"Siklus PTS diawali dengan identifikasi masalah dan penyusunan perencanaan tindakan (planning) berdasarkan analisis kondisi awal, menjadi dasar bagi pelaksanaan tindakan yang akan diobservasi dan direfleksikan pada tahap selanjutnya.","t":1},{"m":3,"q":"Untuk memastikan penelitian yang dilakukan pengawas memiliki manfaat praktis bagi peningkatan mutu madrasah binaan, topik penelitian sebaiknya...","o":["Dipilih secara acak tanpa mempertimbangkan konteks","Mengikuti tren penelitian internasional tanpa relevansi lokal","Berangkat dari permasalahan riil yang dihadapi madrasah binaan, sehingga hasil penelitian dapat langsung diaplikasikan untuk perbaikan","Hanya berdasarkan minat pribadi pengawas tanpa mempertimbangkan kebutuhan madrasah","Disusun tanpa melibatkan data dari madrasah binaan"],"k":2,"p":"Topik penelitian pengawas yang bermanfaat sebaiknya berangkat dari permasalahan riil yang dihadapi madrasah binaan, memastikan hasil penelitian relevan dan dapat langsung diaplikasikan untuk perbaikan praktik di lapangan.","t":0},{"m":3,"q":"Bu Pengawas Aisyah mengembangkan model pendampingan berbasis coaching untuk madrasah binaannya, kemudian mendokumentasikan proses pengembangannya secara sistematis sebagai karya inovatif. Jenis kegiatan pengembangan profesi ini disebut...","o":["Penelitian eksperimen laboratorium","Pengembangan karya inovatif/model pembinaan","Studi pustaka semata","Terjemahan buku ilmiah","Plagiarisme karya orang lain"],"k":1,"p":"Pengembangan karya inovatif/model pembinaan adalah kegiatan pengembangan profesi yang menghasilkan model, metode, atau pendekatan baru (seperti model pendampingan berbasis coaching) yang didokumentasikan secara sistematis sebagai kontribusi keilmuan.","t":1},{"m":3,"q":"Untuk menjamin validitas hasil PTS yang dilakukan, pengawas perlu memastikan pengumpulan data menggunakan...","o":["Hanya opini pribadi tanpa data pendukung","Metode yang tidak konsisten antarsiklus penelitian","Data yang direkayasa agar hasil sesuai harapan","Sumber data tunggal tanpa verifikasi","Instrumen yang sesuai dengan tujuan penelitian dan triangulasi sumber data untuk meningkatkan kredibilitas temuan"],"k":4,"p":"Validitas hasil PTS memerlukan instrumen yang sesuai dengan tujuan penelitian dan triangulasi sumber data (observasi, wawancara, dokumen) untuk meningkatkan kredibilitas temuan, memastikan hasil penelitian dapat dipercaya dan bermanfaat.","t":0},{"m":3,"q":"Pak Pengawas Ramadhan menyusun artikel ilmiah dari hasil PTS yang telah dilaksanakan untuk dipublikasikan di jurnal pendidikan. Manfaat utama publikasi ini adalah...","o":["Berkontribusi pada pengembangan ilmu pengetahuan kepengawasan sekaligus berbagi praktik baik yang dapat dimanfaatkan pengawas lain","Hanya untuk memenuhi syarat administratif kepangkatan semata","Tidak relevan dengan tugas pokok pengawas","Menggantikan sepenuhnya tugas pembinaan langsung ke madrasah","Hanya bermanfaat bagi pengawas yang bersangkutan"],"k":0,"p":"Publikasi hasil PTS berkontribusi pada pengembangan ilmu pengetahuan kepengawasan sekaligus berbagi praktik baik yang dapat dimanfaatkan pengawas lain, memperluas dampak penelitian melampaui kepentingan administratif kepangkatan semata.","t":1},{"m":3,"q":"Tahap dalam siklus PTS yang dilakukan untuk mengamati dan mengumpulkan data selama tindakan dilaksanakan disebut tahap...","o":["Perencanaan (planning)","Publikasi","Refleksi (reflecting)","Observasi (observing)","Diseminasi"],"k":3,"p":"Tahap observasi (observing) dalam siklus PTS dilakukan untuk mengamati dan mengumpulkan data selama tindakan dilaksanakan, menjadi dasar bagi tahap refleksi berikutnya untuk menilai efektivitas tindakan yang diterapkan.","t":0},{"m":3,"q":"Bu Pengawas Halimah melibatkan kepala madrasah dan guru dalam proses penelitian tindakan yang dilakukannya, bukan melakukannya secara sepihak. Manfaat utama pendekatan kolaboratif ini adalah...","o":["Hanya memperlambat proses penelitian","Mengurangi objektivitas hasil penelitian","Meningkatkan relevansi penelitian dengan kebutuhan riil serta memperkuat rasa kepemilikan terhadap hasil dan implementasi tindak lanjutnya","Tidak relevan dengan tujuan penelitian tindakan","Hanya efektif untuk madrasah kecil"],"k":2,"p":"Penelitian tindakan kolaboratif yang melibatkan kepala madrasah dan guru meningkatkan relevansi dengan kebutuhan riil serta memperkuat rasa kepemilikan terhadap hasil, memperkuat keberlanjutan implementasi tindak lanjut penelitian.","t":1},{"m":3,"q":"Untuk menyusun rumusan masalah penelitian tindakan yang baik, pengawas perlu memastikan rumusan tersebut...","o":["Spesifik, dapat diukur, dan berkaitan langsung dengan praktik kepengawasan yang ingin diperbaiki","Bersifat sangat luas agar mencakup semua aspek pendidikan","Disusun tanpa data pendukung awal","Meniru rumusan masalah penelitian lain tanpa penyesuaian konteks","Tidak perlu dikaitkan dengan tindakan yang akan dilakukan"],"k":0,"p":"Rumusan masalah penelitian tindakan yang baik bersifat spesifik, dapat diukur, dan berkaitan langsung dengan praktik kepengawasan yang ingin diperbaiki, memastikan penelitian terarah dan hasilnya dapat dievaluasi secara jelas.","t":0},{"m":3,"q":"Pak Pengawas Firdaus mengembangkan modul pelatihan berbasis hasil penelitiannya tentang kesulitan guru menerapkan pembelajaran berdiferensiasi. Kegiatan ini mencerminkan pemanfaatan hasil penelitian untuk...","o":["Hanya kepentingan akademik semata tanpa aplikasi praktis","Hanya bermanfaat bagi pengawas yang menyusunnya","Menggantikan sepenuhnya kebutuhan penelitian lanjutan","Tidak relevan dengan tugas kepengawasan","Pengembangan produk/karya nyata yang dapat langsung digunakan untuk pembinaan, menjembatani teori penelitian dengan praktik di lapangan"],"k":4,"p":"Mengembangkan modul pelatihan berbasis hasil penelitian mencerminkan pemanfaatan penelitian untuk menghasilkan produk/karya nyata yang dapat langsung digunakan dalam pembinaan, menjembatani teori penelitian dengan aplikasi praktis di lapangan.","t":1},{"m":3,"q":"Untuk memastikan penelitian yang dilakukan pengawas sesuai kaidah etika penelitian, hal yang perlu diperhatikan adalah...","o":["Mengabaikan persetujuan dari pihak yang terlibat dalam penelitian","Memperoleh persetujuan (informed consent), menjaga kerahasiaan data pribadi, dan melaporkan hasil secara jujur tanpa manipulasi","Menggunakan data tanpa izin dari subjek penelitian","Mempublikasikan data pribadi guru/siswa tanpa penyamaran","Mengubah hasil penelitian agar sesuai harapan pihak tertentu"],"k":1,"p":"Etika penelitian mengharuskan pengawas memperoleh persetujuan dari pihak terlibat, menjaga kerahasiaan data pribadi, dan melaporkan hasil secara jujur tanpa manipulasi, memastikan penelitian dilakukan secara bertanggung jawab dan menghormati subjek penelitian.","t":0},{"m":3,"q":"Bu Pengawas Kartika menggunakan hasil penelitiannya sebagai dasar merancang program pembinaan berkelanjutan bagi madrasah binaan, bukan sekadar menyelesaikan kewajiban administratif. Pendekatan ini mencerminkan prinsip penelitian yang...","o":["Hanya formalitas kepangkatan semata","Tidak relevan dengan tugas pokok pengawas","Aplikatif dan berorientasi pada perbaikan praktik nyata, menjadikan penelitian sebagai alat perbaikan berkelanjutan bukan sekadar kewajiban administratif","Terpisah sepenuhnya dari tugas pembinaan","Hanya bermanfaat jika dipublikasikan secara luas"],"k":2,"p":"Menggunakan hasil penelitian sebagai dasar program pembinaan berkelanjutan mencerminkan prinsip penelitian yang aplikatif dan berorientasi pada perbaikan praktik nyata, menjadikan penelitian sebagai alat perbaikan berkelanjutan yang bermakna, bukan sekadar kewajiban administratif.","t":1},{"m":3,"q":"Untuk mengukur keberhasilan tindakan dalam siklus PTS, pengawas perlu menetapkan...","o":["Kriteria yang berubah-ubah setiap siklus tanpa konsistensi","Standar keberhasilan berdasarkan opini subjektif semata","Kriteria yang sangat umum tanpa batasan jelas","Indikator keberhasilan yang jelas dan terukur sejak awal, menjadi acuan menilai efektivitas tindakan yang dilakukan","Tidak perlu menetapkan indikator karena bersifat fleksibel"],"k":3,"p":"Keberhasilan tindakan dalam PTS perlu diukur dengan indikator keberhasilan yang jelas dan terukur sejak awal penelitian, menjadi acuan objektif untuk menilai apakah tindakan yang dilakukan benar-benar efektif mengatasi permasalahan yang diidentifikasi.","t":0},{"m":3,"q":"Pak Pengawas Budiman melakukan kajian literatur secara mendalam sebelum merancang PTS-nya tentang strategi peningkatan kompetensi digital guru. Manfaat utama langkah ini adalah...","o":["Hanya formalitas administratif penelitian","Menggantikan sepenuhnya kebutuhan data lapangan","Tidak relevan dengan penelitian tindakan yang bersifat praktis","Memastikan penelitian dibangun di atas fondasi teori dan temuan penelitian sebelumnya yang relevan, menghindari duplikasi dan memperkuat kerangka konseptual","Hanya diperlukan untuk penelitian akademik formal"],"k":3,"p":"Kajian literatur mendalam memastikan penelitian dibangun di atas fondasi teori dan temuan penelitian sebelumnya yang relevan, menghindari duplikasi penelitian yang sudah ada dan memperkuat kerangka konseptual penelitian yang akan dilakukan.","t":1},{"m":3,"q":"Untuk mendiseminasikan hasil penelitian dan karya inovatif kepada sesama pengawas dan pemangku kepentingan pendidikan, media yang dapat dimanfaatkan meliputi...","o":["Hanya menyimpan hasil penelitian sebagai dokumen pribadi","Seminar, workshop, jurnal ilmiah, dan forum profesi pengawas (POKJAWAS) sebagai sarana berbagi temuan dan praktik baik","Menyembunyikan hasil penelitian dari pihak lain","Hanya mempublikasikan di media sosial pribadi tanpa konteks ilmiah","Menunggu diminta sebelum membagikan hasil penelitian"],"k":1,"p":"Diseminasi hasil penelitian dapat dilakukan melalui seminar, workshop, jurnal ilmiah, dan forum profesi seperti POKJAWAS, memperluas manfaat temuan penelitian kepada sesama pengawas dan pemangku kepentingan pendidikan lainnya.","t":0},{"m":3,"q":"Bu Pengawas Nadia merancang penelitian pengembangan (R&D) untuk menghasilkan instrumen supervisi akademik yang lebih kontekstual bagi madrasah binaan. Tahap awal dalam penelitian R&D yang perlu dilakukan adalah...","o":["Langsung memproduksi instrumen final tanpa uji coba","Menyalin instrumen dari sumber lain tanpa modifikasi","Mempublikasikan instrumen sebelum diuji validitasnya","Mengabaikan studi literatur terkait instrumen sejenis","Melakukan analisis kebutuhan (need analysis) untuk mengidentifikasi kesenjangan antara instrumen yang ada dengan kebutuhan riil di lapangan"],"k":4,"p":"Penelitian pengembangan (R&D) diawali dengan analisis kebutuhan untuk mengidentifikasi kesenjangan antara kondisi yang ada dengan kebutuhan riil, menjadi dasar perancangan produk (instrumen) yang benar-benar menjawab permasalahan di lapangan.","t":1},{"m":3,"q":"Untuk menguji kelayakan produk/karya inovatif yang dikembangkan (mis. modul, instrumen, model pembinaan), pengawas perlu melakukan...","o":["Validasi oleh ahli (expert judgment) dan uji coba terbatas di lapangan sebelum implementasi lebih luas","Langsung menyebarluaskan produk tanpa uji coba","Mengasumsikan produk pasti layak tanpa verifikasi","Menggunakan produk tanpa evaluasi efektivitasnya","Hanya mengandalkan opini pribadi pengawas tentang kelayakan produk"],"k":0,"p":"Kelayakan produk/karya inovatif perlu diuji melalui validasi ahli (expert judgment) dan uji coba terbatas di lapangan sebelum implementasi lebih luas, memastikan produk benar-benar efektif dan sesuai kebutuhan sebelum disebarluaskan.","t":0},{"m":3,"q":"Pak Pengawas Zainal mendokumentasikan proses dan hasil penelitiannya secara sistematis, termasuk data mentah dan analisis, sebagai bentuk transparansi ilmiah. Manfaat utama praktik ini adalah...","o":["Hanya menambah beban administratif","Tidak relevan dengan penelitian tindakan yang bersifat kontekstual","Memungkinkan verifikasi dan replikasi penelitian oleh pihak lain, meningkatkan kredibilitas dan akuntabilitas ilmiah dari penelitian yang dilakukan","Menggantikan sepenuhnya kebutuhan laporan naratif","Hanya diperlukan untuk penelitian yang akan dipublikasikan"],"k":2,"p":"Dokumentasi sistematis proses dan hasil penelitian memungkinkan verifikasi dan replikasi oleh pihak lain, meningkatkan kredibilitas dan akuntabilitas ilmiah, prinsip penting dalam penelitian meski bersifat kontekstual/tindakan.","t":1},{"m":3,"q":"Untuk memastikan hasil penelitian dan pengembangan yang dilakukan pengawas berkelanjutan dampaknya, diperlukan...","o":["Penelitian yang dilakukan hanya sekali tanpa tindak lanjut","Integrasi hasil penelitian ke dalam program pembinaan rutin dan kebijakan pengawasan, memastikan temuan terus dimanfaatkan bukan berhenti sebagai laporan","Menyimpan hasil penelitian sebagai arsip tanpa implementasi","Mengabaikan hasil penelitian setelah dipublikasikan","Hanya memanfaatkan hasil penelitian untuk kepentingan pribadi"],"k":1,"p":"Keberlanjutan dampak penelitian memerlukan integrasi hasil ke dalam program pembinaan rutin dan kebijakan pengawasan, memastikan temuan penelitian terus dimanfaatkan secara berkelanjutan, bukan sekadar berhenti sebagai laporan atau dokumen arsip.","t":0},{"m":3,"q":"Bu Pengawas Rahmawati mengintegrasikan nilai kejujuran ilmiah dalam melaksanakan penelitian, memastikan tidak ada manipulasi data demi hasil yang diinginkan. Pendekatan ini mencerminkan...","o":["Formalitas akademik semata","Menghambat kelancaran proses penelitian","Tidak relevan dengan penelitian tindakan yang bersifat praktis","Hanya relevan bagi penelitian yang dipublikasikan secara luas","Integritas akademik yang penting dalam penelitian pendidikan, memastikan hasil penelitian dapat dipercaya dan bermanfaat bagi perbaikan yang sesungguhnya"],"k":4,"p":"Integritas akademik (kejujuran ilmiah) sangat penting dalam penelitian pendidikan, memastikan hasil penelitian dapat dipercaya dan benar- benar bermanfaat bagi perbaikan yang sesungguhnya, bukan data yang dimanipulasi demi hasil yang diinginkan semata.","t":1},{"m":3,"q":"Untuk mengembangkan kompetensi penelitian secara berkelanjutan, pengawas perlu...","o":["Mengikuti pelatihan metodologi penelitian terkini, membaca publikasi ilmiah terbaru, dan aktif berdiskusi dalam forum penelitian pendidikan","Mengandalkan pengetahuan penelitian yang diperoleh saat pendidikan formal saja tanpa pembaruan","Menghindari metode penelitian baru karena dianggap merepotkan","Hanya mengandalkan template penelitian yang sudah ada tanpa pengembangan","Membatasi diri pada penelitian administratif semata"],"k":0,"p":"Pengembangan kompetensi penelitian berkelanjutan memerlukan partisipasi dalam pelatihan metodologi terkini, membaca publikasi ilmiah terbaru, dan diskusi aktif dalam forum penelitian pendidikan, memastikan kompetensi penelitian pengawas tetap relevan dan mutakhir.","t":0},{"m":3,"q":"Pak Pengawas Suparman merancang penelitian yang membandingkan efektivitas dua model pendampingan berbeda di madrasah binaan yang memiliki karakteristik serupa. Desain penelitian ini termasuk...","o":["Penelitian deskriptif semata","Penelitian historis","Studi kasus tunggal tanpa pembanding","Penelitian komparatif/eksperimen semu (quasi-experiment)","Penelitian korelasional tanpa intervensi"],"k":3,"p":"Penelitian yang membandingkan efektivitas dua model/intervensi berbeda pada kelompok dengan karakteristik serupa termasuk penelitian komparatif/eksperimen semu (quasi-experiment), memberikan bukti perbandingan yang lebih kuat dibanding penelitian deskriptif semata.","t":1},{"m":3,"q":"Untuk memastikan penelitian yang dilakukan pengawas tidak mengganggu proses pembelajaran di madrasah binaan, pengawas perlu...","o":["Melaksanakan penelitian tanpa koordinasi dengan pihak madrasah","Mengabaikan dampak penelitian terhadap kegiatan belajar-mengajar","Merencanakan waktu dan metode penelitian yang meminimalkan gangguan terhadap aktivitas pembelajaran, disertai koordinasi dengan kepala madrasah dan guru","Melakukan penelitian secara mendadak tanpa pemberitahuan","Menghentikan seluruh kegiatan pembelajaran demi kelancaran penelitian"],"k":2,"p":"Penelitian yang etis dan profesional memerlukan perencanaan waktu dan metode yang meminimalkan gangguan terhadap pembelajaran, disertai koordinasi dengan pihak madrasah, memastikan penelitian tidak merugikan proses pendidikan yang sedang berlangsung.","t":0},{"m":3,"q":"Bu Pengawas Suminah menggunakan hasil penelitiannya sebagai bahan penyusunan kebijakan rekomendasi kepada Kankemenag terkait program pembinaan guru di wilayah kerjanya. Manfaat utama pemanfaatan penelitian ini adalah...","o":["Memberikan dasar bukti (evidence-based) bagi perumusan kebijakan yang lebih tepat sasaran di tingkat wilayah, meningkatkan efektivitas program pembinaan secara sistemik","Hanya kepentingan akademik pribadi semata","Tidak relevan dengan tugas pokok pengawas","Menggantikan sepenuhnya proses pengambilan keputusan Kankemenag","Hanya bermanfaat bagi pengawas yang menyusun penelitian"],"k":0,"p":"Pemanfaatan hasil penelitian sebagai dasar rekomendasi kebijakan memberikan bukti (evidence-based) bagi perumusan kebijakan yang lebih tepat sasaran di tingkat wilayah, meningkatkan efektivitas program pembinaan secara sistemik melampaui dampak individual.","t":1},{"m":3,"q":"Untuk menyusun instrumen pengumpulan data penelitian yang valid, pengawas perlu melakukan...","o":["Menyusun instrumen tanpa uji coba terlebih dahulu","Mengabaikan uji coba karena dianggap memakan waktu","Mengadopsi instrumen dari penelitian lain tanpa penyesuaian konteks","Menggunakan instrumen yang sama untuk semua jenis penelitian tanpa modifikasi","Uji coba instrumen (piloting) dan analisis validitas-reliabilitas sebelum digunakan untuk pengumpulan data penelitian yang sesungguhnya"],"k":4,"p":"Instrumen pengumpulan data yang valid memerlukan uji coba (piloting) dan analisis validitas-reliabilitas sebelum digunakan untuk pengumpulan data sesungguhnya, memastikan instrumen benar-benar mengukur apa yang dimaksud secara akurat dan konsisten.","t":0},{"m":3,"q":"Pak Pengawas Hidayatullah mempresentasikan hasil penelitiannya dalam forum ilmiah dan menerima masukan kritis dari sesama peneliti. Manfaat utama proses ini adalah...","o":["Hanya formalitas akademik tanpa nilai tambah","Memperkaya kualitas penelitian melalui perspektif eksternal, membantu mengidentifikasi kelemahan atau keterbatasan yang mungkin terlewat oleh peneliti sendiri","Tidak relevan dengan tujuan penelitian tindakan","Mengurangi kepercayaan diri peneliti","Hanya diperlukan untuk penelitian yang akan dipublikasikan di jurnal internasional"],"k":1,"p":"Presentasi dan diskusi hasil penelitian dalam forum ilmiah memperkaya kualitas penelitian melalui perspektif eksternal (peer review), membantu mengidentifikasi kelemahan atau keterbatasan yang mungkin terlewat oleh peneliti sendiri, memperkuat validitas temuan.","t":1},{"m":3,"q":"Untuk memastikan karya inovatif yang dikembangkan pengawas dapat direplikasi oleh pengawas lain di wilayah berbeda, dokumentasi karya perlu mencakup...","o":["Hanya kesimpulan akhir tanpa detail proses","Deskripsi yang sangat umum tanpa detail teknis","Langkah-langkah pengembangan yang jelas dan terperinci, disertai konteks penerapan dan faktor-faktor yang perlu disesuaikan pada konteks berbeda","Hanya hasil akhir tanpa menjelaskan proses pengembangan","Istilah teknis yang kompleks tanpa penjelasan yang jelas"],"k":2,"p":"Dokumentasi karya inovatif yang dapat direplikasi memerlukan langkah-langkah pengembangan yang jelas dan terperinci, disertai konteks penerapan dan faktor yang perlu disesuaikan pada konteks berbeda, memudahkan pengawas lain mengadaptasi karya tersebut.","t":0},{"m":3,"q":"Bu Pengawas Mardiana merancang penelitian yang mengukur perubahan sikap guru terhadap inovasi pembelajaran sebelum dan sesudah mengikuti program pendampingannya. Instrumen yang paling tepat digunakan adalah...","o":["Hanya wawancara singkat tanpa instrumen terstandar","Hanya opini pribadi pengawas tentang perubahan sikap guru","Observasi tanpa pedoman yang jelas","Angket/skala sikap yang telah diuji validitas-reliabilitasnya, digunakan pada kedua waktu pengukuran (pre-post) untuk melihat perubahan secara terukur","Data sekunder dari sumber lain yang tidak terkait langsung"],"k":3,"p":"Mengukur perubahan sikap secara terukur memerlukan angket/skala sikap yang telah diuji validitas-reliabilitasnya, digunakan pada dua waktu pengukuran (pre-post), memberikan bukti kuantitatif yang lebih kredibel dibanding opini atau observasi tanpa pedoman jelas.","t":1},{"m":3,"q":"Untuk memastikan penelitian pengembangan yang dilakukan pengawas menghasilkan produk yang benar-benar bermanfaat, tahap evaluasi produk perlu melibatkan...","o":["Hanya penilaian dari pengawas yang mengembangkan produk","Hanya penilaian berdasarkan teori tanpa uji coba lapangan","Pihak yang tidak terkait dengan pendidikan sama sekali","Pengguna langsung produk (kepala madrasah, guru) untuk menilai kepraktisan, kemudahan penggunaan, dan dampak nyata terhadap peningkatan mutu","Mengabaikan masukan pengguna karena dianggap subjektif"],"k":3,"p":"Evaluasi produk penelitian pengembangan perlu melibatkan pengguna langsung (kepala madrasah, guru) untuk menilai kepraktisan, kemudahan penggunaan, dan dampak nyata, memastikan produk benar-benar bermanfaat dan applicable di lapangan, bukan hanya baik secara teoretis.","t":0},{"m":3,"q":"Pak Pengawas Junaedi menuliskan refleksi kritis tentang keterbatasan penelitiannya dalam laporan akhir, bukan hanya menonjolkan keberhasilan semata. Manfaat utama sikap ilmiah ini adalah...","o":["Hanya melemahkan kredibilitas penelitian","Menunjukkan kejujuran ilmiah dan membuka ruang bagi penelitian lanjutan yang dapat mengatasi keterbatasan tersebut","Tidak relevan dengan kualitas laporan penelitian","Mengurangi nilai kontribusi penelitian bagi pembaca","Hanya diperlukan untuk penelitian yang gagal mencapai tujuan"],"k":1,"p":"Refleksi kritis tentang keterbatasan penelitian menunjukkan kejujuran ilmiah dan membuka ruang bagi penelitian lanjutan yang dapat mengatasi keterbatasan tersebut, mencerminkan sikap ilmiah yang matang dan berkontribusi pada perkembangan keilmuan berkelanjutan.","t":1},{"m":3,"q":"Untuk memastikan penelitian dan karya inovatif yang dihasilkan pengawas selaras dengan kebutuhan pengembangan profesi berkelanjutan (PKB), pengawas perlu...","o":["Melakukan penelitian tanpa mengaitkannya dengan rencana pengembangan diri","Mengabaikan keterkaitan penelitian dengan pengembangan kompetensi","Menganggap penelitian dan PKB sebagai dua hal yang terpisah sepenuhnya","Hanya melakukan penelitian jika diwajibkan untuk kenaikan pangkat","Merencanakan topik penelitian sebagai bagian integral dari rencana PKB tahunan, memastikan penelitian mendukung pengembangan kompetensi yang ditargetkan"],"k":4,"p":"Penelitian yang selaras dengan PKB direncanakan sebagai bagian integral dari rencana pengembangan diri tahunan, memastikan penelitian bukan sekadar kewajiban administratif tetapi juga mendukung pengembangan kompetensi pengawas yang ditargetkan secara sistematis.","t":0},{"m":3,"q":"Jenis data yang diperoleh melalui pengamatan langsung terhadap perilaku atau fenomena tanpa melalui perantara instrumen tertulis disebut data...","o":["Primer hasil observasi","Sekunder","Dokumentatif semata","Arsip historis","Statistik nasional"],"k":0,"p":"Data primer hasil observasi diperoleh melalui pengamatan langsung terhadap perilaku atau fenomena oleh peneliti sendiri, berbeda dengan data sekunder yang diperoleh dari sumber yang sudah ada sebelumnya (dokumen, laporan pihak lain).","t":0},{"m":3,"q":"Bu Pengawas Rukmini merancang penelitian dengan menggunakan angket terbuka yang memungkinkan responden menjawab secara bebas, dipadukan dengan angket tertutup berskala. Pendekatan ini disebut penggunaan instrumen...","o":["Tunggal tanpa variasi","Hanya kualitatif murni","Campuran (kuantitatif-kualitatif) untuk memperkaya data yang diperoleh","Hanya kuantitatif murni","Tidak terstruktur sepenuhnya"],"k":2,"p":"Penggunaan angket terbuka dan tertutup secara bersamaan mencerminkan pendekatan instrumen campuran (kuantitatif-kualitatif), memperkaya data yang diperoleh dengan menggabungkan kedalaman jawaban bebas dan keterukuran skala tertutup.","t":1},{"m":3,"q":"Untuk memastikan hasil penelitian tindakan dapat digeneralisasi secara hati-hati (bukan mutlak) ke konteks madrasah lain, pengawas perlu menjelaskan...","o":["Hanya hasil akhir tanpa konteks penelitian","Karakteristik konteks penelitian (lokasi, subjek, kondisi) secara jelas, sehingga pembaca dapat menilai kesesuaian penerapan pada konteks berbeda","Mengklaim hasil berlaku universal tanpa syarat","Mengabaikan perbedaan konteks antarmadrasah","Hanya menyebutkan nama madrasah tanpa detail konteks lainnya"],"k":1,"p":"Penelitian tindakan bersifat kontekstual, sehingga generalisasi perlu dilakukan hati-hati dengan menjelaskan karakteristik konteks penelitian secara jelas, memungkinkan pembaca menilai sendiri kesesuaian penerapan temuan pada konteks madrasah yang berbeda.","t":0},{"m":3,"q":"Pak Pengawas Sutrisno mengembangkan panduan pembinaan berbasis hasil penelitiannya, kemudian mengujicobakannya di beberapa madrasah binaan sebelum menyebarluaskan secara lebih luas. Tahap ini dalam penelitian pengembangan disebut...","o":["Analisis kebutuhan","Studi pendahuluan","Diseminasi","Perumusan masalah awal","Uji coba terbatas (small-scale trial)"],"k":4,"p":"Uji coba terbatas (small-scale trial) adalah tahap dalam penelitian pengembangan di mana produk yang dikembangkan diujicobakan pada skala kecil terlebih dahulu untuk melihat efektivitas dan mengidentifikasi perbaikan sebelum disebarluaskan lebih luas.","t":1},{"m":3,"q":"Untuk menjaga kerahasiaan identitas responden penelitian (guru/siswa) dalam laporan yang dipublikasikan, pengawas perlu menerapkan prinsip...","o":["Anonimitas/penyamaran identitas, menggunakan kode atau nama samaran dalam pelaporan hasil penelitian","Mencantumkan nama lengkap responden agar hasil lebih kredibel","Mempublikasikan data pribadi tanpa persetujuan","Mengabaikan aspek kerahasiaan demi transparansi penuh","Hanya menyamarkan identitas jika diminta responden"],"k":0,"p":"Prinsip anonimitas/penyamaran identitas (menggunakan kode atau nama samaran) penting diterapkan dalam pelaporan penelitian untuk melindungi privasi responden, bagian dari etika penelitian yang wajib dipatuhi peneliti pendidikan.","t":0},{"m":3,"q":"Bu Pengawas Wahyuni menyusun rencana penelitian dan pengembangan tahunan yang terintegrasi dengan program pengawasan (Proswas), bukan sebagai kegiatan terpisah. Manfaat utama integrasi ini adalah...","o":["Hanya menambah kerumitan administratif","Mengurangi fokus pada tugas pembinaan utama","Tidak relevan dengan efektivitas program pengawasan","Memastikan penelitian dan pengembangan menjadi bagian sistematis dari tugas kepengawasan, bukan kegiatan tambahan yang terpisah dari tanggung jawab utama","Hanya bermanfaat bagi pengawas senior"],"k":3,"p":"Integrasi rencana penelitian dengan Program Pengawasan (Proswas) memastikan penelitian dan pengembangan menjadi bagian sistematis dari tugas kepengawasan, bukan kegiatan tambahan yang terpisah, memperkuat keselarasan antara pembinaan rutin dan upaya perbaikan berbasis bukti.","t":1},{"m":3,"q":"Untuk menilai kontribusi nyata karya inovatif yang dikembangkan pengawas terhadap peningkatan mutu pendidikan, indikator yang perlu diperhatikan adalah...","o":["Hanya jumlah halaman dokumen karya inovatif","Kerumitan bahasa yang digunakan dalam penulisan karya","Tingkat adopsi dan dampak nyata karya tersebut terhadap perbaikan praktik di madrasah binaan, bukan sekadar keberadaan dokumen","Jumlah penghargaan yang diterima tanpa melihat dampak implementasi","Popularitas karya di media sosial semata"],"k":2,"p":"Kontribusi nyata karya inovatif dinilai dari tingkat adopsi dan dampak nyata terhadap perbaikan praktik di madrasah binaan, bukan sekadar keberadaan dokumen atau penghargaan formal, memastikan karya benar-benar bermanfaat bagi peningkatan mutu pendidikan.","t":0},{"m":3,"q":"Pak Pengawas Mahmud menutup laporan penelitiannya dengan rekomendasi konkret bagi pengawas lain yang ingin menerapkan temuan serupa di konteks berbeda. Manfaat utama bagian rekomendasi ini adalah...","o":["Menjembatani kesenjangan antara temuan penelitian dan aplikasi praktis, memudahkan pihak lain memanfaatkan hasil penelitian secara langsung","Hanya formalitas penutup laporan","Tidak relevan dengan substansi penelitian","Menggantikan kebutuhan pembaca memahami keseluruhan laporan","Hanya diperlukan untuk penelitian yang akan dipublikasikan secara luas"],"k":0,"p":"Rekomendasi konkret di akhir laporan menjembatani kesenjangan antara temuan penelitian dan aplikasi praktis, memudahkan pihak lain (pengawas, kepala madrasah) memanfaatkan hasil penelitian secara langsung tanpa harus menafsirkan ulang dari data mentah.","t":1},{"m":3,"q":"Untuk memastikan penelitian tindakan yang dilakukan benar-benar bersifat siklikal (berkelanjutan), pengawas perlu melaksanakan minimal...","o":["Satu siklus tanpa pengulangan","Perencanaan tanpa pelaksanaan tindakan nyata","Tindakan tanpa refleksi di setiap tahapnya","Observasi tunggal tanpa tindakan intervensi","Dua siklus atau lebih, di mana refleksi siklus pertama menjadi dasar perbaikan tindakan pada siklus berikutnya"],"k":4,"p":"Penelitian tindakan yang bersifat siklikal memerlukan minimal dua siklus atau lebih, di mana hasil refleksi siklus pertama menjadi dasar perbaikan tindakan pada siklus berikutnya, mencerminkan esensi PTS sebagai proses perbaikan berkelanjutan bukan tindakan satu kali.","t":0},{"m":3,"q":"Rendahnya keterampilan refleksi guru di madrasah binaan mendorong seorang pengawas menyusun panduan coaching yang belum pernah ada. Ia memvalidasi panduan kepada dua ahli, lalu mengujicobakannya kepada lima guru. Jenis penelitian dan alasan yang paling tepat adalah...","o":["Kuasi-eksperimen, karena uji coba kepada lima guru bertujuan membuktikan pengaruh panduan terhadap refleksi.","R&D, karena masalah berasal dari praktik lapangan, sehingga produk tidak memerlukan validasi ahli.","R&D, karena tujuan utamanya menghasilkan panduan yang divalidasi ahli dan diujicobakan secara bertahap.","PTS, karena uji coba kepada lima guru membentuk siklus tindakan, pengamatan, dan refleksi berulang.","PTS, karena penelitian dilakukan pengawas di madrasah binaan untuk memperbaiki praktik kepengawasan."],"k":2,"p":"Tujuan utamanya menghasilkan produk, yaitu panduan yang divalidasi ahli dan diujicobakan. Itu ciri R&D. Siklus tindakan, pengamatan, dan refleksi berulang tidak ada, sehingga bukan PTS. R&D justru memerlukan validasi ahli.","t":2},{"m":3,"q":"Pada siklus I PTS tentang coaching, 5 dari 12 guru menerapkannya dengan benar (41,7 persen), sedangkan indikator keberhasilan 75 persen. Refleksi menemukan 7 guru lain tidak memahami pertanyaan reflektif. Keputusan pengawas yang paling tepat adalah...","o":["Melanjutkan ke siklus II dengan menurunkan indikator keberhasilan agar sesuai dengan kemampuan guru.","Mengulang siklus I dengan tindakan yang sama bagi 7 guru agar capaian naik secara bertahap.","Menghentikan penelitian dan melaporkan bahwa coaching tidak efektif, karena capaian siklus I hanya 41,7 persen.","Melanjutkan ke siklus II dengan memperbaiki tindakan, yaitu melatih guru menyusun pertanyaan reflektif.","Mengganti masalah penelitian, karena hasil siklus I menunjukkan masalah awal tidak sesuai kondisi lapangan."],"k":3,"p":"Capaian 41,7 persen belum memenuhi indikator 75 persen, dan refleksi sudah menunjukkan penyebabnya. PTS bersifat siklikal, sehingga tindakan diperbaiki pada siklus berikutnya. Mengulang tindakan yang sama atau menurunkan indikator tidak memperbaiki penyebab.","t":2},{"m":3,"q":"Saat menulis artikel PTS, rekan menyarankan pengawas menghapus data dua guru yang capaiannya turun agar hasil tampak konsisten. Pengawas juga belum meminta persetujuan guru untuk memuat nama mereka. Tindakan yang paling sesuai dengan etika penelitian adalah...","o":["Melaporkan hanya data guru yang menyetujui, lalu menjelaskan penghapusan data lain sebagai keterbatasan penelitian.","Melaporkan seluruh data apa adanya, meminta persetujuan guru, dan menyamarkan identitas dalam artikel.","Melaporkan seluruh data apa adanya dan memuat nama guru, karena persetujuan sudah tersirat dari keikutsertaan.","Mengganti data dua guru dengan rata-rata kelompok agar hasil tampak wajar dan identitas guru terlindungi.","Menghapus data dua guru itu dan tetap memuat nama guru lain, karena semua guru adalah subjek penelitian."],"k":1,"p":"Etika penelitian menuntut pelaporan data jujur, persetujuan peserta, dan kerahasiaan identitas. Menghapus atau mengganti data adalah manipulasi. Persetujuan tidak boleh dianggap tersirat. Melaporkan data secara selektif juga bias.","t":2}];

const mine=()=>hist().filter(r=>r.nama==NAMA);
const cnt=m=>Q.filter(q=>m<0||q.m==m).length;
function sh(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(ids){
 clearInterval(TM);CF=false;CB=false;
 if(!ids){ids=Q.map((_,i)=>i).filter(i=>cfg.mod<0||Q[i].m==cfg.mod);
  if(cfg.acak)sh(ids);
  if(cfg.hots)ids.sort((a,b)=>(Q[b].t==2)-(Q[a].t==2));
  ids=ids.slice(0,Math.max(1,Math.min(cfg.n,ids.length)));
  if(cfg.acak)sh(ids)}
 S={view:"quiz",ids,i:0,ans:{},flag:{},mode:cfg.mode,end:cfg.mode=="ujian"?Date.now()+cfg.dur*60000:null,mod:cfg.mod};
 if(S.end)TM=setInterval(tick,1000);
 render()}
function tick(){const s=Math.max(0,Math.round((S.end-Date.now())/1000)),el=$("tm");
 if(el)el.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
 if(s<=0)finish()}
function finish(){
 clearInterval(TM);
 const pm=MOD.map(()=>[0,0]),pt=TN.map(()=>[0,0]);let b=0,k=0,wb=0,wt=0;
 S.ids.forEach(id=>{const q=Q[id],a=S.ans[id];pm[q.m][1]++;pt[q.t][1]++;wt+=W[q.t];
  if(a==null)k++;else if(a==q.k){b++;wb+=W[q.t];pm[q.m][0]++;pt[q.t][0]++}});
 const v=wb/wt*100;
 S.res={b,k,s:S.ids.length-b-k,n:S.ids.length,pm,pt,v};S.view="result";FL="semua";
 const h=hist();h.unshift({nama:NAMA,t:new Date().toLocaleDateString("id-ID"),m:S.mod,n:S.ids.length,v,mode:S.mode});
 sv(KEY,JSON.stringify(h.slice(0,80)));
 render()}
const foot=()=>`<p class="foot">Dikembangkan oleh Dedi Efendi (Pengawas Madrasah Kab. Agam)</p>`;
const hdr=()=>`<div class="bar"><span class="tag">Peserta: <b>${esc(NAMA)}</b></span><button class="alt sm" data-a="out">Keluar</button></div>`;
function login(){
 return `<h1>Latihan Soal AKGTK Pengawas Madrasah 2026</h1>
 <p class="mute">Masukkan nama Anda. Riwayat nilai tersimpan di perangkat ini.</p>
 <div class="card"><label for="nm">Nama peserta</label>
 <div class="acts"><input type="text" id="nm" maxlength="40" autocomplete="name" placeholder="Nama lengkap"><button data-a="in">Masuk</button></div>
 <p class="badc" id="er"></p></div>`}
function dash(){
 const m=mine();
 const cards=MOD.map((n,i)=>{const qs=Q.filter(q=>q.m==i),h=qs.filter(q=>q.t==2).length,b=m.filter(r=>r.m==i).reduce((a,r)=>Math.max(a,r.v),-1);
  return `<button class="mc" data-a="open" data-j="${i}"><b>${i+1}. ${n}</b><span class="tag">${qs.length} soal, ${h} HOTS</span><span class="tag">${b<0?"Belum ada nilai":"Nilai terbaik "+fmt(b)}</span></button>`}).join("");
 const rw=m.slice(0,5).map(r=>`<tr><td>${r.t}</td><td>${r.m<0?"Campuran":MOD[r.m]}</td><td>${r.mode}</td><td>${fmt(r.v)}</td></tr>`).join("");
 return hdr()+`<h1>Dashboard</h1><p class="mute">Pilih aspek yang ingin Anda latih. Nilai dihitung dengan bobot: Dasar 1, Kasus 2, HOTS 3.</p>
 <div class="mg">${cards}</div><div class="acts"><button class="alt" data-a="open" data-j="-1">Latihan campuran semua aspek</button></div>
 ${rw?`<h2>Riwayat terakhir</h2><div class="card"><table><tr><th>Tanggal</th><th>Aspek</th><th>Mode</th><th>Nilai</th></tr>${rw}</table></div>`:""}`}
function setup(){
 const c=cnt(cfg.mod);
 return hdr()+`<h1>${cfg.mod<0?"Campuran semua aspek":MOD[cfg.mod]}</h1><p class="mute">${c} soal tersedia.</p>
 <div class="card">
 <div class="row"><label for="cn">Jumlah soal</label><input type="number" id="cn" min="1" max="${c}" value="${cfg.n}"></div>
 <div class="row"><label for="cmd">Mode</label><select id="cmd"><option value="latihan" ${cfg.mode=="latihan"?"selected":""}>Latihan: pembahasan langsung</option><option value="ujian" ${cfg.mode=="ujian"?"selected":""}>Ujian: hasil di akhir, ada pewaktu</option></select></div>
 <div class="row"><label for="cd">Durasi mode ujian (menit)</label><input type="number" id="cd" min="1" max="300" value="${cfg.dur}"></div>
 <div class="row"><label for="ca">Acak urutan soal</label><input type="checkbox" id="ca" ${cfg.acak?"checked":""}></div>
 <div class="row"><label for="ch">Utamakan soal HOTS</label><input type="checkbox" id="ch" ${cfg.hots?"checked":""}></div>
 <div class="acts"><button data-a="go0">Mulai</button><button class="alt" data-a="dash">Kembali</button></div></div>`}
function quiz(){
 const id=S.ids[S.i],q=Q[id],a=S.ans[id],lock=S.mode=="latihan"&&a!=null,n=S.ids.length;
 const opts=q.o.map((t,j)=>{let c="opt";if(lock)c+=j==q.k?" ok":j==a?" no":"";else if(a==j)c+=" sel";
  return `<button class="${c}" data-a="pick" data-j="${j}"><b>${L[j]}.</b><span>${esc(t)}</span></button>`}).join("");
 const nav=S.ids.map((x,i)=>`<button data-a="go" data-j="${i}" class="${S.ans[x]!=null?"done ":""}${S.flag[x]?"fl ":""}${i==S.i?"cur":""}" aria-label="Soal ${i+1}">${i+1}</button>`).join("");
 const last=S.i==n-1,un=S.ids.filter(x=>S.ans[x]==null).length;
 return hdr()+`<div class="bar"><span class="tag">${MOD[q.m]}, soal ${S.i+1} dari ${n}, ${TN[q.t]} (bobot ${W[q.t]})</span>${S.end?`<b id="tm"></b>`:""}</div>
 <div class="card"><p class="q">${esc(q.q)}</p>${opts}${lock?`<p class="pem"><b>${a==q.k?"Benar.":"Salah. Kunci: "+L[q.k]+"."}</b> ${esc(q.p)}</p>`:""}
 <div class="acts"><button class="alt" data-a="prev" ${S.i?"":"disabled"}>Sebelumnya</button>
 ${last?`<button data-a="fin">${CF&&un?`Masih ${un} kosong. Klik lagi untuk kumpulkan`:"Kumpulkan"}</button>`:`<button data-a="next">Berikutnya</button>`}
 ${S.mode=="ujian"?`<button class="alt" data-a="flag">${S.flag[id]?"Hapus tanda ragu":"Tandai ragu"}</button>`:""}</div></div>
 <div class="card"><div class="tag">Navigasi soal</div><div class="nav">${nav}</div>
 <div class="acts">${last?"":`<button class="alt" data-a="fin">${CF?"Klik lagi untuk kumpulkan":"Kumpulkan sekarang"}</button>`}<button class="alt" data-a="back">${CB?"Klik lagi untuk keluar tanpa menyimpan":"Kembali ke dashboard"}</button></div></div>`}
function result(){
 const r=S.res;
 const tb=(h,arr,nm)=>`<div class="card"><table><tr><th>${h}</th><th>Benar</th><th>Nilai</th></tr>${arr.map((x,i)=>x[1]?`<tr><td>${nm(i)}</td><td>${x[0]} dari ${x[1]}</td><td>${fmt(x[0]/x[1]*100)}</td></tr>`:"").join("")}</table></div>`;
 const list=S.ids.map((id,i)=>{const q=Q[id],a=S.ans[id],st=a==null?"kosong":a==q.k?"benar":"salah";
  if(FL!="semua"&&FL!=st)return"";
  return `<div class="rv"><div class="tag">Soal ${i+1}, ${MOD[q.m]}, ${TN[q.t]}</div><p class="q">${esc(q.q)}</p>
  <div class="${st=="benar"?"good":"badc"}">Jawaban Anda: ${a==null?"kosong":L[a]+". "+esc(q.o[a])}</div>
  <div class="good">Kunci: ${L[q.k]}. ${esc(q.o[q.k])}</div><p class="pem">${esc(q.p)}</p></div>`}).join("");
 return hdr()+`<h1>Hasil latihan</h1><div class="card"><div class="big">${fmt(r.v)}</div><div class="mute">Nilai berbobot. ${r.b} benar, ${r.s} salah, ${r.k} kosong dari ${r.n} soal.</div></div>
 ${tb("Aspek",r.pm,i=>MOD[i])}${tb("Tingkat soal",r.pt,i=>TN[i]+" (bobot "+W[i]+")")}
 <div class="acts"><button data-a="retry" ${r.s+r.k?"":"disabled"}>Ulangi soal yang salah dan kosong</button><button class="alt" data-a="dash">Kembali ke dashboard</button></div>
 <h2>Pembahasan</h2><div class="acts">${["semua","salah","kosong","benar"].map(f=>`<button class="${f==FL?"":"alt"}" data-a="fl" data-f="${f}">${f}</button>`).join("")}</div>${list||`<p class="mute">Tidak ada soal pada kategori ini.</p>`}`}
function render(keep){
 const v=S.view;
 $("app").innerHTML=(v=="login"?login():v=="dash"?dash():v=="setup"?setup():v=="quiz"?quiz():result())+foot();
 if(v=="quiz"&&S.end)tick();
 if(!keep)window.scrollTo(0,0)}
function signIn(){
 const n=$("nm").value.trim();
 if(!n){$("er").textContent="Nama wajib diisi.";return}
 NAMA=n;sv(NK,n);S={view:"dash"};render()}
function rd(){cfg.n=+$("cn").value||40;cfg.mode=$("cmd").value;cfg.dur=+$("cd").value||60;cfg.acak=$("ca").checked;cfg.hots=$("ch").checked}
$("app").addEventListener("keydown",e=>{if(e.key=="Enter"&&e.target.id=="nm")signIn()});
$("app").addEventListener("click",e=>{
 const b=e.target.closest("button[data-a]");if(!b)return;
 const a=b.dataset.a,j=+b.dataset.j,id=S.ids&&S.ids[S.i];
 if(a=="in")signIn();
 else if(a=="out"){clearInterval(TM);NAMA="";sv(NK,"");S={view:"login"};render()}
 else if(a=="open"){cfg.mod=j;cfg.n=Math.min(40,cnt(j));S={view:"setup"};render()}
 else if(a=="go0"){rd();start()}
 else if(a=="dash"){S={view:"dash"};render()}
 else if(a=="back"){if(!CB){CB=true;render(true)}else{clearInterval(TM);CB=false;S={view:"dash"};render()}}
 else if(a=="pick"){if(S.mode=="latihan"&&S.ans[id]!=null)return;S.ans[id]=j;CF=false;CB=false;render(true)}
 else if(a=="go"){S.i=j;CF=false;render()}
 else if(a=="prev"){S.i--;render()}
 else if(a=="next"){S.i++;render()}
 else if(a=="flag"){S.flag[id]=!S.flag[id];render(true)}
 else if(a=="fin"){const un=S.ids.filter(x=>S.ans[x]==null).length;if(un&&!CF){CF=true;render(true)}else finish()}
 else if(a=="fl"){FL=b.dataset.f;render(true)}
 else if(a=="retry"){const ids=S.ids.filter(x=>S.ans[x]!==Q[x].k);cfg.mode="latihan";start(ids)}});
const n0=ld(NK);if(n0){NAMA=n0;S={view:"dash"}}
render();
</script>
</body>
</html>
